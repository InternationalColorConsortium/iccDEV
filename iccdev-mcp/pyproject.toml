[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iccdev-mcp"
version = "0.1.0"
description = "MCP server for ICC color profile tools (iccDEV)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "International Color Consortium" },
]
keywords = ["icc", "color", "profile", "mcp", "color-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.26.0",
]

[project.optional-dependencies]
native = []
rest = ["starlette>=0.37.0", "uvicorn>=0.29.0"]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.28,<1"]

[project.scripts]
iccdev-mcp = "iccdev_mcp.server:main"
iccdev-mcp-rest = "iccdev_mcp.rest_api:main"

[project.urls]
Homepage = "https://github.com/InternationalColorConsortium/iccDEV"
Documentation = "https://github.com/InternationalColorConsortium/iccDEV/tree/master/iccdev-mcp"
Issues = "https://github.com/InternationalColorConsortium/iccDEV/issues"

[tool.hatch.build.targets.wheel]
packages = ["iccdev_mcp", "iccdev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"
