Source:
  - any:
      - 'IccProfLib/**/*.cpp'
      - 'IccProfLib/**/*.h'
      - 'IccProfLib/**/*.hpp'
      - 'IccXML/**/*.cpp'
      - 'IccXML/**/*.h'
      - 'IccXML/**/*.hpp'
      - 'Tools/**/**/*.cpp'
      - 'Tools/**/**/*.h'
      - 'Tools/**/**/*.hpp'

Documentation:
  - any:
      - 'docs/*.md'
      - '*.md'
      - 'LICENSE*'
      - 'SECURITY*'
      - 'README*'
      - 'CHANGELOG*'

Configuration:
  - any:
      - '**/**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.cmake'
      - 'config/**/*.txt'

CI:
  - any:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

Scripts:
  - any:
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'scripts/**/*.zsh'
      - 'scripts/**/*.ps1'

Licenses:
  - any:
      - 'LICENSE*'
      - 'COPYING*'

Tools:
  - any:
      - 'Tools/**'

Profiles:
  - any:
      - 'profiles/**'

Build:
  - any:
      - 'Build/**'
