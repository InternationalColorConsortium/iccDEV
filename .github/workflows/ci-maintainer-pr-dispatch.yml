## Intent: Dispatch bounded PR validation from an explicit maintainer label.
#
###############################################################

name: ci-maintainer-pr-dispatch

permissions:
  contents: read

"on":
  # zizmor: ignore[dangerous-triggers] trusted metadata-only maintainer dispatcher
  pull_request_target:
    branches:
      - master
    types:
      - labeled

concurrency:
  group: "maintainer-pr-dispatch-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'ci:run-auto'
    name: Dispatch auto-scoped PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write

    steps:
      # preflight: allow-token-exposure reason=maintainer-pr-validation-dispatch
      - name: Dispatch validation for an authorized same-repository PR
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number" >&2
            exit 1
          fi
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid pull request head SHA" >&2
            exit 1
          fi

          actor_permission="$(gh api \
            "repos/${GH_REPOSITORY}/collaborators/${EVENT_ACTOR}/permission" \
            --jq '.permission')"
          case "$actor_permission" in
            admin|maintain|write)
              ;;
            *)
              echo "Label actor lacks repository write permission" >&2
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          if [[ "$state" != "open" || "$base_ref" != "master" ]]; then
            echo "PR must be open and target master" >&2
            exit 1
          fi
          if [[ "$head_repository" != "$GH_REPOSITORY" ]]; then
            echo "PR must use a same-repository head" >&2
            exit 1
          fi
          if [[ "$head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "PR head changed after the label event; reapply ci:run-auto" >&2
            exit 1
          fi
          gh workflow run ci-pr-action.yml --repo "$GH_REPOSITORY" \
            --ref master \
            -f pr_number="$PR_NUMBER" \
            -f expected_head_sha="$EVENT_HEAD_SHA" \
            -f ci_scope=auto
          gh pr edit "$PR_NUMBER" --repo "$GH_REPOSITORY" --remove-label ci:run-auto
