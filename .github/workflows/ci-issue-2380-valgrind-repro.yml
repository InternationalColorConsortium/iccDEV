---
###############################################################
#
# Copyright (c) 2026 International Color Consortium.
#                 All rights reserved.
#                 https://color.org
#
# Intent: Manual Valgrind/Helgrind proof-of-concept workflow for issue #2380.
#
# This is a bounded regression demonstrator, not a production fuzzing service.
# Issue #1948 retains its independent strict-aliasing reproduction workflow.
#
###############################################################

name: "Issue 2380 Valgrind and Helgrind PoC"

# yamllint disable rule:line-length

permissions:
  contents: read
  packages: read

'on':
  workflow_dispatch:
    inputs:
      target_kind:
        description: 'How target_value is resolved'
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - branch
          - ref
      target_value:
        description: 'PR number, branch name, full commit SHA, or refs/tags/...'
        required: true
        default: '2378'
        type: string
      scenario:
        description: 'PR #2378 red/green proof or clean selected-target check'
        required: true
        default: pr-2378-before-after
        type: choice
        options:
          - pr-2378-before-after
          - target-clean
      valgrind_tool:
        description: 'Valgrind analyzer'
        required: true
        default: both
        type: choice
        options:
          - both
          - helgrind
          - memcheck
      repeat_count:
        description: 'Runs per analyzer and state, 1-10'
        required: true
        default: '3'
        type: string
      regression_image_tag:
        description: 'Trusted unified iccDEV image tag'
        required: false
        default: latest
        type: string

concurrency:
  group: >-
    issue-2380-valgrind-${{ github.workflow }}-${{
    inputs.target_kind }}-${{ inputs.target_value }}
  cancel-in-progress: false

jobs:
  valgrind-poc:
    name: "${{ inputs.scenario }} (${{ inputs.valgrind_tool }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: >-
        ghcr.io/internationalcolorconsortium/iccdev:${{
        inputs.regression_image_tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      TRUSTED_ROOT: ${{ github.workspace }}/trusted
      TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts

    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: |
            .github/scripts
            .github/ci/regression/pr-2378-helgrind-before.patch
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout target seed
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR, branch, or ref
        id: resolve
        working-directory: target
        env:
          BASH_ENV: /dev/null
          TARGET_KIND_INPUT: ${{ inputs.target_kind }}
          TARGET_VALUE_INPUT: ${{ inputs.target_value }}
          SCENARIO_INPUT: ${{ inputs.scenario }}
          REPEAT_COUNT_INPUT: ${{ inputs.repeat_count }}
          VALGRIND_TOOL_INPUT: ${{ inputs.valgrind_tool }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          git config --global --add safe.directory "$PWD"

          case "$REPEAT_COUNT_INPUT" in
            ''|0*|*[!0-9]*)
              echo "ERROR: repeat_count must be an integer from 1 through 10" >&2
              exit 2
              ;;
          esac
          repeat_count=$((10#$REPEAT_COUNT_INPUT))
          if [ "$repeat_count" -lt 1 ] || [ "$repeat_count" -gt 10 ]; then
            echo "ERROR: repeat_count must be an integer from 1 through 10" >&2
            exit 2
          fi
          case "$SCENARIO_INPUT" in
            pr-2378-before-after|target-clean) ;;
            *) echo "ERROR: unsupported scenario" >&2; exit 2 ;;
          esac
          case "$VALGRIND_TOOL_INPUT" in
            both|helgrind|memcheck) ;;
            *) echo "ERROR: unsupported valgrind_tool" >&2; exit 2 ;;
          esac

          case "$TARGET_KIND_INPUT" in
            pull-request)
              case "$TARGET_VALUE_INPUT" in
                ''|0*|*[!0-9]*)
                  echo "ERROR: pull-request target_value must be a positive integer" >&2
                  exit 2
                  ;;
              esac
              git fetch --no-tags --depth=1 origin \
                "pull/$TARGET_VALUE_INPUT/head"
              ;;
            branch)
              if ! git check-ref-format "refs/heads/$TARGET_VALUE_INPUT"; then
                echo "ERROR: invalid branch target_value: $(sanitize_line "$TARGET_VALUE_INPUT")" >&2
                exit 2
              fi
              git fetch --no-tags --depth=1 origin \
                "refs/heads/$TARGET_VALUE_INPUT"
              ;;
            ref)
              if [[ "$TARGET_VALUE_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
                git fetch --no-tags --depth=1 origin "$TARGET_VALUE_INPUT"
              elif [[ "$TARGET_VALUE_INPUT" == refs/tags/* ]] &&
                   git check-ref-format "$TARGET_VALUE_INPUT"; then
                git fetch --no-tags --depth=1 origin "$TARGET_VALUE_INPUT"
              else
                echo "ERROR: ref target_value must be a full SHA or refs/tags/..." >&2
                exit 2
              fi
              ;;
            *)
              echo "ERROR: unsupported target_kind: $(sanitize_line "$TARGET_KIND_INPUT")" >&2
              exit 2
              ;;
          esac

          git checkout --detach FETCH_HEAD
          resolved_sha="$(git rev-parse HEAD)"
          if [ "$SCENARIO_INPUT" = "pr-2378-before-after" ] &&
             { [ "$TARGET_KIND_INPUT" != "pull-request" ] ||
               [ "$TARGET_VALUE_INPUT" != "2378" ]; }; then
            echo "ERROR: pr-2378-before-after requires pull-request target 2378" >&2
            exit 2
          fi
          printf 'resolved_sha=%s\n' "$(sanitize_line "$resolved_sha")" >> "$GITHUB_OUTPUT"

      # preflight: allow-pr-script-execution reason=manual-readonly-valgrind-reproduction
      - name: Run bounded Valgrind proof
        working-directory: target
        env:
          BASH_ENV: /dev/null
          REPEAT_COUNT_INPUT: ${{ inputs.repeat_count }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.resolved_sha }}
          SCENARIO_INPUT: ${{ inputs.scenario }}
          TARGET_KIND_INPUT: ${{ inputs.target_kind }}
          TARGET_VALUE_INPUT: ${{ inputs.target_value }}
          VALGRIND_TOOL_INPUT: ${{ inputs.valgrind_tool }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"

          qa="$TRUSTED_SCRIPTS/iccdev-valgrind-qa.sh"
          work_root="$RUNNER_TEMP/iccdev-valgrind-poc"
          selected_src="$work_root/selected"
          before_src="$work_root/before"
          mkdir -p "$work_root"
          cp -a "$PWD" "$selected_src"

          run_qa()
          {
            local source_dir="$1"
            local state="$2"
            local analyzer="$3"
            local expectation="$4"
            "$qa" \
              --source-dir "$source_dir" \
              --build-dir "$work_root/build-$state" \
              --tool "$analyzer" \
              --expect "$expectation" \
              --runs "$REPEAT_COUNT_INPUT" \
              --label "$state" \
              --out-dir "$work_root/logs/$state-$analyzer"
          }

          append_summary_log()
          {
            local heading="$1"
            local log="$2"
            local line
            local line_count=0
            [ -f "$log" ] || return 0
            {
              echo ""
              echo "### $(sanitize_line "$heading")"
              echo '```text'
              while IFS= read -r line && [ "$line_count" -lt 200 ]; do
                printf '%s\n' "$(sanitize_code_line "$line")"
                line_count=$((line_count + 1))
              done < "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
          }

          if [ "$SCENARIO_INPUT" = "pr-2378-before-after" ]; then
            cp -a "$selected_src" "$before_src"
            git -C "$before_src" apply \
              "$TRUSTED_ROOT/.github/ci/regression/pr-2378-helgrind-before.patch"
            if [ "$VALGRIND_TOOL_INPUT" = "helgrind" ] ||
               [ "$VALGRIND_TOOL_INPUT" = "both" ]; then
              run_qa "$before_src" before helgrind finding
              run_qa "$selected_src" after helgrind clean
            fi
            if [ "$VALGRIND_TOOL_INPUT" = "memcheck" ] ||
               [ "$VALGRIND_TOOL_INPUT" = "both" ]; then
              run_qa "$before_src" before memcheck clean
              run_qa "$selected_src" after memcheck clean
            fi
          else
            if [ "$VALGRIND_TOOL_INPUT" = "helgrind" ] ||
               [ "$VALGRIND_TOOL_INPUT" = "both" ]; then
              run_qa "$selected_src" selected helgrind clean
            fi
            if [ "$VALGRIND_TOOL_INPUT" = "memcheck" ] ||
               [ "$VALGRIND_TOOL_INPUT" = "both" ]; then
              run_qa "$selected_src" selected memcheck clean
            fi
          fi

          {
            echo "## Issue #2380 Valgrind/Helgrind PoC"
            echo ""
            echo "- Scenario: \`$(sanitize_line "$SCENARIO_INPUT")\`"
            echo "- Target kind: \`$(sanitize_line "$TARGET_KIND_INPUT")\`"
            echo "- Target value: \`$(sanitize_line "$TARGET_VALUE_INPUT")\`"
            echo "- Resolved commit: \`$(sanitize_line "$RESOLVED_SHA")\`"
            echo "- Analyzer: \`$(sanitize_line "$VALGRIND_TOOL_INPUT")\`"
            echo "- Runs per state: \`$(sanitize_line "$REPEAT_COUNT_INPUT")\`"
            echo ""
            echo "The PR #2378 comparison expects Helgrind exit 99 before the fix"
            echo "and a clean exit after it. Memcheck is a clean control in both states."
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

          append_summary_log "Before: Helgrind finding" \
            "$work_root/logs/before-helgrind/helgrind-1.log"
          append_summary_log "After: Helgrind clean" \
            "$work_root/logs/after-helgrind/helgrind-1.log"
          append_summary_log "Before control: Memcheck clean" \
            "$work_root/logs/before-memcheck/memcheck-1.log"
          append_summary_log "After control: Memcheck clean" \
            "$work_root/logs/after-memcheck/memcheck-1.log"
          append_summary_log "Selected target: Helgrind clean" \
            "$work_root/logs/selected-helgrind/helgrind-1.log"
          append_summary_log "Selected target: Memcheck clean" \
            "$work_root/logs/selected-memcheck/memcheck-1.log"
