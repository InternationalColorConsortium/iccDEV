name: ci-matlab

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - ci-qa-matlab-examples
    paths:
      - ".github/workflows/ci-matlab.yml"
      - "Build/Cmake/**"
      - "IccProfLib/**"
      - "matlab/**"
      - "Testing/Display/sRGB_D65_MAT.xml"
      - "Testing/Display/sRGB_D65_MAT-300lx.xml"
      - "Testing/Display/sRGB_D65_MAT-500lx.xml"
      - "Testing/HDR/BT2100PQFullDisplay.xml"
      - "Testing/sRGB_v4_ICC_preference.icc"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/ci-matlab.yml"
      - "Build/Cmake/**"
      - "IccProfLib/**"
      - "matlab/**"
      - "Testing/Display/sRGB_D65_MAT.xml"
      - "Testing/Display/sRGB_D65_MAT-300lx.xml"
      - "Testing/Display/sRGB_D65_MAT-500lx.xml"
      - "Testing/HDR/BT2100PQFullDisplay.xml"
      - "Testing/sRGB_v4_ICC_preference.icc"
  workflow_dispatch:

concurrency:
  group: "ci-matlab-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MATLAB MEX
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}

    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          path: .trusted-helpers
          persist-credentials: false

      - name: Set up MATLAB
        # matlab-actions/setup-matlab v3
        uses: matlab-actions/setup-matlab@2323adb8243827ea460b0def4c413545aaec46a9
        with:
          release: R2026a

      - name: Reproduce luminance normalization calculations
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@75644028e1e2aa374bbfdc968a65718a178cc264
        with:
          command: >-
            addpath('matlab');
            addpath(fullfile('matlab', 'tests'));
            test_luminance_normalization();
            run(fullfile('matlab', 'examples', 'luminance_normalization.m'))
          generate-summary: false

      - name: Configure and build IccProfLib
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) {
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          }
          . .trusted-helpers/.github/scripts/sanitize.ps1

          cmake -S Build\Cmake -B out\matlab `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DENABLE_TESTS=ON `
            -DENABLE_TOOLS=OFF `
            -DENABLE_WXWIDGETS=OFF `
            -DENABLE_SHARED_LIBS=OFF `
            -DENABLE_STATIC_LIBS=ON `
            -DENABLE_ICCXML=OFF `
            -DENABLE_ICCJSON=OFF `
            -DENABLE_IMAGE_TOOLS=OFF `
            -DENABLE_CMM_TOOLS=OFF `
            -DENABLE_IIS_TOOLS=OFF `
            -DICC_USE_ZLIB=OFF `
            -Wno-dev
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }

          cmake --build out\matlab --config Release `
            --target IccProfLib2-static iccLuminanceNormalizationTest --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Native luminance test build failed with exit code $LASTEXITCODE"
          }

      - name: Run native luminance regression
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) {
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          }
          . .trusted-helpers/.github/scripts/sanitize.ps1

          ctest --test-dir out\matlab -C Release `
            -R '^iccdev\.luminance-normalization$' `
            --output-on-failure `
            --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            throw "Native luminance regression failed with exit code $LASTEXITCODE"
          }

      - name: Build MATLAB MEX gateway
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@75644028e1e2aa374bbfdc968a65718a178cc264
        with:
          command: >-
            addpath('matlab');
            build_mex('BuildDir', fullfile(pwd, 'out', 'matlab'))
          generate-summary: false

      - name: Run MATLAB QA
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@75644028e1e2aa374bbfdc968a65718a178cc264
        with:
          command: >-
            addpath('matlab');
            addpath(fullfile('matlab', 'tests'));
            run_local_qa();
            run(fullfile('matlab', 'examples', 'read_profile.m'));
            run(fullfile('matlab', 'examples', 'color_transform.m'))
          generate-summary: false

  docker-interop:
    name: MATLAB Docker interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          path: .trusted-helpers
          persist-credentials: false

      - name: Set up MATLAB
        # matlab-actions/setup-matlab v3
        uses: matlab-actions/setup-matlab@2323adb8243827ea460b0def4c413545aaec46a9
        with:
          release: R2026a

      - name: Pull published container
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          ICCDEV_IMAGE: >-
            ghcr.io/internationalcolorconsortium/iccdev@sha256:b003dcfdc04776035b51d9cdc03f90d62cc70c745da321ae29e182075bf2845d
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-helpers/.github/scripts/sanitize-sed.sh

          docker pull "${ICCDEV_IMAGE}"

      - name: Validate published container from MATLAB
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@75644028e1e2aa374bbfdc968a65718a178cc264
        env:
          ICCDEV_IMAGE: >-
            ghcr.io/internationalcolorconsortium/iccdev@sha256:b003dcfdc04776035b51d9cdc03f90d62cc70c745da321ae29e182075bf2845d
        with:
          command: >-
            addpath('matlab');
            run_docker_qa(getenv('ICCDEV_IMAGE'))
          generate-summary: false
