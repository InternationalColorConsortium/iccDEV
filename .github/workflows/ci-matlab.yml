name: ci-matlab

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: "ci-matlab-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MATLAB MEX
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ICCDEV_VCPKG_EXPORT_URL: >-
        https://github.com/InternationalColorConsortium/iccDEV/releases/download/vcpkg-win-2324-libheif-deps/iccdev-windows-vcpkg-classic-libheif-04a9d8e.zip
      ICCDEV_VCPKG_EXPORT_SHA256: 89ba13a04b883bbe5f97b5baabe15a508ff431c081e73c72022532ccfed5cb7e
    defaults:
      run:
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}

    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          path: .trusted-helpers
          persist-credentials: false

      - name: Set up MATLAB
        # matlab-actions/setup-matlab v3
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d
        with:
          release: R2026a

      - name: Run dependency-free MATLAB checks
        # matlab-actions/run-command v3
        # These checks use MATLAB code plus checked-in tables and fixtures, so
        # they run before the native build rather than depending on it.
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            addpath('matlab');
            addpath(fullfile('matlab', 'tests'));
            test_usage_guidance();
            test_delta_e_2000();
            run(fullfile('matlab', 'examples', 'ciede2000.m'));
            test_luminance_normalization();
            run(fullfile('matlab', 'examples', 'luminance_normalization.m'));
            test_colorimetry_issue_1475();
            run(fullfile('matlab', 'examples', 'colorimetry_issue_1475.m'))
          generate-summary: false

      - name: Fetch pinned vcpkg dependencies
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) {
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          }
          . .trusted-helpers/.github/scripts/sanitize.ps1

          $archive = Join-Path $env:RUNNER_TEMP 'vcpkg-exported-deps.zip'
          Invoke-WebRequest -Uri $env:ICCDEV_VCPKG_EXPORT_URL -OutFile $archive
          $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualDigest -ne $env:ICCDEV_VCPKG_EXPORT_SHA256) {
            throw "vcpkg export digest mismatch: $actualDigest"
          }
          tar -xf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg export extraction failed with exit code $LASTEXITCODE"
          }
          Remove-Item -LiteralPath $archive -Force

          $toolchain = Join-Path $env:GITHUB_WORKSPACE `
            'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path $toolchain -PathType Leaf)) {
            throw "Exported vcpkg CMake toolchain not found: $toolchain"
          }

      - name: Configure and build current iccDEV source
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) {
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          }
          . .trusted-helpers/.github/scripts/sanitize.ps1

          $toolchain = Join-Path $env:GITHUB_WORKSPACE `
            'scripts\buildsystems\vcpkg.cmake'
          $configureArgs = @(
            '-S', 'Build\Cmake'
            '-B', 'out\matlab'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DVCPKG_MANIFEST_MODE=OFF'
            '-DENABLE_TESTS=ON'
            '-DENABLE_TOOLS=ON'
            '-DENABLE_WXWIDGETS=OFF'
            '-DENABLE_SHARED_LIBS=OFF'
            '-DENABLE_STATIC_LIBS=ON'
            '-DENABLE_ICCXML=OFF'
            '-DENABLE_ICCJSON=ON'
            '-DENABLE_IMAGE_TOOLS=ON'
            '-DENABLE_CMM_TOOLS=OFF'
            '-DENABLE_IIS_TOOLS=OFF'
            '-DICC_USE_ZLIB=OFF'
            '-Wno-dev'
          )
          cmake @configureArgs
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }

          $buildArgs = @(
            '--build', 'out\matlab'
            '--config', 'Release'
            '--target'
            'IccProfLib2-static'
            'IccJSON2-static'
            'iccToJson'
            'iccFromJson'
            'iccHeifDump'
            'iccProfilePlot'
            'iccPawgReport'
            'iccPawgQ1QualityContractTest'
            'iccLuminanceNormalizationTest'
            'iccColorimetryMethodsTest'
            '--parallel'
          )
          cmake @buildArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Native regression test build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path 'out\matlab\bin\Release\iccHeifDump.exe' -PathType Leaf)) {
            throw 'iccHeifDump was not built for MATLAB QA'
          }
          if (-not (Test-Path 'installed\x64-windows\bin\heif.dll' -PathType Leaf)) {
            throw 'libheif runtime was not found in the dependency export'
          }

      - name: Run native MATLAB regressions
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) {
            Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          }
          . .trusted-helpers/.github/scripts/sanitize.ps1

          $nativeRegressionPattern = (
            '^iccdev\.(' +
            'luminance-normalization|' +
            'colorimetry-methods|' +
            'pawg-q1-quality-contract)$'
          )
          ctest --test-dir out\matlab -C Release `
            --parallel ([Environment]::ProcessorCount) `
            -R $nativeRegressionPattern `
            --output-on-failure `
            --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            throw "Native regressions failed with exit code $LASTEXITCODE"
          }

      - name: Build MATLAB MEX gateway
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            addpath('matlab');
            build_mex('BuildDir', fullfile(pwd, 'out', 'matlab'))
          generate-summary: false

      - name: Run MATLAB QA
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            addpath('matlab');
            setenv('ICCDEV_BUILD_DIR', fullfile(pwd, 'out', 'matlab'));
            setenv('PATH', [fullfile(pwd, 'installed', 'x64-windows', 'bin') pathsep getenv('PATH')]);
            assert(strcmp(mexext(), 'mexw64'), 'Expected Windows x64 MEX support.');
            run_ci_qa()
          generate-summary: false

  unix:
    name: Native MATLAB (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            architecture: x86_64
            mex-extension: mexa64
          - platform: macOS Apple Silicon
            runner: macos-15
            architecture: arm64
            mex-extension: mexmaca64
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      EXPECTED_ARCH: ${{ matrix.architecture }}
      EXPECTED_MEX: ${{ matrix.mex-extension }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          path: .trusted-helpers
          persist-credentials: false

      # preflight: allow-package-install reason=unprivileged-native-matlab-build-dependencies
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-helpers/.github/scripts/sanitize-sed.sh
          test "$(uname -m)" = "$EXPECTED_ARCH"
          if [ "$RUNNER_OS" = Linux ]; then
            bash .trusted-helpers/.github/scripts/ci-safe-apt-update.sh
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config libheif-dev libpng-dev libtiff-dev \
              libjpeg-dev nlohmann-json3-dev zlib1g-dev
          else
            packages=(pkgconf libheif libpng libtiff jpeg-turbo nlohmann-json zlib)
            missing=()
            for package in "${packages[@]}"; do
              if ! brew list --versions "$package" >/dev/null 2>&1; then
                missing+=("$package")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              brew install "${missing[@]}"
            fi
          fi

      - name: Build focused native tools
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-helpers/.github/scripts/sanitize-sed.sh
          options=()
          if [ "$RUNNER_OS" = macOS ]; then
            jpeg_prefix="$(brew --prefix jpeg-turbo)"
            options+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)"
              "-DJPEG_LIBRARY=$jpeg_prefix/lib/libjpeg.dylib"
              "-DJPEG_INCLUDE_DIR=$jpeg_prefix/include")
          fi
          cmake -S Build/Cmake -B out/matlab \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF \
            -DENABLE_TOOLS=ON -DENABLE_WXWIDGETS=OFF \
            -DENABLE_SHARED_LIBS=OFF -DENABLE_STATIC_LIBS=ON \
            -DENABLE_ICCXML=OFF -DENABLE_ICCJSON=ON \
            -DENABLE_IMAGE_TOOLS=ON -DENABLE_CMM_TOOLS=OFF \
            -DENABLE_IIS_TOOLS=OFF -DICC_USE_ZLIB=ON "${options[@]}"
          cmake --build out/matlab --parallel 4 --target \
            IccProfLib2-static IccJSON2-static iccToJson iccFromJson \
            iccHeifDump iccProfilePlot iccPawgReport

      - name: Set up MATLAB compatibility floor
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d
        with:
          release: R2023b

      - name: Build platform-native MATLAB MEX gateway
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            assert(strcmp(mexext(), getenv('EXPECTED_MEX')), 'Unexpected native MEX architecture.');
            addpath('matlab');
            build_mex('BuildDir', fullfile(pwd, 'out', 'matlab'))
          generate-summary: false

      - name: Run shared native MATLAB QA
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            addpath('matlab');
            setenv('ICCDEV_BUILD_DIR', fullfile(pwd, 'out', 'matlab'));
            run_ci_qa()
          generate-summary: false

  docker-interop:
    name: MATLAB Docker interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ICCDEV_IMAGE_REPOSITORY: ghcr.io/internationalcolorconsortium/iccdev
      ICCDEV_IMAGE_DIGEST: sha256:0504c43e0204e36aa36377fceee1de9c5f49468d578202c388525c75d42da079

    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        # actions/checkout v5.0.0 (node24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          path: .trusted-helpers
          persist-credentials: false

      - name: Set up MATLAB
        # matlab-actions/setup-matlab v3
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d
        with:
          release: R2026a

      - name: Pull published container
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-helpers/.github/scripts/sanitize-sed.sh

          docker pull "${ICCDEV_IMAGE_REPOSITORY}@${ICCDEV_IMAGE_DIGEST}"

      - name: Validate published container from MATLAB
        # matlab-actions/run-command v3
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: >-
            addpath('matlab');
            run_docker_qa(strcat(getenv('ICCDEV_IMAGE_REPOSITORY'), '@', getenv('ICCDEV_IMAGE_DIGEST')))
          generate-summary: false
