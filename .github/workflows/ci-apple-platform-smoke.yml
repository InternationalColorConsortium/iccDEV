---
# yamllint disable rule:line-length
name: Apple platform smoke

'on':
  workflow_call:
    inputs:
      scope:
        description: Apple smoke surface
        required: false
        type: string
        default: core
      target-sha:
        description: Exact source commit for PR validation
        required: false
        type: string
        default: ''
      base-sha:
        description: Trusted base commit for summary helpers
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      scope:
        description: Apple smoke surface
        required: true
        default: core
        type: choice
        options:
          - core
          - xcode
          - examples
          - all

permissions:
  contents: read

concurrency:
  group: apple-smoke-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: Checkout test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - name: Checkout trusted summary helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base-sha || github.event.pull_request.base.sha || github.sha }}
          path: base
          sparse-checkout: .github/scripts
          persist-credentials: false

      # preflight: allow-package-install reason=apple-mobile-extended-core-json-header-dependency
      - name: Install Apple extended-core dependency headers
        if: inputs.scope == 'core' || inputs.scope == 'all'
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          # shellcheck source=.github/scripts/sanitize-sed.sh
          source "$GITHUB_WORKSPACE/base/.github/scripts/sanitize-sed.sh"
          if ! brew list --versions nlohmann-json >/dev/null; then
            brew install nlohmann-json
          fi

      # preflight: allow-pr-script-execution reason=native-apple-host-test-only
      - name: Exercise Apple simulator hosts
        if: inputs.scope == 'core' || inputs.scope == 'all'
        env:
          BASH_ENV: /dev/null
          ICCDEV_APPLE_DOWNLOAD_RUNTIME: '1'
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          targets=(ios ipad tvos watchos)
          for target in "${targets[@]}"; do
            bash .github/scripts/iccdev-apple-simulator-smoke.sh "$target"
          done

      # preflight: allow-pr-script-execution reason=xcode-ctest-runtime-test-only
      - name: Exercise Xcode CTest runtime layouts
        if: inputs.scope == 'core' || inputs.scope == 'all' || inputs.scope == 'xcode'
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          bash .github/scripts/iccdev-xcode-ctest-smoke.sh

      # preflight: allow-pr-script-execution reason=manual-ios-example-sanitizer-test-only
      - name: Exercise manual iOS examples with sanitizers
        if: inputs.scope == 'examples' || inputs.scope == 'all'
        env:
          BASH_ENV: /dev/null
          ICCDEV_APPLE_DOWNLOAD_RUNTIME: '1'
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          bash .github/scripts/iccdev-ios-example-smoke.sh sanitizers

      - name: Summarize Apple smoke results
        if: inputs.scope != 'examples'
        env:
          BASH_ENV: /dev/null
          APPLE_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          # shellcheck source=.github/scripts/sanitize-sed.sh
          source "$GITHUB_WORKSPACE/base/.github/scripts/sanitize-sed.sh"
          {
            if [[ "$APPLE_SCOPE" != "xcode" ]]; then
              targets=(ios ipad tvos watchos)
              for target in "${targets[@]}"; do
                report="out/apple-${target}-simulator-smoke/restored.json"
                count="$(jq -er '.tests | length' "$report")"
                sanitize_line "${target}: ${count} core checks; missing-fixture failure control passed."
                printf '\n'
              done
            fi
            sanitize_line "Xcode Release and Debug CTest runtime gates passed."
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: Summarize iOS example results
        if: inputs.scope == 'examples' || inputs.scope == 'all'
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          # shellcheck source=.github/scripts/sanitize-sed.sh
          source "$GITHUB_WORKSPACE/base/.github/scripts/sanitize-sed.sh"
          {
            sanitize_line "Apply Preview, Bench Apply, and CLUT Editor sanitizer smokes passed."
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
