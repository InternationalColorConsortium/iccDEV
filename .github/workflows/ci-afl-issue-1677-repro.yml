---
###############################################################
#
# Copyright (c) 2026 International Color Consortium.
#                 All rights reserved.
#                 https://color.org
#
# Intent: Reproduce issue #1948 CIccIO strict-aliasing writer defect.
#
###############################################################

name: "Legacy AFL filename issue 1948 strict-aliasing repro"

permissions:
  contents: read
  packages: read

'on':
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'iccDEV ref to compare'
        required: true
        default: master
        type: string
      regression_image_tag:
        description: 'Trusted unified image tag for Linux comparison'
        required: false
        default: latest
        type: string

concurrency:
  group: >-
    issue-1948-ciccio-strict-aliasing-${{ github.workflow }}-${{
    inputs.target_ref || 'master' }}
  cancel-in-progress: false

jobs:
  linux-clang-gcc:
    name: "Linux strict-aliasing discriminator"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: >-
        ghcr.io/internationalcolorconsortium/iccdev:${{
        inputs.regression_image_tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      TARGET_REF_INPUT: ${{ inputs.target_ref || 'master' }}
      TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts

    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout target ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          # preflight: allow-codeql-actions reason=manual-readonly-target-checkout
          ref: ${{ inputs.target_ref || 'master' }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Compare strict and no-strict-aliasing generated profiles
        working-directory: target
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          git config --global --add safe.directory "$PWD"

          cmake -S Build/Cmake -B out/clang-strict -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_TOOLS=ON -DENABLE_WXWIDGETS=OFF
          cmake -S Build/Cmake -B out/clang-no-strict -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -fno-strict-aliasing" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -fno-strict-aliasing" \
            -DENABLE_TOOLS=ON -DENABLE_WXWIDGETS=OFF
          cmake -S Build/Cmake -B out/gcc -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DENABLE_TOOLS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build out/clang-strict --target iccFromXml iccToXml iccDumpProfile --parallel "$(nproc)"
          cmake --build out/clang-no-strict --target iccFromXml iccToXml iccDumpProfile --parallel "$(nproc)"
          cmake --build out/gcc --target iccFromXml iccToXml iccDumpProfile --parallel "$(nproc)"

          out/clang-strict/Tools/IccFromXml/iccFromXml Testing/Calc/RGBWProjector.xml rgbw-clang-strict.icc
          out/clang-no-strict/Tools/IccFromXml/iccFromXml Testing/Calc/RGBWProjector.xml rgbw-clang-no-strict.icc
          out/gcc/Tools/IccFromXml/iccFromXml Testing/Calc/RGBWProjector.xml rgbw-gcc.icc
          out/clang-strict/Tools/IccToXml/iccToXml rgbw-clang-strict.icc rgbw-clang-strict.readback.xml
          out/clang-no-strict/Tools/IccToXml/iccToXml rgbw-clang-no-strict.icc rgbw-clang-no-strict.readback.xml
          out/gcc/Tools/IccToXml/iccToXml rgbw-gcc.icc rgbw-gcc.readback.xml

          set +e
          cmp -l rgbw-clang-strict.icc rgbw-clang-no-strict.icc > issue-1948-clang-strict-vs-nostrict-cmp.log
          strict_cmp_status=$?
          cmp -l rgbw-clang-no-strict.icc rgbw-gcc.icc > issue-1948-nostrict-vs-gcc-cmp.log
          nostrict_gcc_cmp_status=$?
          set -e

          zero_segment='SampledSegment Start="0.00000000" End="0.00000000"'
          one_segment='SampledSegment Start="0.00000000" End="1.00000000"'
          clang_strict_zero_count="$(grep -c "$zero_segment" \
            rgbw-clang-strict.readback.xml || true)"
          clang_strict_one_count="$(grep -c "$one_segment" \
            rgbw-clang-strict.readback.xml || true)"
          clang_nostrict_zero_count="$(grep -c "$zero_segment" \
            rgbw-clang-no-strict.readback.xml || true)"
          clang_nostrict_one_count="$(grep -c "$one_segment" \
            rgbw-clang-no-strict.readback.xml || true)"
          gcc_zero_count="$(grep -c "$zero_segment" rgbw-gcc.readback.xml || true)"
          gcc_one_count="$(grep -c "$one_segment" rgbw-gcc.readback.xml || true)"
          strict_diff_byte_count="$(wc -l < issue-1948-clang-strict-vs-nostrict-cmp.log)"
          nostrict_gcc_diff_byte_count="$(wc -l < issue-1948-nostrict-vs-gcc-cmp.log)"

          {
            echo "## Issue #1948 Linux CIccIO strict-aliasing discriminator"
            echo ""
            echo "- Target ref: \`$(sanitize_line "$TARGET_REF_INPUT")\`"
            echo "- Target commit: \`$(sanitize_line "$(git rev-parse HEAD)")\`"
            echo "- clang strict vs no-strict cmp status: \`$(sanitize_line "$strict_cmp_status")\`"
            echo "- clang strict vs no-strict differing byte count: \`$(sanitize_line "$strict_diff_byte_count")\`"
            echo "- clang no-strict vs gcc cmp status: \`$(sanitize_line "$nostrict_gcc_cmp_status")\`"
            echo "- clang no-strict vs gcc differing byte count:" \
              "\`$(sanitize_line "$nostrict_gcc_diff_byte_count")\`"
            echo "- clang strict readback zero-end segments: \`$(sanitize_line "$clang_strict_zero_count")\`"
            echo "- clang strict readback one-end segments: \`$(sanitize_line "$clang_strict_one_count")\`"
            echo "- clang -fno-strict-aliasing readback zero-end segments:" \
              "\`$(sanitize_line "$clang_nostrict_zero_count")\`"
            echo "- clang -fno-strict-aliasing readback one-end segments:" \
              "\`$(sanitize_line "$clang_nostrict_one_count")\`"
            echo "- gcc readback zero-end segments: \`$(sanitize_line "$gcc_zero_count")\`"
            echo "- gcc readback one-end segments: \`$(sanitize_line "$gcc_one_count")\`"
            echo ""
            echo "### clang strict readback sampled segments"
            echo '```text'
            grep -n 'SampledSegment' rgbw-clang-strict.readback.xml | head -12 | while IFS= read -r line; do
              sanitize_code_line "$line"
            done
            echo '```'
            echo ""
            echo "### clang -fno-strict-aliasing readback sampled segments"
            echo '```text'
            grep -n 'SampledSegment' rgbw-clang-no-strict.readback.xml | head -12 | while IFS= read -r line; do
              sanitize_code_line "$line"
            done
            echo '```'
            echo ""
            echo "### gcc readback sampled segments"
            echo '```text'
            grep -n 'SampledSegment' rgbw-gcc.readback.xml | head -12 | while IFS= read -r line; do
              sanitize_code_line "$line"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

          if [ "$clang_strict_zero_count" -eq 0 ] ||
             [ "$clang_nostrict_one_count" -eq 0 ] ||
             [ "$gcc_one_count" -eq 0 ]; then
            echo "[FAIL] issue #1948 strict-aliasing discriminator did not reproduce" >&2
            exit 1
          fi

  windows-msvc:
    name: "Windows MSVC"
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
      POWERSHELL_UPDATECHECK: Off
      TARGET_REF_INPUT: ${{ inputs.target_ref || 'master' }}

    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout target ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          # preflight: allow-codeql-actions reason=manual-readonly-target-checkout
          ref: ${{ inputs.target_ref || 'master' }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Download vcpkg exported dependencies
        working-directory: target
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . ..\trusted\.github\scripts\sanitize.ps1

          $vcpkgExportUrl = 'https://github.com/InternationalColorConsortium/iccDEV/' +
            'releases/download/v2.3.1/vcpkg-exported-deps.zip'
          Invoke-WebRequest -Uri $vcpkgExportUrl -OutFile deps.zip
          tar -xf deps.zip
          Remove-Item -LiteralPath deps.zip -Force
          "Using vcpkg export: $(Sanitize-Line $vcpkgExportUrl)"

      - name: Build and read back with MSVC
        working-directory: target
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . ..\trusted\.github\scripts\sanitize.ps1
          function Sanitize-CodeLineForSummary {
            param([AllowEmptyString()][string]$InputString = "")
            $result = Strip-CtrlRemoveNewlines -InputString $InputString
            $result = Trim-Whitespace -InputString $result
            $result = $result.Replace('```', '` ` `')
            return (Truncate-String -InputString $result -MaxLen 1000)
          }
          git config --global --add safe.directory $PWD.Path

          cmake -B out\msvc-issue-1948 -S Build\Cmake `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$PWD\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_TOOLS=ON `
            -DENABLE_WXWIDGETS=OFF `
            -Wno-dev
          cmake --build out\msvc-issue-1948 --config Release --target iccFromXml iccToXml --parallel

          $runtimeDir = Join-Path $PWD.Path 'out\msvc-issue-1948\bin\Release'
          if (-not (Test-Path -LiteralPath $runtimeDir)) {
            $runtimeDir = Join-Path $PWD.Path 'out\msvc-issue-1948\bin'
          }
          $env:PATH = @(
            $runtimeDir,
            (Join-Path $PWD.Path 'installed\x64-windows\bin'),
            (Join-Path $PWD.Path 'installed\x64-windows\debug\bin'),
            $env:PATH
          ) -join ';'

          $fromXml = Join-Path $runtimeDir 'iccFromXml.exe'
          $toXml = Join-Path $runtimeDir 'iccToXml.exe'
          & $fromXml 'Testing\Calc\RGBWProjector.xml' 'rgbw-msvc.icc'
          if ($LASTEXITCODE -ne 0) {
            throw "iccFromXml failed with exit code $LASTEXITCODE"
          }
          & $toXml 'rgbw-msvc.icc' 'rgbw-msvc.readback.xml'
          if ($LASTEXITCODE -ne 0) {
            throw "iccToXml failed with exit code $LASTEXITCODE"
          }

          $zeroSegment = 'SampledSegment Start="0.00000000" End="0.00000000"'
          $oneSegment = 'SampledSegment Start="0.00000000" End="1.00000000"'
          $zeroCount = @(Select-String -Path 'rgbw-msvc.readback.xml' -Pattern $zeroSegment).Count
          $oneCount = @(Select-String -Path 'rgbw-msvc.readback.xml' -Pattern $oneSegment).Count
          $summary = $env:GITHUB_STEP_SUMMARY
          "## Issue #1948 Windows MSVC" | Out-File -FilePath $summary -Append
          "" | Out-File -FilePath $summary -Append
          "- Target ref: ``$(Sanitize-Line $env:TARGET_REF_INPUT)``" |
            Out-File -FilePath $summary -Append
          "- Target commit: ``$(Sanitize-Line (git rev-parse HEAD))``" |
            Out-File -FilePath $summary -Append
          "- MSVC readback zero-end segments: ``$zeroCount``" |
            Out-File -FilePath $summary -Append
          "- MSVC readback one-end segments: ``$oneCount``" |
            Out-File -FilePath $summary -Append
          "" | Out-File -FilePath $summary -Append
          "### MSVC readback sampled segments" | Out-File -FilePath $summary -Append
          '```text' | Out-File -FilePath $summary -Append
          Select-String -Path 'rgbw-msvc.readback.xml' -Pattern 'SampledSegment' |
            Select-Object -First 12 |
            ForEach-Object { Sanitize-CodeLineForSummary $_.Line } |
            Out-File -FilePath $summary -Append
          '```' | Out-File -FilePath $summary -Append

          if ($oneCount -eq 0) {
            throw 'MSVC did not preserve End="1.00000000" for issue #1948 comparison'
          }
