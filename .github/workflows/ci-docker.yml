---
###############################################################
#
# Copyright (c) 2025-2026 International Color Consortium.
#                 All rights reserved.
#                 https://color.org
#
# Intent: Build, validate, and publish the unified iccDEV image.
#
###############################################################

name: ci-docker

permissions:
  contents: read

env:
  PUBLISH_IMAGE: >-
    ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

'on':
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-policy:
    name: Validate workflow cache policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check cache policy
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          .github/scripts/check-workflow-cache-policy.sh .github/workflows/ci-docker.yml

  build:
    name: Build and validate unified image
    needs: cache-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    environment: ghcr-publish
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false

      - name: Verify checked out workflow ref
        env:
          BASH_ENV: /dev/null
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set canonical image name
        id: image
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "$owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid repository owner for image name" >&2
            exit 1
          fi
          printf 'name=ghcr.io/%s/iccdev\n' "$(sanitize_line "$owner")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          cache-binary: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      # preflight: allow-token-exposure reason=publish-unified-iccdev-image
      - name: Log in to GHCR
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: true
          pull: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          load: ${{ env.PUBLISH_IMAGE != 'true' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          provenance: ${{ env.PUBLISH_IMAGE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH_IMAGE == 'true' }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Select test image
        id: test-image
        env:
          BASH_ENV: /dev/null
          PUBLISH_IMAGE: ${{ env.PUBLISH_IMAGE }}
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build-push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [ "$PUBLISH_IMAGE" = true ]; then
            docker pull "$IMAGE_REF"
            test_image="$IMAGE_REF"
          else
            test_image="$(sed -n '1p' <<< "$IMAGE_TAGS")"
          fi
          printf 'image=%s\n' "$(sanitize_line "$test_image")" >> "$GITHUB_OUTPUT"

      - name: Verify unified image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.test-image.outputs.image }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          image_revision="$(docker image inspect "$TEST_IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_ref_name="$(docker image inspect "$TEST_IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.ref.name" }}')"
          test "$image_revision" = "$EXPECTED_SHA"
          test "$image_ref_name" = "$EXPECTED_REF_NAME"
          docker run --rm "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            command -v git gh clang clang++ gcc g++ cmake afl-fuzz llvm-symbolizer
            command -v iccDumpProfile iccdev-fuzz-env iccdev-mcp iccdev-mcp-rest
            test "$PWD" = /workspace/iccDEV
            test -d .git
            test -d "$ICCDEV_BUILD_DIR"
            test -d "$ICCDEV_TOOLS_DIR"
            test -f Testing/sRGB_v4_ICC_preference.icc
            iccDumpProfile -v Testing/sRGB_v4_ICC_preference.icc >/dev/null
            ctest --test-dir "$ICCDEV_BUILD_DIR" -N --no-tests=error >/dev/null
          '

      - name: Verify real MCP and REST runtime
        id: runtime-smoke
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.test-image.outputs.image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          python3 .github/scripts/iccdev-container-smoke.py "$TEST_IMAGE" \
            --report-dir out/container-smoke

      - name: Upload runtime smoke diagnostics on failure
        if: ${{ failure() && steps.runtime-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-container-smoke
          path: out/container-smoke/
          retention-days: 7
          if-no-files-found: error

      - name: Generate SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Measure SBOM attestation size
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        id: sbom-size
        env:
          BASH_ENV: /dev/null
          MAX_ATTEST_BYTES: "16777216"
          SBOM_PATH: sbom.spdx.json
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [ ! -f "$SBOM_PATH" ]; then
            echo "::error::SBOM file missing: $SBOM_PATH"
            exit 1
          fi

          sbom_bytes="$(wc -c < "$SBOM_PATH" | tr -d ' ')"
          case "$sbom_bytes" in
            ''|*[!0-9]*)
              echo "::error::Invalid SBOM byte count: $sbom_bytes"
              exit 1
              ;;
          esac

          echo "bytes=$sbom_bytes" >> "$GITHUB_OUTPUT"  # elements-sanitized
          if [ "$sbom_bytes" -le "$MAX_ATTEST_BYTES" ]; then
            echo "attestable=true" >> "$GITHUB_OUTPUT"  # elements-sanitized
          else
            echo "attestable=false" >> "$GITHUB_OUTPUT"  # elements-sanitized
            echo "::notice title=SBOM Attestation Skipped::SBOM is ${sbom_bytes} bytes, above ${MAX_ATTEST_BYTES}"
          fi

          {
            echo "### SBOM Attestation Size"
            echo "- Bytes: $(sanitize_line "$sbom_bytes")"
            echo "- Limit: $(sanitize_line "$MAX_ATTEST_BYTES")"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: Attest build provenance
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' && steps.sbom-size.outputs.attestable == 'true' }}
        id: attest-sbom
        # Rekor's transparency-log endpoint can time out after image publication.
        # Retrying preserves a hard failure when the service remains unavailable.
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Retry SBOM attestation
        if: ${{ steps.attest-sbom.outcome == 'failure' }}
        id: retry-attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Require SBOM attestation
        if: ${{ always() && steps.attest-sbom.outcome == 'failure' }}
        env:
          BASH_ENV: /dev/null
          RETRY_OUTCOME: ${{ steps.retry-attest-sbom.outcome }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          if [ "$RETRY_OUTCOME" != "success" ]; then
            echo "::error::SBOM attestation failed after retry"
            exit 1
          fi

      - name: Upload SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-sbom
          path: sbom.spdx.json
          retention-days: 90
          if-no-files-found: error
