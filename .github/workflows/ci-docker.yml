---
###############################################################
#
# Copyright (c) 2025-2026 International Color Consortium.
#                 All rights reserved.
#                 https://color.org
#
# Intent: Build, validate, and publish the unified iccDEV image.
#
###############################################################

name: ci-docker

permissions:
  contents: read

env:
  PUBLISH_IMAGE: >-
    ${{
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/ci-qa-pr-docker-testing' ||
      github.ref == 'refs/heads/ci-publish-colourbill-ctrl' ||
      startsWith(github.ref, 'refs/tags/v')
    }}

'on':
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-policy:
    name: Validate workflow cache policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check cache policy
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          .github/scripts/check-workflow-cache-policy.sh .github/workflows/ci-docker.yml

  build:
    name: Build and validate unified image
    needs: cache-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    environment:
      name: >-
        ${{ github.ref == 'refs/heads/ci-publish-colourbill-ctrl' &&
            'ci-publishing-colourbill-ctrl' || 'ghcr-publish' }}
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false

      - name: Verify checked out workflow ref
        env:
          BASH_ENV: /dev/null
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set canonical image name
        id: image
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "$owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid repository owner for image name" >&2
            exit 1
          fi
          printf 'name=ghcr.io/%s/iccdev\n' "$(sanitize_line "$owner")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          cache-binary: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/ci-qa-pr-docker-testing' }}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/ci-publish-colourbill-ctrl' }}
            type=ref,event=tag

      # preflight: allow-token-exposure reason=publish-unified-iccdev-image
      - name: Log in to GHCR
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for validation
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: true
          pull: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          load: true
          push: false
          provenance: false
          sbom: false
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Select test image
        id: test-image
        env:
          BASH_ENV: /dev/null
          EXPECTED_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          test_image="$(sed -n '1p' <<< "$IMAGE_TAGS")"
          if [ -z "$test_image" ]; then
            echo "No image tag was generated for validation" >&2
            exit 1
          fi
          staging_image="${IMAGE_NAME}:sha-${EXPECTED_SHA}"
          if ! grep -Fqx "$staging_image" <<< "$IMAGE_TAGS"; then
            echo "Immutable SHA tag was not generated for staging" >&2
            exit 1
          fi
          printf 'image=%s\n' "$(sanitize_line "$test_image")" >> "$GITHUB_OUTPUT"
          printf 'staging_image=%s\n' "$(sanitize_line "$staging_image")" >> "$GITHUB_OUTPUT"

      - name: Verify unified image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.test-image.outputs.image }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          image_revision="$(docker image inspect "$TEST_IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_ref_name="$(docker image inspect "$TEST_IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.ref.name" }}')"
          test "$image_revision" = "$EXPECTED_SHA"
          test "$image_ref_name" = "$EXPECTED_REF_NAME"
          docker run --rm "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            command -v git gh clang clang++ gcc g++ cmake cppcheck clang-tidy scan-build
            command -v hadolint zizmor shellcheck afl-fuzz valgrind ms_print callgrind_annotate llvm-symbolizer
            command -v codeql lcov genhtml gcovr llvm-cov llvm-profdata perf gprof strace
            codeql version
            codeql resolve queries .github/codeql-queries/iccdev-security-suite.qls
            codeql resolve queries .github/codeql-queries/iccdev-mcp/iccdev-mcp-security-suite.qls
            perl -MJSON::XS -e 1
            test "$LCOV_HOME" = /
            grep -Fqx "geninfo_unexecuted_blocks = 1" /etc/lcovrc
            command -v iccDumpProfile iccdev-fuzz-env iccdev-mcp iccdev-mcp-rest
            command -v iccdev-valgrind-build iccdev-valgrind-run
            command -v iccdev-valgrind-status iccdev-valgrind-validate iccdev-valgrind-self-test
            test -x "$ICCDEV_FLAMEGRAPH_DIR/stackcollapse-perf.pl"
            test -x "$ICCDEV_FLAMEGRAPH_DIR/flamegraph.pl"
            test "$(git -C "$ICCDEV_FLAMEGRAPH_DIR" rev-parse HEAD)" = "$ICCDEV_FLAMEGRAPH_REVISION"
            test "$PWD" = /workspace/iccDEV
            test -d .git
            test -d "$ICCDEV_BUILD_DIR"
            test -d "$ICCDEV_TOOLS_DIR"
            test -f Testing/sRGB_v4_ICC_preference.icc
            iccdev-valgrind-validate
            iccdev-valgrind-build --jobs 4 --target dump
            iccdev-valgrind-self-test --sanitized-binary "$ICCDEV_TOOLS_DIR/IccDumpProfile/iccDumpProfile"
            iccdev-valgrind-run --tool memcheck --timeout 60 dump
            iccdev-valgrind-status
            iccDumpProfile -v Testing/sRGB_v4_ICC_preference.icc >/dev/null
            ctest --test-dir "$ICCDEV_BUILD_DIR" -N --no-tests=error >/dev/null
          '

      - name: Verify real MCP and REST runtime
        id: runtime-smoke
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.test-image.outputs.image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          python3 .github/scripts/iccdev-container-smoke.py "$TEST_IMAGE" \
            --report-dir out/container-smoke

      - name: Verify MemorySanitizer runtime
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.test-image.outputs.image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          docker run --rm --network none --security-opt seccomp=unconfined \
            "$TEST_IMAGE" bash -lc '
              .github/scripts/iccdev-msan-taint-qa.sh \
                --source-dir "$PWD" \
                --build-dir /tmp/iccdev-msan \
                --runtime-dir "$ICCDEV_MSAN_LIBCXX_DIR" \
                --out-dir /tmp/iccdev-msan-evidence
            '

      - name: Upload runtime smoke diagnostics on failure
        if: ${{ failure() && steps.runtime-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-container-smoke
          path: out/container-smoke/
          retention-days: 7
          if-no-files-found: error

      - name: Generate SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ steps.test-image.outputs.staging_image }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Validate SBOM attestation size
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          BASH_ENV: /dev/null
          MAX_ATTEST_BYTES: "16777216"
          SBOM_PATH: sbom.cyclonedx.json
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [ ! -f "$SBOM_PATH" ]; then
            echo "::error::SBOM file missing: $SBOM_PATH"
            exit 1
          fi

          if ! jq -e '
            .bomFormat == "CycloneDX" and
            (.specVersion | type == "string" and length > 0) and
            (.components | type == "array" and length > 0)
          ' "$SBOM_PATH" >/dev/null; then
            echo "::error::Invalid or empty CycloneDX SBOM: $SBOM_PATH"
            exit 1
          fi

          sbom_bytes="$(wc -c < "$SBOM_PATH" | tr -d ' ')"
          case "$sbom_bytes" in
            ''|*[!0-9]*)
              echo "::error::Invalid SBOM byte count: $sbom_bytes"
              exit 1
              ;;
          esac

          if [ "$sbom_bytes" -gt "$MAX_ATTEST_BYTES" ]; then
            echo "::error title=SBOM Attestation Too Large::SBOM is ${sbom_bytes} bytes, above ${MAX_ATTEST_BYTES}"
            exit 1
          fi

          {
            echo "### SBOM Attestation Size"
            echo "- Bytes: $(sanitize_line "$sbom_bytes")"
            echo "- Limit: $(sanitize_line "$MAX_ATTEST_BYTES")"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: Stage validated image by immutable SHA
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        id: stage
        env:
          BASH_ENV: /dev/null
          STAGING_IMAGE: ${{ steps.test-image.outputs.staging_image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          docker push "$STAGING_IMAGE"

          image_digest_ref="$(docker image inspect "$STAGING_IMAGE" --format '{{index .RepoDigests 0}}')"
          image_digest="${image_digest_ref##*@}"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve staged image digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$(sanitize_line "$image_digest")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        id: attest-sbom
        # Rekor's transparency-log endpoint can time out after immutable staging.
        # Retrying preserves a hard failure when the service remains unavailable.
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Retry SBOM attestation
        if: ${{ steps.attest-sbom.outcome == 'failure' }}
        id: retry-attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Require SBOM attestation
        if: ${{ always() && steps.attest-sbom.outcome == 'failure' }}
        env:
          BASH_ENV: /dev/null
          RETRY_OUTCOME: ${{ steps.retry-attest-sbom.outcome }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          if [ "$RETRY_OUTCOME" != "success" ]; then
            echo "::error::SBOM attestation failed after retry"
            exit 1
          fi

      - name: Publish attested image tags
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          BASH_ENV: /dev/null
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          pushed=0
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker push "$image_tag"
            pushed=$((pushed + 1))
          done <<< "$IMAGE_TAGS"
          if [ "$pushed" -eq 0 ]; then
            echo "No image tags were available to publish" >&2
            exit 1
          fi

      - name: Upload SBOM
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-sbom
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error
