#
## Intent: Run the CodeQL query unit tests under .github/codeql-queries/test
##
## The automatic, read-only fixture gate verifies C++ query behavior on query
## PRs. The separate ci-codeql-security workflow builds the product database
## for maintainer-triggered analysis and publishes SARIF.
## Keep the bundle pins aligned with security, preflight, and Dockerfile;
## check-codeql-bundle-pin-parity.py verifies all four locations.
#
###############################################################

---
name: "ci-codeql-query-tests"

# Pinned SHAs and CodeQL command strings exceed line length.
# yamllint disable rule:line-length

permissions:
  contents: read

"on":
  pull_request:
    branches:
      - master
    paths:
      - '.github/codeql-queries/**'
      - '.github/workflows/ci-codeql-query-tests.yml'
  push:
    branches:
      - master
    paths:
      - '.github/codeql-queries/**'
      - '.github/workflows/ci-codeql-query-tests.yml'
  workflow_dispatch:

concurrency:
  group: "codeql-query-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  query-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: CodeQL Query Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned CodeQL archive
        id: codeql-archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/codeql-bundle-linux64.tar.gz
          key: iccdev-codeql-linux64-89ed56c8ec6bfccef6a0d2e7fe86da0469ca24b4db08b88016ec134b942c17a4

      - name: Install CodeQL CLI
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          # Pin extractor behavior because .expected files assert exact locations.
          # CODEQL_SHA256 is the release asset digest for this exact bundle. Keep
          # this pin synchronized with the other workflow pins and Dockerfile:
          #   gh api repos/github/codeql-action/releases/tags/codeql-bundle-v"$CODEQL_VER" \
          #     --jq '.assets[]|select(.name=="codeql-bundle-linux64.tar.gz").digest'
          CODEQL_VER="2.27.4"
          CODEQL_ARCHIVE="/tmp/codeql-bundle-linux64.tar.gz"
          CODEQL_SHA256="89ed56c8ec6bfccef6a0d2e7fe86da0469ca24b4db08b88016ec134b942c17a4"
          CODEQL_URL="https://github.com/github/codeql-action/releases/download"
          if [[ ! -f "${CODEQL_ARCHIVE}" ]]; then
            curl -fsSL --retry 3 \
              -o "${CODEQL_ARCHIVE}" \
              "${CODEQL_URL}/codeql-bundle-v${CODEQL_VER}/codeql-bundle-linux64.tar.gz"
          fi
          printf '%s  %s\n' "${CODEQL_SHA256}" "${CODEQL_ARCHIVE}" | sha256sum -c -
          tar xzf "${CODEQL_ARCHIVE}" -C /opt
          # Prepend, so a codeql already on the runner image cannot win.
          echo "/opt/codeql" >> "$GITHUB_PATH"

      - name: Save verified CodeQL archive
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          steps.codeql-archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/codeql-bundle-linux64.tar.gz
          key: iccdev-codeql-linux64-89ed56c8ec6bfccef6a0d2e7fe86da0469ca24b4db08b88016ec134b942c17a4

      - name: Install CodeQL pack dependencies
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          # Install both packs against the pinned bundle used for extraction.
          codeql pack install .github/codeql-queries
          codeql pack install .github/codeql-queries/test \
            --additional-packs=.github/codeql-queries

      - name: Run query unit tests
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          # A passing qltest needs source extraction and a positive expected
          # result. CodeQL otherwise accepts an empty test inventory or a
          # fixture that never reports anything.
          missing=0
          fixture_count=0
          while IFS= read -r ref; do
            fixture_count=$((fixture_count + 1))
            d="$(dirname "$ref")"
            if ! grep -Eq '^[[:space:]]*\|.*[^[:space:]|].*\|[[:space:]]*$' "${ref%.qlref}.expected"; then
              echo "[FAIL] $ref needs an .expected result row with a positive control" >&2
              missing=1
            fi
            # find, not `ls a b c`: ls exits non-zero when *any* glob is
            # unmatched, so absent .cc/.cxx would fail a directory that has a
            # perfectly good .cpp.
            if [ -z "$(find "$d" -maxdepth 1 -type f \
                        \( -name '*.c' -o -name '*.cpp' \
                           -o -name '*.cc' -o -name '*.cxx' \) -print -quit)" ]; then
              echo "[FAIL] $d has $(basename "$ref") but no source file beside it" >&2
              missing=1
            fi
          done < <(find .github/codeql-queries/test -name '*.qlref' -print)
          if [ "$fixture_count" -eq 0 ]; then
            echo "[FAIL] No CodeQL query fixtures found" >&2
            exit 1
          fi
          [ "$missing" -eq 0 ] || exit 1
          printf 'CodeQL query fixtures selected: %s\n' "$fixture_count"

          codeql test run .github/codeql-queries/test \
            --additional-packs=.github/codeql-queries \
            --threads=0
