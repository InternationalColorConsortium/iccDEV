## Intent: Maintainer-triggered, master-push and scheduled product C++ analysis.
##         Uploads standard, core-custom and JSON-custom SARIF; query fixtures
##         are tested separately by ci-codeql-query-tests.
#
## Last Updated: 2026-04-09 by David Hoyt
#
###############################################################

---
name: "ci-codeql-security"

# Existing pinned SHAs and CodeQL command strings exceed line length.
# Keep this yamllint disable local to this workflow.
# yamllint disable rule:line-length

permissions:
  contents: read

"on":
  pull_request:
    branches:
      - master
    types:
      - labeled
  push:
    branches:
      - master
    paths:
      - 'IccProfLib/**'
      - 'IccXML/**'
      - 'IccJSON/**'
      - 'IccConnect/**'
      - 'Tools/**'
      - 'examples/**'
      - '.github/codeql-queries/**'
      - '.github/codeql-config.yml'
      - '.github/ci/qa-detection-matrix.json'
      - '.github/scripts/codeql-report.sh'
      - '.github/scripts/qa-detection-matrix.py'
      - '.github/scripts/run-codeql-local.sh'
      - '.github/workflows/ci-codeql-security.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.state == 'open' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'codeql-ready' ||
         github.event.label.name == 'ci:codeql')
      )
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # Required to correlate CodeQL upload with workflow metadata.
      security-events: write  # Required to upload SARIF code scanning results.

    steps:
      # preflight: allow-token-exposure reason=maintainer-codeql-label-authentication
      - name: Verify maintainer-applied CodeQL label
        if: github.event_name == 'pull_request'
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          LABEL_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          if [[ ! "$LABEL_ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "Invalid CodeQL label actor" >&2
            exit 1
          fi
          actor_permission="$(gh api \
            "repos/${GH_REPOSITORY}/collaborators/${LABEL_ACTOR}/permission" \
            --jq '.permission')"
          case "$actor_permission" in
            admin|maintain|write) ;;
            *)
              echo "CodeQL label actor lacks repository write permission" >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout trusted security helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: |
            .github/scripts
            .github/codeql-queries
            .github/ci/qa-detection-matrix.json
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake clang \
            libxml2-dev libtiff-dev libpng-dev libjpeg-dev \
            nlohmann-json3-dev libwxgtk3.2-dev 2>/dev/null

      - name: Restore pinned CodeQL archive
        id: codeql-archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/codeql-bundle-linux64.tar.gz
          key: iccdev-codeql-linux64-a5f205466b976ea9b345957fc133eeea9021e71aeffc99243ec7b9e99b1d6ed5

      - name: Install CodeQL CLI
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          # CODEQL_SHA256 is the release asset digest for this exact bundle. Keep
          # this pin synchronized with the other workflow pins and Dockerfile:
          #   gh api repos/github/codeql-action/releases/tags/codeql-bundle-v"$CODEQL_VER" \
          #     --jq '.assets[]|select(.name=="codeql-bundle-linux64.tar.gz").digest'
          CODEQL_VER="2.27.5"
          CODEQL_ARCHIVE="/tmp/codeql-bundle-linux64.tar.gz"
          CODEQL_SHA256="a5f205466b976ea9b345957fc133eeea9021e71aeffc99243ec7b9e99b1d6ed5"
          CODEQL_URL="https://github.com/github/codeql-action/releases/download"
          if [[ ! -f "${CODEQL_ARCHIVE}" ]]; then
            curl -fsSL --retry 3 \
              -o "${CODEQL_ARCHIVE}" \
              "${CODEQL_URL}/codeql-bundle-v${CODEQL_VER}/codeql-bundle-linux64.tar.gz"
          fi
          printf '%s  %s\n' "${CODEQL_SHA256}" "${CODEQL_ARCHIVE}" | sha256sum -c -
          tar xzf "${CODEQL_ARCHIVE}" -C /opt
          echo "/opt/codeql" >> "$GITHUB_PATH"

      - name: Save verified CodeQL archive
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') &&
          steps.codeql-archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/codeql-bundle-linux64.tar.gz
          key: iccdev-codeql-linux64-a5f205466b976ea9b345957fc133eeea9021e71aeffc99243ec7b9e99b1d6ed5

      - name: Install CodeQL pack dependencies
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
          TRUSTED_CODEQL_QUERIES: ${{ github.workspace }}/trusted/.github/codeql-queries
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          codeql pack install "$TRUSTED_CODEQL_QUERIES"

      - name: Configure iccDEV
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          # ENABLE_TESTS=OFF keeps the regression suite out of the database.
          # `codeql database create --command=` builds the default target, so
          # scan scope is whatever `all` compiles -- .github/codeql-config.yml
          # is a push-trigger filter here and never reaches the CLI. Since #2480
          # dropped EXCLUDE_FROM_ALL the suite is in `all`: its 105 test TUs
          # entered the database and produced 29 of the 30 alerts on that scan.
          # ENABLE_TESTS gates only ENABLE_TESTING() and the
          # Testing subdirectory (Build/Cmake/CMakeLists.txt:2133-2136), so no
          # product target is lost.
          cmake -S Build/Cmake -B /tmp/iccdev-codeql-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TOOLS=ON \
            -DENABLE_TESTS=OFF \
            -DICC_JSON_ORDERED=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Create CodeQL database
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          NJOBS="$(nproc)"
          codeql database create /tmp/codeql-db \
            --language=cpp \
            --overwrite \
            --command="cmake --build /tmp/iccdev-codeql-build -j ${NJOBS}" \
            --source-root="."

      - name: Run CodeQL analysis
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
          TRUSTED_CODEQL_QUERIES: ${{ github.workspace }}/trusted/.github/codeql-queries
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          mkdir -p codeql-results

          # Standard security + quality suite, minus cpp/path-injection.
          codeql database analyze /tmp/codeql-db \
            --format=sarif-latest \
            --output=codeql-results/cpp-security-and-quality.sarif \
            --threads=0 \
            "$TRUSTED_CODEQL_QUERIES/iccdev-cpp-security-and-quality.qls"

          # Custom iccDEV security queries
          codeql database analyze /tmp/codeql-db \
            --format=sarif-latest \
            --output=codeql-results/iccdev-security.sarif \
            --threads=0 \
            "$TRUSTED_CODEQL_QUERIES/iccdev-security-suite.qls"

          # IccJSON/IccConnect targeted security queries
          codeql database analyze /tmp/codeql-db \
            --format=sarif-latest \
            --output=codeql-results/iccdev-jsonlib-security.sarif \
            --threads=0 \
            "$TRUSTED_CODEQL_QUERIES/iccdev-jsonlib-suite.qls"

      - name: Generate report
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          if [ -f "$TRUSTED_SCRIPTS/qa-detection-matrix.py" ] &&
             [ -f trusted/.github/ci/qa-detection-matrix.json ]; then
            python3 "$TRUSTED_SCRIPTS/qa-detection-matrix.py" \
              --input trusted/.github/ci/qa-detection-matrix.json \
              --repo-root "$GITHUB_WORKSPACE" \
              --markdown codeql-results/qa-detection-matrix.md \
              --json codeql-results/qa-detection-matrix.json
          else
            echo "[SKIP] Trusted base does not yet provide the QA detection matrix."
          fi
          "$TRUSTED_SCRIPTS/codeql-report.sh" \
            codeql-results/cpp-security-and-quality.sarif \
            codeql-results/iccdev-security.sarif \
            codeql-results/iccdev-jsonlib-security.sarif \
            | tee codeql-results/report.txt

      - name: Write CodeQL review summary
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          mkdir -p codeql-results
          if [ ! -f codeql-results/report.txt ]; then
            printf 'CodeQL analysis did not reach report generation.\n' \
              > codeql-results/analysis-incomplete.txt
          fi

          {
            echo "## CodeQL review report"
            echo ""
            echo '```text'
            if [ -f codeql-results/report.txt ]; then
              shown=0
              while IFS= read -r line; do
                if [ "$shown" -ge 400 ]; then
                  echo "... remaining details are in the CodeQL report artifact"
                  break
                fi
                sanitize_code_line "$line"
                echo ""
                shown=$((shown + 1))
              done < codeql-results/report.txt
            else
              echo "CodeQL report was not generated."
            fi
            echo '```'
            echo ""
            if [ -f codeql-results/qa-detection-matrix.md ]; then
              while IFS= read -r line; do
                sanitize_print "$line"
                echo ""
              done < codeql-results/qa-detection-matrix.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      # preflight: allow-untrusted-artifact reason=sanitized-developer-report
      - name: Upload CodeQL review artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: iccdev-codeql-review-report
          path: codeql-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload standard CodeQL SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: codeql-results/cpp-security-and-quality.sarif
          category: iccdev-standard-cpp-security-and-quality

      - name: Upload iccDEV custom SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: codeql-results/iccdev-security.sarif
          category: iccdev-custom-security

      - name: Upload IccJSON/IccConnect custom SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: codeql-results/iccdev-jsonlib-security.sarif
          category: iccdev-jsonlib-security
