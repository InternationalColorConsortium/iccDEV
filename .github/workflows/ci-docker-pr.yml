# Intent: Read-only Docker regression verification for PR fast lanes
#
###############################################################

name: ci-docker-pr

# Existing pinned action SHAs and Docker command strings intentionally exceed
# the default yamllint line length. Keep the disable local to this workflow.
# yamllint disable rule:line-length

permissions:
  contents: read
  packages: read

'on':
  workflow_call:
    inputs:
      base_sha:
        description: 'Exact trusted base SHA for workflow helpers'
        required: true
        type: string
      target_sha:
        description: 'Exact PR head SHA to verify'
        required: true
        type: string
      warning_policy:
        description: 'Compiler warning policy: warn or fail'
        required: false
        default: fail
        type: string

concurrency:
  group: "docker-pr-${{ github.workflow }}-${{ inputs.target_sha }}"
  cancel-in-progress: true

jobs:
  cache-policy:
    name: "Validate workflow cache policy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      # preflight: allow-codeql-actions reason=readonly-pr-workflow-checkout
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          fetch-depth: 1

      # preflight: allow-codeql-actions reason=trusted-base-workflow-checkout
      - name: Check out trusted workflow helpers
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          path: .trusted-workflow
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Check out target SHA
        env:
          BASH_ENV: /dev/null
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          case "$BASE_SHA" in
            *[!0-9a-fA-F]*)
              echo "::error title=Invalid base SHA::${BASE_SHA}"
              exit 1
              ;;
          esac
          if [ "${#BASE_SHA}" -ne 40 ] ||
             [ "$(git -C .trusted-workflow rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "::error title=Trusted base SHA mismatch"
            exit 1
          fi

          case "$TARGET_SHA" in
            *[!0-9a-fA-F]*)
              echo "::error title=Invalid target SHA::${TARGET_SHA}"
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "::error title=Invalid target SHA length::${TARGET_SHA}"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"

      - name: Assert no GitHub Actions cache primitives
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          .trusted-workflow/.github/scripts/check-workflow-cache-policy.sh \
            .github/workflows/ci-docker-pr.yml

  pr-regression-verify:
    name: "Docker PR regression verification"
    needs: cache-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      TARGET_SHA: ${{ inputs.target_sha }}
      WARNING_POLICY: ${{ inputs.warning_policy || 'fail' }}

    steps:
      # preflight: allow-codeql-actions reason=readonly-pr-workflow-checkout
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          fetch-depth: 1

      # preflight: allow-codeql-actions reason=trusted-base-workflow-checkout
      - name: Check out trusted workflow helpers
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          path: .trusted-workflow
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked out PR SHA
        env:
          BASH_ENV: /dev/null
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          case "$BASE_SHA" in
            *[!0-9a-fA-F]*)
              echo "::error title=Invalid base SHA::${BASE_SHA}"
              exit 1
              ;;
          esac
          if [ "${#BASE_SHA}" -ne 40 ] ||
             [ "$(git -C .trusted-workflow rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "::error title=Trusted base SHA mismatch"
            exit 1
          fi

          case "$TARGET_SHA" in
            *[!0-9a-fA-F]*)
              echo "::error title=Invalid target SHA::${TARGET_SHA}"
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "::error title=Invalid target SHA length::${TARGET_SHA}"
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error title=Checkout SHA mismatch::${actual_sha} != ${TARGET_SHA}"
            exit 1
          fi

      # preflight: allow-codeql-actions reason=trusted-base-sanitizer
      # preflight: allow-pr-script-execution reason=build-same-repository-container-pr
      - name: Build unified PR image
        id: image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: iccdev-pr:${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh

          # The trusted checkout is needed only to load this sanitizer. Remove
          # it so the Docker context and later read-only source mount are clean.
          rm -rf "$GITHUB_WORKSPACE/.trusted-workflow"
          test ! -e "$GITHUB_WORKSPACE/.trusted-workflow"

          docker build \
            --build-arg "GIT_COMMIT=$TARGET_SHA" \
            -t "$TEST_IMAGE" .
          printf 'image=%s\n' "$(sanitize_line "$TEST_IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Verify unified image toolchain
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          docker run --rm "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            git config --global credential.helper ""
            unset GITHUB_TOKEN || true
            command -v git gh clang clang++ gcc g++ cmake make realpath llvm-symbolizer
            command -v afl-fuzz afl-showmap iccdev-fuzz-env
            command -v jq curl shellcheck llvm-cov llvm-profdata file
            test -x .github/scripts/iccdev-afl-smoke.sh
            clang --version | sed -n "1p"
            clang++ --version | sed -n "1p"
            gcc --version | sed -n "1p"
            g++ --version | sed -n "1p"
            cmake --version | sed -n "1p"
            afl-fuzz -V 1 2>&1 | sed -n "1p" || true
            fuzz_env_output="$(iccdev-fuzz-env)"
            sed -n "1,40p" <<< "$fuzz_env_output"
            if ! grep -q "^Source mode: upstream checkout without local patches$" <<< "$fuzz_env_output"; then
              echo "ERROR: iccdev-fuzz-env did not report the unpatched source mode" >&2
              exit 1
            fi
            clang --version | grep -q "clang version 22\\."
            clang++ --version | grep -q "clang version 22\\."
            gcc --version | grep -q " 15\\."
            g++ --version | grep -q " 15\\."
            test "${CC}" = clang
            test "${CXX}" = clang++
            printf "int main(void) { return 0; }\n" > /tmp/afl-probe.c
            printf "int main(void) { return 0; }\n" > /tmp/afl-probe.cpp
            # The packaged AFL LLVM plugin targets LLVM 21; retain
            # Clang 22 as the image default and pair this probe to LLVM 21.
            AFL_CC=clang-21 AFL_CXX=clang++-21 afl-clang-fast -c /tmp/afl-probe.c -o /tmp/afl-probe.o
            AFL_CC=clang-21 AFL_CXX=clang++-21 afl-clang-fast++ -c /tmp/afl-probe.cpp -o /tmp/afl-probexx.o
            printf "#include <stddef.h>\n#include <stdint.h>\nextern \"C\" int LLVMFuzzerTestOneInput(const uint8_t*, size_t){return 0;}\n" > /tmp/cfl-smoke.cpp
            clang++ -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -g -O1 \
              /tmp/cfl-smoke.cpp -o /tmp/cfl-smoke
            /tmp/cfl-smoke -max_total_time=1
          '

      - name: Build and test PR tree inside unified image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          case "$WARNING_POLICY" in
            warn|fail)
              ;;
            *)
              echo "::error title=Invalid warning policy::${WARNING_POLICY}"
              exit 1
              ;;
          esac

          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            -e "TARGET_SHA=${TARGET_SHA}" \
            -e "WARNING_POLICY=${WARNING_POLICY}" \
            "$TEST_IMAGE" bash -lc '
              set -euo pipefail
              git config --global credential.helper ""
              unset GITHUB_TOKEN || true
              work="$(mktemp -d)"
              source_dir="$work/iccDEV"
              mkdir -p "$source_dir"
              cp -a /src/. "$source_dir/"
              actual_sha="$(git -C "$source_dir" rev-parse HEAD)"
              if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
                echo "::error title=Workspace revision mismatch::Expected ${TARGET_SHA}, found ${actual_sha}"
                exit 1
              fi
              SAN_FLAGS="-fsanitize=address,undefined,integer,bounds,null,float-divide-by-zero,alignment,vla-bound"
              export CFLAGS="$SAN_FLAGS -fno-omit-frame-pointer -g -O0"
              export CXXFLAGS="$SAN_FLAGS -fno-omit-frame-pointer -g -O0"
              export LDFLAGS="$SAN_FLAGS"
              CC=clang CXX=clang++ cmake -S "$source_dir/Build/Cmake" -B "$work/build" \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_C_FLAGS="$SAN_FLAGS -fno-omit-frame-pointer -g -O0" \
                -DCMAKE_CXX_FLAGS="$SAN_FLAGS -fno-omit-frame-pointer -g -O0 -std=c++17" \
                -DENABLE_ASAN=ON \
                -DENABLE_UBSAN=ON \
                -DENABLE_INTEGER_SANITIZER=ON \
                -DENABLE_FLOAT_SANITIZER=ON \
                -DUBSAN_IGNORELIST="$source_dir/.github/ci/ubsan-ignorelist.txt" \
                -DENABLE_TOOLS=ON \
                -DENABLE_TESTS=ON
              cmake --build "$work/build" --target all build-test-binaries \
                --parallel "$(nproc)" 2>&1 | tee "$work/build.log"
              warning_count="$(grep -cE "warning:" "$work/build.log" || true)"
              if [ "$warning_count" -gt 0 ]; then
                grep -E "warning:" "$work/build.log" | sort -u | sed -n "1,20p"
                if [ "$WARNING_POLICY" = "fail" ]; then
                  echo "warning_policy=fail rejected $warning_count warning(s)" >&2
                  exit 1
                fi
              fi
              ASAN_OPTIONS="halt_on_error=0,detect_leaks=0" \
              UBSAN_OPTIONS="halt_on_error=0,print_stacktrace=1" \
              LLVM_PROFILE_FILE="/dev/null" \
              ctest --test-dir "$work/build" --output-on-failure --no-tests=error \
                --label-exclude "^(slow|calculator)$"
            '
