#                 All rights reserved.
#                 https://color.org
#
# Intent: Clang source-based code coverage for iccDEV.
#
# Builds iccDEV with clang coverage instrumentation, exercises the legacy
# profile generation, tool paths, and full CTest inventory, then uploads
# separately labeled broad and core-library reports.
#
###############################################################

name: "ci-code-coverage"

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: "coverage-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null
  ICCDEV_BUILD_JOBS: 4
  TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
  WORKSPACE_DIR: ${{ github.workspace }}

jobs:
  coverage:
    name: "Coverage Report"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout trusted sanitizer helpers"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: "Install dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          bash .github/scripts/ci-safe-apt-update.sh
          bash .github/scripts/ci-ensure-llvm-22.sh \
            clang-22 llvm-22 libclang-rt-22-dev
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang-22 \
            cloc \
            cmake \
            curl \
            jq \
            libclang-rt-22-dev \
            libbrotli-dev \
            libfreetype-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            llvm-22 \
            nlohmann-json3-dev \
            zlib1g-dev

      # preflight: allow-package-install reason=spectral-preview-ctest-dependencies
      - name: "Install full CTest Python dependencies"
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          python_bin="$(command -v python3)"
          IMAGECODECS_ONLY=imcd "$python_bin" -m pip install \
            --no-binary=pillow,imagecodecs \
            -r .github/ci/requirements/docker-spectral-preview.txt \
            --quiet
          preview_check='import importlib.util, imagecodecs, numpy, PIL, tifffile; '
          preview_check+='data = b"iccdev-lzw-check"; '
          preview_check+='assert imagecodecs.lzw_decode(imagecodecs.lzw_encode(data)) == data; '
          preview_check+='assert importlib.util.find_spec("imagecodecs._brotli") is None'
          "$python_bin" -c "$preview_check"
          printf 'ICCDEV_SPECTRAL_PREVIEW_PYTHON=%s\n' "$python_bin" >> "$GITHUB_ENV"

      - name: "Show toolchain versions"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          echo "::group::Toolchain versions"
          printf 'clang: %s\n' "$(clang-22 --version | head -1)"
          printf 'llvm-cov: %s\n' "$(llvm-cov-22 --version | head -1)"
          printf 'llvm-profdata: %s\n' "$(llvm-profdata-22 show --version 2>&1 | head -1 || printf unknown)"
          printf 'cmake: %s\n' "$(cmake --version | head -1)"
          printf 'runner: %s\n' "$(uname -srm)"
          printf 'cpu: %s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          printf 'logical CPUs: %s\n' "$(nproc)"
          printf 'build jobs: %s\n' "$ICCDEV_BUILD_JOBS"
          echo "::endgroup::"

          mkdir -p coverage-report/timing
          {
            printf 'phase\tmilliseconds\n'
          } > coverage-report/timing/phases.tsv
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_image=%s\n' "${ImageOS:-unknown}"
            printf 'kernel=%s\n' "$(uname -srm)"
            printf 'cpu=%s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            printf 'logical_cpus=%s\n' "$(nproc)"
            printf 'build_jobs=%s\n' "$ICCDEV_BUILD_JOBS"
            printf 'memory_kib=%s\n' "$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          } > coverage-report/timing/environment.txt

      - name: "Generate code statistics"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          stats_dir="coverage-report/code-stats"
          mkdir -p "$stats_dir"
          stats_start_ns="$(date +%s%N)"

          exclude_dirs="trusted,build-coverage,profraw,coverage-report,opencv,demo-rit,issue-711"
          cloc --quiet --exclude-dir="$exclude_dirs" --json --out="${stats_dir}/cloc.json" .
          cloc --quiet --exclude-dir="$exclude_dirs" . > "${stats_dir}/cloc.txt"

          code_stats_files="$(jq -r '.SUM.nFiles // 0' "${stats_dir}/cloc.json")"
          code_stats_blank="$(jq -r '.SUM.blank // 0' "${stats_dir}/cloc.json")"
          code_stats_comment="$(jq -r '.SUM.comment // 0' "${stats_dir}/cloc.json")"
          code_stats_code="$(jq -r '.SUM.code // 0' "${stats_dir}/cloc.json")"
          code_stats_languages="$(
            jq -r '[keys[] | select(. != "header" and . != "SUM")] | length' "${stats_dir}/cloc.json"
          )"
          code_stats_total="$((code_stats_blank + code_stats_comment + code_stats_code))"
          stats_end_ns="$(date +%s%N)"
          stats_elapsed_ms="$(( (stats_end_ns - stats_start_ns) / 1000000 ))"
          printf 'code-statistics\t%s\n' "$stats_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          jq -r '
            "| Language | Files | Code | Comments | Blanks |",
            "|----------|------:|-----:|---------:|-------:|",
            (to_entries
              | map(select(.key != "header" and .key != "SUM"))
              | sort_by(.value.code // 0)
              | reverse
              | .[:10][]
              | "| \(.key) | \(.value.nFiles // 0) | \(.value.code // 0) | "
                + "\(.value.comment // 0) | \(.value.blank // 0) |")
          ' "${stats_dir}/cloc.json" > "${stats_dir}/top-languages.md"

          {
            printf 'code_stats_files=%s\n' "$code_stats_files"
            printf 'code_stats_blank=%s\n' "$code_stats_blank"
            printf 'code_stats_comment=%s\n' "$code_stats_comment"
            printf 'code_stats_code=%s\n' "$code_stats_code"
            printf 'code_stats_languages=%s\n' "$code_stats_languages"
            printf 'code_stats_total=%s\n' "$code_stats_total"
          } >> "$GITHUB_ENV"

      - name: "Build with coverage instrumentation"
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          BUILD_DIR="${WORKSPACE_DIR}/build-coverage"
          mkdir -p "$BUILD_DIR"

          echo "::group::CMake configure"
          configure_start_ns="$(date +%s%N)"
          cmake "${WORKSPACE_DIR}/Build/Cmake" \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DENABLE_COVERAGE=ON \
            -DENABLE_STATIC_LIBS=ON \
            -DENABLE_TESTS=ON \
            -DENABLE_TOOLS=ON \
            -Wno-dev
          configure_end_ns="$(date +%s%N)"
          configure_ms="$(( (configure_end_ns - configure_start_ns) / 1000000 ))"
          echo "::endgroup::"

          echo "::group::Compile"
          compile_start_ns="$(date +%s%N)"
          cmake --build "$BUILD_DIR" --parallel "$ICCDEV_BUILD_JOBS"
          compile_end_ns="$(date +%s%N)"
          compile_ms="$(( (compile_end_ns - compile_start_ns) / 1000000 ))"
          echo "::endgroup::"

          {
            printf 'configure\t%s\n' "$configure_ms"
            printf 'compile\t%s\n' "$compile_ms"
          } >> coverage-report/timing/phases.tsv

          tool="$(find "$BUILD_DIR" -name iccDumpProfile -type f -executable -print -quit)"
          if [ -z "$tool" ]; then
            echo "::error title=Build failed::iccDumpProfile binary not found"
            exit 1
          fi

          proflib="$(find "$BUILD_DIR" -name 'libIccProfLib2*.so' ! -name '*.so.*' -print -quit)"
          xmllib="$(find "$BUILD_DIR" -name 'libIccXML2*.so' ! -name '*.so.*' -print -quit)"
          if [ -z "$proflib" ] || [ -z "$xmllib" ]; then
            echo "::error title=Build incomplete::Shared libraries not found"
            exit 1
          fi

          real_proflib="$(readlink -f "$proflib")"
          readelf -S "$real_proflib" > coverage-report/timing/proflib-sections.txt
          if grep -q "__llvm_covmap" coverage-report/timing/proflib-sections.txt; then
            printf 'Coverage instrumentation confirmed in %s\n' "$(basename "$proflib")"
          else
            echo "::error title=Coverage symbols::__llvm_covmap section not found in shared library"
            exit 1
          fi

          tool_path_dirs=""
          while IFS= read -r dir; do
            tool_path_dirs="${dir}:${tool_path_dirs}"
          done < <(find "$BUILD_DIR" -path '*/Tools/*' -type f -executable -exec dirname {} \; | sort -u)

          library_path_dirs=""
          while IFS= read -r dir; do
            library_path_dirs="${dir}:${library_path_dirs}"
          done < <(find "$BUILD_DIR" -name 'lib*.so' -type f -exec dirname {} \; | sort -u)

          tool_count="$(find "$BUILD_DIR" -path '*/Tools/*' -type f -executable \
            ! -name iccDumpProfileGui ! -name iccDescribeSinkTest | wc -l)"
          proflib_kb="$(( $(stat -c%s "$(readlink -f "$proflib")" 2>/dev/null || printf 0) / 1024 ))"
          xmllib_kb="$(( $(stat -c%s "$(readlink -f "$xmllib")" 2>/dev/null || printf 0) / 1024 ))"

          {
            printf 'tool_path=%s\n' "$tool"
            printf 'build_dir=%s\n' "$BUILD_DIR"
            printf 'tool_path_dirs=%s\n' "$tool_path_dirs"
            printf 'library_path_dirs=%s\n' "$library_path_dirs"
            printf 'tool_count=%s\n' "$tool_count"
            printf 'configure_ms=%s\n' "$configure_ms"
            printf 'compile_ms=%s\n' "$compile_ms"
          } >> "$GITHUB_ENV"

          build_notice="${tool_count} tools, libIccProfLib2=${proflib_kb}KB, libIccXML2=${xmllib_kb}KB"
          echo "::notice title=Build summary::${build_notice}"

      - name: "Run CI inside stub coverage suite"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/ci-stub-%4m.profraw"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"
          export ICCDEV_TOOLS_DIR="${build_dir}/Tools"
          export ICCDEV_TESTING_DIR="${WORKSPACE_DIR}/Testing"
          export ICCDEV_BUILD_DIR="${build_dir}"
          mkdir -p "${WORKSPACE_DIR}/profraw" coverage-report/ci-inside-stub

          cd Testing
          echo "=== Updating PATH ==="
          for d in "${build_dir}/Tools"/*; do
            if [ -d "$d" ]; then
              tool_realpath="$(realpath "$d")"
              export PATH="${tool_realpath}:$PATH"
            fi
          done

          stub_report="${WORKSPACE_DIR}/coverage-report/ci-inside-stub/summary.txt"
          : > "$stub_report"
          stub_pass=0
          stub_fail=0
          stub_start_ns="$(date +%s%N)"

          run_stub_script() {
            local name="$1"
            local log
            shift
            local start_ns
            local end_ns
            local elapsed_ms
            local rc

            log="${WORKSPACE_DIR}/coverage-report/ci-inside-stub/${name}.log"
            start_ns="$(date +%s%N)"
            set +e
            "$@" > "$log" 2>&1
            rc="$?"
            set -e
            end_ns="$(date +%s%N)"
            elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"

            printf '%s exit=%s milliseconds=%s log=%s\n' \
              "$name" "$rc" "$elapsed_ms" "$(basename "$log")" \
              >> "$stub_report"
            printf 'stub-%s\t%s\n' "$name" "$elapsed_ms" \
              >> "${WORKSPACE_DIR}/coverage-report/timing/phases.tsv"

            if [ "$rc" -eq 0 ]; then
              stub_pass=$((stub_pass + 1))
            else
              stub_fail=$((stub_fail + 1))
              echo "::group::ci-inside-stub ${name} tail"
              tail -60 "$log" | while IFS= read -r line; do
                sanitize_line "$line"
                printf '\n'
              done
              echo "::endgroup::"
            fi
          }

          run_stub_script create-all-profiles sh CreateAllProfiles.sh
          run_stub_script run-tests sh RunTests.sh
          run_stub_script hdr-mkprofiles sh -c 'cd HDR && sh mkprofiles.sh'
          run_stub_script calc-tests sh -c 'cd CalcTest && sh runtests.sh'
          run_stub_script mcs-updateprev sh -c 'cd mcs && sh updateprev.sh'
          run_stub_script mcs-updateprev-bkgd sh -c 'cd mcs && sh updateprevWithBkgd.sh'

          profile_count="$(find . -name '*.icc' -type f | wc -l)"
          stub_end_ns="$(date +%s%N)"
          stub_elapsed_ms="$(( (stub_end_ns - stub_start_ns) / 1000000 ))"
          stub_exit=0
          if [ "$stub_fail" -gt 0 ]; then
            stub_exit=1
          fi
          stub_total="$((stub_pass + stub_fail))"

          {
            printf '\nTotals: pass=%s fail=%s milliseconds=%s\n' \
              "$stub_pass" "$stub_fail" "$stub_elapsed_ms"
            printf 'Hybrid pipeline: owned by the registered CTest gate\n'
          } >> "$stub_report"

          {
            printf 'ci_stub_exit_code=%s\n' "$stub_exit"
            printf 'ci_stub_pass=%s\n' "$stub_pass"
            printf 'ci_stub_fail=%s\n' "$stub_fail"
            printf 'ci_stub_total=%s\n' "$stub_total"
            printf 'ci_stub_elapsed_ms=%s\n' "$stub_elapsed_ms"
            printf 'profile_count=%s\n' "$profile_count"
          } >> "$GITHUB_ENV"

          echo "::notice title=Test profiles::Testing ICC snapshot after stubs: ${profile_count} files"
          echo "::group::ci-inside-stub summary"
          while IFS= read -r line; do
            sanitize_line "$line"
            printf '\n'
          done < "$stub_report"
          echo "::endgroup::"

          if [ "$stub_fail" -gt 0 ]; then
            echo "::error title=ci-inside-stub::${stub_fail} required script(s) exited non-zero"
            exit 1
          fi

      - name: "Stage authored ICC profiles for coverage"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/authored-stage-%4m.profraw"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"
          authored_stage_start_ns="$(date +%s%N)"

          # Convert each new authored pair once. The parser regression below
          # checks that its independent JSON source produces the same ICC.
          authored_profile_dir="${WORKSPACE_DIR}/coverage-report/authored-profiles"
          mkdir -p "$authored_profile_dir"
          authored_from_xml="$(
            find "$build_dir" -path '*/Tools/IccFromXml/iccFromXml' \
              -type f -executable -print -quit
          )"
          if [ -z "$authored_from_xml" ]; then
            echo "::error title=Authored profiles::iccFromXml is missing"
            exit 1
          fi
          authored_names=(
            sequence-metadata-coverage
            dict-localization-coverage
            response-curve-coverage
            acs-bookends-coverage
          )
          for name in "${authored_names[@]}"; do
            output="$authored_profile_dir/$name.icc"
            rm -f "$output"
            if ! timeout 30s "$authored_from_xml" \
                "${WORKSPACE_DIR}/Testing/Format/$name.xml" "$output" \
                > "$authored_profile_dir/$name.log" 2>&1; then
              echo "::error title=Authored profiles::Failed to convert $name.xml"
              exit 1
            fi
            if [ ! -s "$output" ]; then
              echo "::error title=Authored profiles::Empty ICC from $name.xml"
              exit 1
            fi
          done

          testing_profile_count="$profile_count"
          authored_profile_count="$(find "$authored_profile_dir" -name '*.icc' -type f | wc -l)"
          if [ "$authored_profile_count" -ne "${#authored_names[@]}" ]; then
            echo "::error title=Authored profiles::Expected ${#authored_names[@]} ICC files"
            exit 1
          fi
          unique_profile_count="$(
            sha256sum "$authored_profile_dir"/*.icc | awk '{print $1}' | sort -u | wc -l
          )"
          if [ "$unique_profile_count" -ne "$authored_profile_count" ]; then
            echo "::error title=Authored profiles::Authored ICC payloads are not unique"
            exit 1
          fi
          profile_count="$((testing_profile_count + authored_profile_count))"
          authored_stage_end_ns="$(date +%s%N)"
          authored_stage_elapsed_ms="$(( (authored_stage_end_ns - authored_stage_start_ns) / 1000000 ))"
          printf 'authored-profiles\t%s\n' "$authored_stage_elapsed_ms" \
            >> "${WORKSPACE_DIR}/coverage-report/timing/phases.tsv"
          {
            printf 'profile_count=%s\n' "$profile_count"
            printf 'testing_profile_count=%s\n' "$testing_profile_count"
            printf 'authored_profile_count=%s\n' "$authored_profile_count"
            printf 'authored_profile_dir=%s\n' "$authored_profile_dir"
            printf 'authored_stage_elapsed_ms=%s\n' "$authored_stage_elapsed_ms"
          } >> "$GITHUB_ENV"
          authored_notice="Staged ${profile_count} ICC profiles after stubs"
          authored_notice+=" (${testing_profile_count} Testing, ${authored_profile_count} authored)"
          echo "::notice title=Test profiles::${authored_notice}"

      - name: "Run focused hybrid CTest coverage gate"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export PATH="${tool_path_dirs}${PATH}"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"
          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/ctest-%4m.profraw"
          mkdir -p coverage-report/ctest

          ctest_json="coverage-report/ctest/ctest-tests.json"
          ctest_log="coverage-report/ctest/ctest-output.txt"
          ctest_junit="${WORKSPACE_DIR}/coverage-report/ctest/ctest-junit.xml"
          ctest_report="coverage-report/ctest/ctest-measurement.txt"
          ctest_large="coverage-report/ctest/large-profile-test.txt"
          ctest_filter='^iccdev\.hybrid-pipeline$'

          if ctest --test-dir "$build_dir" -R "$ctest_filter" --show-only=json-v1 \
              > "$ctest_json" 2>/dev/null; then
            ctest_test_count="$(jq -r '.tests | length' "$ctest_json")"
          else
            ctest_test_count=0
            printf '{}\n' > "$ctest_json"
          fi

          ctest_start_ns="$(date +%s%N)"
          set +e
          ctest --test-dir "$build_dir" \
            -R "$ctest_filter" \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$ctest_junit" \
            > "$ctest_log" 2>&1
          ctest_rc="$?"
          set -e
          ctest_end_ns="$(date +%s%N)"
          ctest_elapsed_ms="$(( (ctest_end_ns - ctest_start_ns) / 1000000 ))"
          printf 'ctest-hybrid\t%s\n' "$ctest_elapsed_ms" \
            >> coverage-report/timing/phases.tsv
          ctest_profile_count="$(
            find "${WORKSPACE_DIR}/profraw" -maxdepth 1 -type f \
              -name 'ctest-*.profraw' -size +0c -print | wc -l | tr -d ' '
          )"

          ctest_total_line="$(
            grep -E 'tests (failed|passed) out of [0-9]+|No tests were found' \
              "$ctest_log" | tail -1 || true
          )"
          ctest_time_line="$(grep -E '^Total Test time' "$ctest_log" | tail -1 || true)"
          large_profile_line="$(grep -E 'iccdev\.hybrid-pipeline' "$ctest_log" | tail -1 || true)"
          large_profile_seconds="n/a"
          if [ -n "$large_profile_line" ]; then
            large_profile_seconds="$(
              awk '
                {
                  for (i = 1; i <= NF; i++) {
                    if ($i == "sec") {
                      print $(i - 1)
                      exit
                    }
                  }
                }
              ' <<< "$large_profile_line"
            )"
            large_profile_seconds="${large_profile_seconds:-n/a}"
            sanitize_line "$large_profile_line" > "$ctest_large"
            printf '\n' >> "$ctest_large"
          else
            printf 'iccdev.hybrid-pipeline timing not found\n' > "$ctest_large"
          fi

          {
            printf 'iccDEV focused CTest coverage measurement\n'
            printf '=========================================\n\n'
            printf 'Registered tests: %s\n' "$ctest_test_count"
            printf 'CTest exit code: %s\n' "$ctest_rc"
            printf 'Nonempty CTest profiles: %s\n' "$ctest_profile_count"
            printf 'Elapsed wall time: %s milliseconds\n' "$ctest_elapsed_ms"
            printf 'CTest filter: %s\n' "$ctest_filter"
            printf 'CTest summary: %s\n' "${ctest_total_line:-n/a}"
            printf 'CTest timing: %s\n' "${ctest_time_line:-n/a}"
            printf 'Large profile CTest: %s\n' "${large_profile_line:-n/a}"
            printf '\n'
            printf 'Notes:\n'
            printf '%s\n' '- This focused gate runs the registered hybrid pipeline and its fixture.'
            printf '%s\n' '- It is not the complete CTest inventory.'
            printf '%s\n' '- The run is required and contributes to the broad module-matched report.'
          } > "$ctest_report"

          {
            printf 'ctest_exit_code=%s\n' "$ctest_rc"
            printf 'ctest_test_count=%s\n' "$ctest_test_count"
            printf 'ctest_profile_count=%s\n' "$ctest_profile_count"
            printf 'ctest_elapsed_ms=%s\n' "$ctest_elapsed_ms"
            printf 'ctest_large_profile_seconds=%s\n' "$large_profile_seconds"
          } >> "$GITHUB_ENV"

          echo "::group::CTest measurement summary"
          while IFS= read -r line; do
            sanitize_line "$line"
            printf '\n'
          done < "$ctest_report"
          echo "::endgroup::"

          if [ "$ctest_rc" -ne 0 ]; then
            echo "::error title=CTest::Required coverage test exited with code ${ctest_rc}"
            exit "$ctest_rc"
          fi
          if [ "$ctest_profile_count" -eq 0 ]; then
            echo "::error title=CTest coverage::Hybrid CTest produced no nonempty raw profiles"
            exit 1
          fi

      - name: "Exercise profiles with iccDumpProfile"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/dump-%4m.profraw"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"

          tool="${tool_path}"
          total=0
          pass_count=0
          fail_count=0
          authored_dump_total=0
          authored_dump_pass=0
          authored_dump_fail=0
          mkdir -p coverage-report
          fail_log="coverage-report/dump-failures.txt"
          : > "$fail_log"
          dump_start_ns="$(date +%s%N)"

          while IFS= read -r -d '' icc; do
            total=$((total + 1))
            is_authored=false
            case "$icc" in
              "$authored_profile_dir"/*)
                is_authored=true
                authored_dump_total=$((authored_dump_total + 1))
                ;;
            esac
            if [ "$is_authored" = true ]; then
              dump_log="$authored_profile_dir/$(basename "$icc" .icc).dump.log"
              if timeout 10s "$tool" -v 1 "$icc" > "$dump_log" 2>&1 &&
                 grep -Eq '^Profile is valid for version [0-9]+\.[0-9]+$' "$dump_log"; then
                rc=0
              else
                rc="$?"
              fi
            elif timeout 10s "$tool" "$icc" >/dev/null 2>&1; then
              rc=0
            else
              rc="$?"
            fi
            if [ "$rc" -eq 0 ]; then
              pass_count=$((pass_count + 1))
              if [ "$is_authored" = true ]; then
                authored_dump_pass=$((authored_dump_pass + 1))
              fi
            else
              fail_count=$((fail_count + 1))
              if [ "$is_authored" = true ]; then
                authored_dump_fail=$((authored_dump_fail + 1))
              fi
              printf '%s  exit=%s\n' "$(basename "$icc")" "$rc" >> "$fail_log"
            fi
          done < <(find Testing "$authored_profile_dir" -name '*.icc' -type f -print0 | sort -z)

          dump_end_ns="$(date +%s%N)"
          dump_elapsed_ms="$(( (dump_end_ns - dump_start_ns) / 1000000 ))"
          printf 'dump-profiles\t%s\n' "$dump_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          {
            printf 'dump_total=%s\n' "$total"
            printf 'dump_pass=%s\n' "$pass_count"
            printf 'dump_fail=%s\n' "$fail_count"
            printf 'dump_elapsed_ms=%s\n' "$dump_elapsed_ms"
            printf 'authored_dump_total=%s\n' "$authored_dump_total"
            printf 'authored_dump_pass=%s\n' "$authored_dump_pass"
            printf 'authored_dump_fail=%s\n' "$authored_dump_fail"
          } >> "$GITHUB_ENV"

          printf 'IccDumpProfile: %s tested, %s pass, %s fail\n' "$total" "$pass_count" "$fail_count"
          if [ "$fail_count" -gt 0 ]; then
            echo "::warning title=IccDumpProfile::${fail_count} of ${total} profiles failed"
            echo "::group::IccDumpProfile failed files"
            while IFS= read -r line; do
              sanitize_line "$line"
              printf '\n'
            done < "$fail_log"
            echo "::endgroup::"
          fi
          if [ "$authored_dump_total" -ne "$authored_profile_count" ] ||
             [ "$authored_dump_fail" -ne 0 ]; then
            echo "::error title=Authored profiles::iccDumpProfile validation failed for authored ICCs"
            exit 1
          fi

      - name: "Exercise XML round-trip and iccRoundTrip"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/xml-%4m.profraw"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"

          to_xml="$(find "$build_dir" -name iccToXml -type f -executable -print -quit)"
          from_xml="$(find "$build_dir" -name iccFromXml -type f -executable -print -quit)"
          roundtrip="$(find "$build_dir" -name iccRoundTrip -type f -executable -print -quit)"

          printf 'iccToXml: %s\n' "${to_xml:-NOT FOUND}"
          printf 'iccFromXml: %s\n' "${from_xml:-NOT FOUND}"
          printf 'iccRoundTrip: %s\n' "${roundtrip:-NOT FOUND}"

          if [ -z "$to_xml" ] || [ -z "$from_xml" ] || [ -z "$roundtrip" ]; then
            echo "::error title=Coverage tools::Required XML or round-trip tool is missing"
            exit 1
          fi

          mkdir -p coverage-report
          xml_spec_start_ns="$(date +%s%N)"
          ICCDEV_TOOLS_DIR="$build_dir/Tools" \
          ICCDEV_TESTING_DIR="$GITHUB_WORKSPACE/Testing" \
          ICCDEV_TEST_OUTDIR="$WORKSPACE_DIR/coverage-report/xml-spec-qa" \
            "$GITHUB_WORKSPACE/.github/scripts/iccdev-xml-spec-qa.sh"
          xml_spec_end_ns="$(date +%s%N)"
          xml_spec_elapsed_ms="$(( (xml_spec_end_ns - xml_spec_start_ns) / 1000000 ))"
          printf 'xml-spec-qa\t%s\n' "$xml_spec_elapsed_ms" \
            >> coverage-report/timing/phases.tsv
          printf 'xml_spec_qa=pass\n' >> "$GITHUB_ENV"

          xml_fail_log="coverage-report/xml-roundtrip-failures.txt"
          xml_from_fail_log="coverage-report/xml-fromxml-failures.txt"
          rt_fail_log="coverage-report/icc-roundtrip-failures.txt"
          : > "$xml_fail_log"
          : > "$xml_from_fail_log"
          : > "$rt_fail_log"

          converted=0
          xml_fail=0
          from_xml_fail=0
          authored_xml_total=0
          authored_xml_pass=0
          authored_xml_fail=0
          mapfile -d '' -t icc_files < <(find Testing "$authored_profile_dir" -name '*.icc' -type f -print0 | sort -z)
          printf 'XML round-trip: testing %s profiles\n' "${#icc_files[@]}"
          xml_roundtrip_start_ns="$(date +%s%N)"

          for icc in "${icc_files[@]}"; do
            is_authored=false
            authored_case_pass=true
            case "$icc" in
              "$authored_profile_dir"/*)
                is_authored=true
                authored_xml_total=$((authored_xml_total + 1))
                ;;
            esac
            base="$(sanitize_filename "$(basename "$icc" .icc)")"
            if [ -z "$base" ]; then
              base="profile-$(sha256sum "$icc" | awk '{print $1}')"
            fi
            xml_out="/tmp/${base}.xml"
            icc_out="/tmp/${base}-rt.icc"

            if [ -n "$to_xml" ] && timeout 10s "$to_xml" "$icc" "$xml_out" >/dev/null 2>&1; then
              converted=$((converted + 1))
              if [ -n "$from_xml" ]; then
                set +e
                timeout 10s "$from_xml" "$xml_out" "$icc_out" >/dev/null 2>&1
                rc="$?"
                set -e
                if [ "$is_authored" = true ] && [ ! -s "$icc_out" ]; then
                  rc=1
                fi
                if [ "$rc" -ne 0 ]; then
                  authored_case_pass=false
                  from_xml_fail=$((from_xml_fail + 1))
                  printf '%s  exit=%s\n' "$(basename "$icc")" "$rc" >> "$xml_from_fail_log"
                fi
              else
                authored_case_pass=false
                from_xml_fail=$((from_xml_fail + 1))
                printf '%s  exit=127\n' "$(basename "$icc")" >> "$xml_from_fail_log"
              fi
            else
              rc="$?"
              authored_case_pass=false
              xml_fail=$((xml_fail + 1))
              printf '%s  exit=%s\n' "$(basename "$icc")" "$rc" >> "$xml_fail_log"
            fi
            if [ "$is_authored" = true ]; then
              if [ "$authored_case_pass" = true ]; then
                authored_xml_pass=$((authored_xml_pass + 1))
              else
                authored_xml_fail=$((authored_xml_fail + 1))
              fi
            fi
            rm -f "$xml_out" "$icc_out"
          done
          xml_roundtrip_end_ns="$(date +%s%N)"
          xml_roundtrip_elapsed_ms="$(( (xml_roundtrip_end_ns - xml_roundtrip_start_ns) / 1000000 ))"
          printf 'xml-roundtrip\t%s\n' "$xml_roundtrip_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          printf 'XML round-trip: %s converted, %s iccToXml failures, %s non-blocking iccFromXml exits\n' \
            "$converted" "$xml_fail" "$from_xml_fail"
          {
            printf 'xml_converted=%s\n' "$converted"
            printf 'xml_failed=%s\n' "$xml_fail"
            printf 'xml_from_failed=%s\n' "$from_xml_fail"
            printf 'authored_xml_total=%s\n' "$authored_xml_total"
            printf 'authored_xml_pass=%s\n' "$authored_xml_pass"
            printf 'authored_xml_fail=%s\n' "$authored_xml_fail"
          } >> "$GITHUB_ENV"

          if [ "$xml_fail" -gt 0 ]; then
            echo "::notice title=XML round-trip::${xml_fail} profiles failed iccToXml conversion"
          fi
          if [ "$from_xml_fail" -gt 0 ]; then
            echo "::notice title=XML round-trip::${from_xml_fail} non-blocking iccFromXml exits"
          fi
          if [ "$authored_xml_total" -ne "$authored_profile_count" ] ||
             [ "$authored_xml_fail" -ne 0 ]; then
            echo "::error title=Authored profiles::XML round-trip failed for authored ICCs"
            exit 1
          fi

          rt_pass=0
          rt_fail=0
          rt_exercised=0
          rt_total=0
          rt_suitable=0
          roundtrip_classes="mntr prtr scnr"

          if [ -n "$roundtrip" ]; then
            icc_roundtrip_start_ns="$(date +%s%N)"
            for icc in "${icc_files[@]}"; do
              rt_total=$((rt_total + 1))
              profile_class=""
              if [ -f "$icc" ] && [ "$(stat -c%s "$icc" 2>/dev/null || printf 0)" -ge 128 ]; then
                profile_class="$(dd if="$icc" bs=1 skip=12 count=4 2>/dev/null | tr -d '\0 ')"
              fi

              if timeout 15s "$roundtrip" "$icc" >/dev/null 2>&1; then
                rc=0
              else
                rc="$?"
              fi

              is_suitable=false
              for cls in $roundtrip_classes; do
                if [ "$profile_class" = "$cls" ]; then
                  is_suitable=true
                  break
                fi
              done

              if [ "$is_suitable" = true ]; then
                rt_suitable=$((rt_suitable + 1))
                if [ "$rc" -eq 0 ]; then
                  rt_pass=$((rt_pass + 1))
                else
                  rt_fail=$((rt_fail + 1))
                  printf '%s  class=%s  exit=%s\n' "$(basename "$icc")" "$profile_class" "$rc" >> "$rt_fail_log"
                fi
              else
                rt_exercised=$((rt_exercised + 1))
              fi
            done
            icc_roundtrip_end_ns="$(date +%s%N)"
            icc_roundtrip_elapsed_ms="$(( (icc_roundtrip_end_ns - icc_roundtrip_start_ns) / 1000000 ))"
            printf 'icc-roundtrip\t%s\n' "$icc_roundtrip_elapsed_ms" \
              >> coverage-report/timing/phases.tsv
          fi

          {
            printf 'rt_pass=%s\n' "$rt_pass"
            printf 'rt_fail=%s\n' "$rt_fail"
            printf 'rt_suitable=%s\n' "$rt_suitable"
            printf 'rt_exercised=%s\n' "$rt_exercised"
            printf 'rt_total=%s\n' "$rt_total"
          } >> "$GITHUB_ENV"

          printf 'IccRoundTrip: %s suitable, %s pass, %s fail, %s others exercised\n' \
            "$rt_suitable" "$rt_pass" "$rt_fail" "$rt_exercised"
          if [ "$rt_fail" -gt 0 ]; then
            echo "::notice title=IccRoundTrip::${rt_fail} non-blocking exits from ${rt_suitable} suitable profiles"
          fi

          review_report="coverage-report/coverage-exercise-review.txt"
          append_review_section() {
            local title="$1"
            local path="$2"

            {
              printf '\n## %s\n\n' "$title"
              if [ -s "$path" ]; then
                cat "$path"
              else
                printf 'none\n'
              fi
            } >> "$review_report"
          }

          {
            printf 'iccDEV coverage exercise review\n'
            printf '================================\n\n'
            printf 'This report lists non-blocking coverage exercise exits for maintainer review.\n'
            printf 'The coverage workflow remains green when these exits are expected for coverage-only paths.\n\n'
            printf 'iccToXml conversion failures: %s\n' "$xml_fail"
            printf 'iccFromXml non-blocking exits: %s\n' "$from_xml_fail"
            printf 'iccRoundTrip non-blocking exits: %s of %s suitable profiles\n' "$rt_fail" "$rt_suitable"
            printf 'Other profiles exercised by iccRoundTrip for coverage only: %s\n' "$rt_exercised"
          } > "$review_report"
          append_review_section "iccToXml conversion failures" "$xml_fail_log"
          append_review_section "iccFromXml non-blocking exits" "$xml_from_fail_log"
          append_review_section "iccRoundTrip non-blocking exits" "$rt_fail_log"

      - name: "Exercise JSON and XML parser coverage"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          export LLVM_PROFILE_FILE="${WORKSPACE_DIR}/profraw/json-xml-parser-%4m.profraw"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"
          parser_dir="${RUNNER_TEMP}/iccdev-json-xml-parser-coverage"
          parser_log="${WORKSPACE_DIR}/coverage-report/json-xml-parser.txt"
          mkdir -p "$parser_dir"

          parser_start_ns="$(date +%s%N)"
          set +e
          ICCDEV_TOOLS_DIR="${build_dir}/Tools" \
          ICCDEV_TESTING_DIR="${WORKSPACE_DIR}/Testing" \
          ICCDEV_TEST_OUTDIR="$parser_dir" \
            .github/scripts/iccdev-json-parser-regression-tests.sh \
              > "$parser_log" 2>&1
          parser_rc="$?"
          set -e
          parser_end_ns="$(date +%s%N)"
          parser_elapsed_ms="$(( (parser_end_ns - parser_start_ns) / 1000000 ))"
          parser_profile_count="$(
            find "${WORKSPACE_DIR}/profraw" -maxdepth 1 -type f \
              -name 'json-xml-parser-*.profraw' -size +0c -print \
              | wc -l | tr -d ' '
          )"

          printf 'json-xml-parser\t%s\n' "$parser_elapsed_ms" \
            >> coverage-report/timing/phases.tsv
          {
            printf 'json_xml_parser_exit_code=%s\n' "$parser_rc"
            printf 'json_xml_parser_profile_count=%s\n' "$parser_profile_count"
            printf 'json_xml_parser_elapsed_ms=%s\n' "$parser_elapsed_ms"
          } >> "$GITHUB_ENV"

          if [ "$parser_rc" -ne 0 ] || [ "$parser_profile_count" -eq 0 ]; then
            echo "::group::JSON/XML parser coverage tail"
            tail -80 "$parser_log" | while IFS= read -r line; do
              sanitize_line "$line"
              printf '\n'
            done
            echo "::endgroup::"
          fi
          if [ "$parser_rc" -ne 0 ]; then
            echo "::error title=JSON/XML parser coverage::Regression driver exited with code ${parser_rc}"
            exit "$parser_rc"
          fi
          if [ "$parser_profile_count" -eq 0 ]; then
            echo "::error title=JSON/XML parser coverage::Regression driver produced no raw profiles"
            exit 1
          fi
          parser_total="$(sed -n 's/^  Total:[[:space:]]*//p' "$parser_log" | tail -1)"
          parser_passed="$(sed -n 's/^  Passed:[[:space:]]*//p' "$parser_log" | tail -1)"
          if [[ ! "$parser_total" =~ ^[0-9]+$ ]] ||
             [[ ! "$parser_passed" =~ ^[0-9]+$ ]] ||
             [ "$parser_total" -eq 0 ] ||
             [ "$parser_passed" -ne "$parser_total" ]; then
            echo "::error title=JSON/XML parser coverage::Missing or incomplete case summary"
            exit 1
          fi
          {
            printf 'json_xml_parser_total=%s\n' "$parser_total"
            printf 'json_xml_parser_passed=%s\n' "$parser_passed"
          } >> "$GITHUB_ENV"

      - name: "Merge profdata and generate reports"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          mkdir -p coverage-report
          profraw_count="$(find "${WORKSPACE_DIR}/profraw" -name '*.profraw' 2>/dev/null | wc -l)"
          if [ "$profraw_count" -eq 0 ]; then
            echo "::error title=No coverage data::No profraw files generated"
            exit 1
          fi

          printf 'Matching and merging %s profraw files...\n' "$profraw_count"
          merge_start_ns="$(date +%s%N)"
          LLVM_COV=llvm-cov-22 \
          LLVM_PROFDATA=llvm-profdata-22 \
            Build/Cmake/Testing/iccdev-matched-coverage-report.sh \
              "$build_dir" "${WORKSPACE_DIR}/profraw" coverage-report
          merge_end_ns="$(date +%s%N)"
          merge_elapsed_ms="$(( (merge_end_ns - merge_start_ns) / 1000000 ))"
          printf 'matched-coverage-report\t%s\n' "$merge_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          while IFS='=' read -r key value; do
            case "$key" in
              mismatch_count|html_mismatch_count|matched_object_count|\
              profile_signature_count|html_count|lcov_records|profdata_kb|\
              region_pct|func_pct|line_pct|branch_pct)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                printf -v "$key" '%s' "$value"
                ;;
              *)
                echo "::error title=Coverage metadata::Unexpected key ${key}"
                exit 1
                ;;
            esac
          done < coverage-report/coverage-env.txt
          printf 'profraw_count=%s\n' "$profraw_count" >> "$GITHUB_ENV"
          printf 'merge_elapsed_ms=%s\n' "$merge_elapsed_ms" >> "$GITHUB_ENV"

          tool_inventory="coverage-report/tool-inventory"
          mkdir -p "$tool_inventory"
          find "$build_dir" -path '*/Tools/*' -type f -executable \
            ! -name iccDumpProfileGui ! -name iccDescribeSinkTest \
            -printf '%f\n' \
            | LC_ALL=C sort -u > "$tool_inventory/built.txt"
          awk -F '\t' '
            NR > 1 && $2 ~ /\/Tools\// {
              n = split($2, parts, "/")
              print parts[n]
            }
          ' coverage-report/matched-objects.tsv \
            | LC_ALL=C sort -u > "$tool_inventory/matched.txt"
          LC_ALL=C comm -23 "$tool_inventory/built.txt" \
            "$tool_inventory/matched.txt" > "$tool_inventory/unmatched.txt"
          LC_ALL=C comm -13 "$tool_inventory/built.txt" \
            "$tool_inventory/matched.txt" > "$tool_inventory/unknown.txt"
          broad_built_tool_count="$(wc -l < "$tool_inventory/built.txt" | tr -d ' ')"
          broad_matched_tool_count="$(wc -l < "$tool_inventory/matched.txt" | tr -d ' ')"
          broad_unmatched_tool_count="$(wc -l < "$tool_inventory/unmatched.txt" | tr -d ' ')"
          if [ "$broad_built_tool_count" -ne "$tool_count" ] ||
             [ "$broad_matched_tool_count" -eq 0 ] ||
             [ -s "$tool_inventory/unknown.txt" ] ||
             [ "$((broad_matched_tool_count + broad_unmatched_tool_count))" -ne "$broad_built_tool_count" ]; then
            echo "::error title=Tool coverage inventory::Built and matched CLI inventories disagree"
            exit 1
          fi
          broad_unmatched_tools="$(paste -sd, "$tool_inventory/unmatched.txt")"
          broad_unmatched_tools="${broad_unmatched_tools:-none}"
          {
            printf 'Built CLI tools: %s\n' "$broad_built_tool_count"
            printf 'CLI tools in broad matched report: %s\n' "$broad_matched_tool_count"
            printf 'Built CLI tools outside broad matched report: %s\n' "$broad_unmatched_tool_count"
            printf '\nUnmatched tool basenames:\n'
            cat "$tool_inventory/unmatched.txt"
            printf '\niccBenchApply is a diagnostic benchmark. Its executable coverage\n'
            printf 'is distinct from shared apply-library coverage.\n'
            printf 'Optional tools not built on this runner are outside this inventory.\n'
          } > coverage-report/tool-coverage-inventory.txt
          {
            printf 'broad_matched_tool_count=%s\n' "$broad_matched_tool_count"
            printf 'broad_unmatched_tool_count=%s\n' "$broad_unmatched_tool_count"
            printf 'broad_unmatched_tools=%s\n' "$broad_unmatched_tools"
          } >> "$GITHUB_ENV"

          matched_notice="${matched_object_count} objects, ${mismatch_count} mismatches"
          echo "::notice title=Matched coverage::${matched_notice}, ${profdata_kb}KB profdata"
          printf 'Coverage: regions=%s functions=%s lines=%s branches=%s\n' \
            "$region_pct" "$func_pct" "$line_pct" "$branch_pct"

      - name: "Build and run full CTest core-library coverage"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          full_ctest_dir="${WORKSPACE_DIR}/profraw-full-ctest"
          core_profraw_dir="${WORKSPACE_DIR}/profraw-full-ctest-core"
          full_report_dir="${WORKSPACE_DIR}/coverage-report/full-ctest-core"
          full_ctest_artifacts="${WORKSPACE_DIR}/coverage-report/ctest-full"
          mkdir -p \
            "$full_ctest_dir" \
            "$core_profraw_dir" \
            "$full_report_dir" \
            "$full_ctest_artifacts"

          helper_log="${full_ctest_artifacts}/build-test-binaries.log"
          helper_start_ns="$(date +%s%N)"
          set +e
          cmake --build "$build_dir" \
            --target build-test-binaries \
            --parallel "$ICCDEV_BUILD_JOBS" \
            > "$helper_log" 2>&1
          helper_rc="$?"
          set -e
          helper_end_ns="$(date +%s%N)"
          helper_elapsed_ms="$(( (helper_end_ns - helper_start_ns) / 1000000 ))"
          printf 'build-test-binaries\t%s\n' "$helper_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          if [ "$helper_rc" -ne 0 ]; then
            echo "::group::build-test-binaries tail"
            tail -80 "$helper_log" | while IFS= read -r line; do
              sanitize_line "$line"
              printf '\n'
            done
            echo "::endgroup::"
            echo "::error title=CTest helpers::build-test-binaries exited with code ${helper_rc}"
            exit "$helper_rc"
          fi

          full_ctest_json="${full_ctest_artifacts}/ctest-tests.json"
          full_ctest_log="${full_ctest_artifacts}/ctest-output.txt"
          full_ctest_junit="${full_ctest_artifacts}/ctest-junit.xml"
          full_ctest_report="${full_ctest_artifacts}/ctest-measurement.txt"
          ctest --test-dir "$build_dir" \
            -LE '^standalone-aggregate$' \
            --show-only=json-v1 \
            > "$full_ctest_json"
          full_ctest_test_count="$(jq -r '.tests | length' "$full_ctest_json")"

          export PATH="${tool_path_dirs}${PATH}"
          export LD_LIBRARY_PATH="${library_path_dirs}${LD_LIBRARY_PATH:-}"
          export LLVM_PROFILE_FILE="${full_ctest_dir}/full-ctest-%4m.profraw"

          full_ctest_start_ns="$(date +%s%N)"
          set +e
          ctest --test-dir "$build_dir" \
            -j "$ICCDEV_BUILD_JOBS" \
            -LE '^standalone-aggregate$' \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$full_ctest_junit" \
            > "$full_ctest_log" 2>&1
          full_ctest_rc="$?"
          set -e
          full_ctest_end_ns="$(date +%s%N)"
          full_ctest_elapsed_ms="$(( (full_ctest_end_ns - full_ctest_start_ns) / 1000000 ))"
          printf 'ctest-full\t%s\n' "$full_ctest_elapsed_ms" \
            >> coverage-report/timing/phases.tsv
          full_ctest_profile_count="$(
            find "$full_ctest_dir" -maxdepth 1 -type f \
              -name 'full-ctest-*.profraw' -size +0c -print | wc -l | tr -d ' '
          )"

          full_ctest_total_line="$(
            grep -E 'tests (failed|passed) out of [0-9]+|No tests were found' \
              "$full_ctest_log" | tail -1 || true
          )"
          full_ctest_time_line="$(grep -E '^Total Test time' "$full_ctest_log" | tail -1 || true)"
          {
            printf 'iccDEV full CTest coverage measurement\n'
            printf '=====================================\n\n'
            printf 'Discovered tests: %s\n' "$full_ctest_test_count"
            printf 'CTest exit code: %s\n' "$full_ctest_rc"
            printf 'Nonempty raw profiles: %s\n' "$full_ctest_profile_count"
            printf 'Elapsed wall time: %s milliseconds\n' "$full_ctest_elapsed_ms"
            printf 'Excluded label: standalone-aggregate (run by the focused phase)\n'
            printf 'CTest summary: %s\n' "${full_ctest_total_line:-n/a}"
            printf 'CTest timing: %s\n' "${full_ctest_time_line:-n/a}"
          } > "$full_ctest_report"

          if [ "$full_ctest_rc" -ne 0 ]; then
            echo "::group::Full CTest tail"
            tail -120 "$full_ctest_log" | while IFS= read -r line; do
              sanitize_line "$line"
              printf '\n'
            done
            echo "::endgroup::"
            echo "::error title=Full CTest::Full coverage suite exited with code ${full_ctest_rc}"
            exit "$full_ctest_rc"
          fi
          if [ "$full_ctest_profile_count" -eq 0 ]; then
            echo "::error title=Full CTest coverage::Full suite produced no nonempty raw profiles"
            exit 1
          fi

          junit_counts="$(python3 -c '
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if root.tag != "testsuite":
              sys.exit("Unexpected CTest JUnit root: " + root.tag)
          print(*(int(root.attrib[key]) for key in
                  ("tests", "failures", "disabled", "skipped")))
          ' "$full_ctest_junit")"
          read -r junit_total junit_failures junit_disabled junit_skipped <<< "$junit_counts"
          if [ "$junit_total" -ne "$full_ctest_test_count" ] ||
             [ "$junit_failures" -ne 0 ] ||
             [ "$junit_disabled" -ne 0 ] ||
             [ "$junit_skipped" -gt "$junit_total" ]; then
            echo "::error title=Full CTest JUnit::Unexpected passed, failed, or skipped test counts"
            exit 1
          fi
          full_ctest_passed_count="$((junit_total - junit_skipped))"
          full_ctest_skipped_count="$junit_skipped"
          {
            printf 'Passed tests: %s\n' "$full_ctest_passed_count"
            printf 'Skipped tests: %s\n' "$full_ctest_skipped_count"
          } >> "$full_ctest_report"

          core_signatures="${full_ctest_artifacts}/core-library-signatures.txt"
          awk -F '\t' '
            NR > 1 && $2 ~ /libIcc(ProfLib|XML|JSON|Connect)2/ {
              print $1
            }
          ' coverage-report/matched-objects.tsv | sort -u > "$core_signatures"
          core_signature_count="$(wc -l < "$core_signatures" | tr -d ' ')"
          if [ "$core_signature_count" -ne 4 ]; then
            core_error="Expected 4 core library signatures"
            echo "::error title=Core coverage signatures::${core_error}, found ${core_signature_count}"
            exit 1
          fi

          while IFS= read -r signature; do
            signature_profile_count="$(
              find "$full_ctest_dir" -maxdepth 1 -type f \
                \( -name "*-${signature}.profraw" \
                   -o -name "*-${signature}_[0-9]*.profraw" \) \
                -size +0c -print | wc -l | tr -d ' '
            )"
            if [ "$signature_profile_count" -eq 0 ]; then
              echo "::error title=Core CTest coverage::No profile for signature ${signature}"
              exit 1
            fi
            find "$full_ctest_dir" -maxdepth 1 -type f \
              \( -name "*-${signature}.profraw" \
                 -o -name "*-${signature}_[0-9]*.profraw" \) \
              -exec cp '{}' "$core_profraw_dir/" \;
          done < "$core_signatures"
          full_ctest_core_profile_count="$(
            find "$core_profraw_dir" -maxdepth 1 -type f \
              -name '*.profraw' -size +0c -print | wc -l | tr -d ' '
          )"
          if [ "$full_ctest_core_profile_count" -eq 0 ]; then
            echo "::error title=Core CTest coverage::No core-library profiles were selected"
            exit 1
          fi

          full_report_start_ns="$(date +%s%N)"
          LLVM_COV=llvm-cov-22 \
          LLVM_PROFDATA=llvm-profdata-22 \
            Build/Cmake/Testing/iccdev-matched-coverage-report.sh \
              "$build_dir" "$core_profraw_dir" "$full_report_dir"
          full_report_end_ns="$(date +%s%N)"
          full_report_elapsed_ms="$(( (full_report_end_ns - full_report_start_ns) / 1000000 ))"
          printf 'matched-coverage-full-ctest-core\t%s\n' "$full_report_elapsed_ms" \
            >> coverage-report/timing/phases.tsv

          while IFS='=' read -r key value; do
            case "$key" in
              mismatch_count|html_mismatch_count|matched_object_count|\
              profile_signature_count|html_count|lcov_records|profdata_kb|\
              region_pct|func_pct|line_pct|branch_pct)
                printf 'full_ctest_core_%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                printf -v "full_ctest_core_${key}" '%s' "$value"
                ;;
              *)
                echo "::error title=Full CTest coverage metadata::Unexpected key ${key}"
                exit 1
                ;;
            esac
          done < "$full_report_dir/coverage-env.txt"
          if [ "$full_ctest_core_profile_signature_count" -ne 4 ] ||
             [ "$full_ctest_core_matched_object_count" -ne 4 ]; then
            core_report_error="Expected 4 profile signatures and matched objects"
            echo "::error title=Core CTest report::${core_report_error}"
            exit 1
          fi
          {
            printf 'full_ctest_exit_code=%s\n' "$full_ctest_rc"
            printf 'full_ctest_test_count=%s\n' "$full_ctest_test_count"
            printf 'full_ctest_passed_count=%s\n' "$full_ctest_passed_count"
            printf 'full_ctest_skipped_count=%s\n' "$full_ctest_skipped_count"
            printf 'full_ctest_profile_count=%s\n' "$full_ctest_profile_count"
            printf 'full_ctest_core_profile_count=%s\n' "$full_ctest_core_profile_count"
            printf 'full_ctest_elapsed_ms=%s\n' "$full_ctest_elapsed_ms"
            printf 'full_ctest_helper_elapsed_ms=%s\n' "$helper_elapsed_ms"
            printf 'full_ctest_report_elapsed_ms=%s\n' "$full_report_elapsed_ms"
          } >> "$GITHUB_ENV"

          full_core_line_pct="$(
            sed -n 's/^line_pct=//p' "$full_report_dir/coverage-env.txt"
          )"
          full_core_notice="${full_ctest_passed_count} passed, ${full_ctest_skipped_count} skipped"
          full_core_notice+=", ${full_ctest_core_profile_count} core profiles"
          full_core_notice+=", ${full_core_line_pct} lines"
          echo "::notice title=Full CTest core coverage::${full_core_notice}"

      - name: "Write workflow summary"
        if: always()
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          summary_line() {
            sanitize_line "$1" >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
          }

          summary_pre_line() {
            sanitize_print "$1" >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
          }

          summary_line "## Code Coverage Report"
          summary_line ""
          summary_line "### Broad tool and profile coverage"
          summary_line "| Metric | Coverage |"
          summary_line "|--------|----------|"
          summary_line "| Regions | ${region_pct:-n/a} |"
          summary_line "| Functions | ${func_pct:-n/a} |"
          summary_line "| Lines | ${line_pct:-n/a} |"
          summary_line "| Branches | ${branch_pct:-n/a} |"
          summary_line ""
          summary_line "Module-matched aggregate from the focused hybrid CTest and broad tool/profile exercises."
          summary_line "Mismatched function records: ${mismatch_count:-n/a}"
          summary_line "Broad matched CLI tools: ${broad_matched_tool_count:-n/a}/${tool_count:-n/a} built."
          unmatched_row="Built CLIs outside the broad report "
          unmatched_row+="(${broad_unmatched_tool_count:-n/a}): ${broad_unmatched_tools:-n/a}."
          summary_line "$unmatched_row"
          summary_line "The inventory covers built command-line binaries; optional unbuilt tools are excluded."
          summary_line "iccBenchApply is a diagnostic benchmark; its executable has separate coverage."
          summary_line ""
          summary_line "### Full CTest core-library coverage"
          summary_line "| Metric | Coverage |"
          summary_line "|--------|----------|"
          summary_line "| Regions | ${full_ctest_core_region_pct:-n/a} |"
          summary_line "| Functions | ${full_ctest_core_func_pct:-n/a} |"
          summary_line "| Lines | ${full_ctest_core_line_pct:-n/a} |"
          summary_line "| Branches | ${full_ctest_core_branch_pct:-n/a} |"
          summary_line ""
          full_core_scope="Four build-tree core libraries only; excludes tool, helper-test,"
          full_core_scope+=" rebuilt-package, and platform-only objects."
          summary_line "$full_core_scope"
          summary_line ""
          summary_line "### Test Execution"
          summary_line "| Step | Result | Details |"
          summary_line "|------|--------|---------|"
          staged_row="| ICC profiles staged after stubs | ${profile_count:-n/a} |"
          staged_row+=" ${testing_profile_count:-0} Testing + ${authored_profile_count:-0} authored |"
          summary_line "$staged_row"
          summary_line \
            "| ci-inside-stub | ${ci_stub_pass:-0}/${ci_stub_total:-0} pass | ${ci_stub_elapsed_ms:-n/a} ms |"
          focused_ctest_row="| Focused hybrid CTest | exit ${ctest_exit_code:-n/a} |"
          focused_ctest_row+=" ${ctest_test_count:-0} tests, ${ctest_elapsed_ms:-n/a} ms |"
          summary_line "$focused_ctest_row"
          summary_line \
            "| CTest raw profiles | ${ctest_profile_count:-0} | nonempty ctest-*.profraw files |"
          summary_line \
            "| Large profile CTest | ${ctest_large_profile_seconds:-n/a}s | iccdev.hybrid-pipeline |"
          full_ctest_row="| Full CTest | exit ${full_ctest_exit_code:-n/a} |"
          full_ctest_row+=" ${full_ctest_passed_count:-n/a} passed,"
          full_ctest_row+=" ${full_ctest_skipped_count:-n/a} skipped of ${full_ctest_test_count:-0};"
          full_ctest_row+=" ${full_ctest_elapsed_ms:-n/a} ms |"
          summary_line "$full_ctest_row"
          full_profile_row="| Full CTest raw profiles | ${full_ctest_profile_count:-0} |"
          full_profile_row+=" ${full_ctest_core_profile_count:-0} selected for core report |"
          summary_line "$full_profile_row"
          summary_line "| iccDumpProfile | ${dump_pass:-0}/${dump_total:-0} pass | ${dump_fail:-0} failures |"
          authored_dump_row="| Authored ICC validation |"
          authored_dump_row+=" ${authored_dump_pass:-0}/${authored_dump_total:-0} pass |"
          authored_dump_row+=" required iccDumpProfile -v |"
          summary_line "$authored_dump_row"
          summary_line "| ICC to XML | ${xml_converted:-0} converted | ${xml_failed:-0} iccToXml failures |"
          authored_xml_row="| Authored ICC XML round-trip |"
          authored_xml_row+=" ${authored_xml_pass:-0}/${authored_xml_total:-0} pass |"
          authored_xml_row+=" required iccToXml and iccFromXml |"
          summary_line "$authored_xml_row"
          summary_line "| ICC.2 XML specification QA | ${xml_spec_qa:-not run} | spectral, bi-spectral, MCS |"
          summary_line "| iccFromXml | ${xml_from_failed:-0} non-blocking exits | see exercise review |"
          summary_line \
            "| iccRoundTrip | ${rt_pass:-0}/${rt_suitable:-0} suitable pass | ${rt_fail:-0} non-blocking exits |"
          summary_line "| Other profiles | ${rt_exercised:-0} exercised | coverage only |"
          parser_row="| JSON/XML parser |"
          parser_row+=" ${json_xml_parser_passed:-n/a}/${json_xml_parser_total:-n/a} cases pass"
          parser_row+=" (exit ${json_xml_parser_exit_code:-n/a}) |"
          parser_row+=" ${json_xml_parser_profile_count:-0} raw .profraw files,"
          parser_row+=" ${json_xml_parser_elapsed_ms:-n/a} ms |"
          summary_line "$parser_row"
          summary_line ""
          summary_line "### Build"
          summary_line "| Component | Value |"
          summary_line "|-----------|-------|"
          summary_line "| Compiler | clang-22 source-based coverage |"
          summary_line "| Configure | ${configure_ms:-n/a} ms |"
          summary_line "| Compile | ${compile_ms:-n/a} ms |"
          summary_line "| CTest helper build | ${full_ctest_helper_elapsed_ms:-n/a} ms |"
          summary_line "| Matched report | ${merge_elapsed_ms:-n/a} ms |"
          summary_line "| Full CTest core report | ${full_ctest_report_elapsed_ms:-n/a} ms |"
          summary_line "| Tools built | ${tool_count:-n/a} |"
          summary_line "| Profraw files | ${profraw_count:-n/a} |"
          summary_line "| Profile signatures | ${profile_signature_count:-n/a} |"
          summary_line "| Matched objects | ${matched_object_count:-n/a} |"
          summary_line "| HTML pages | ${html_count:-n/a} |"
          summary_line "| LCOV source records | ${lcov_records:-n/a} |"
          summary_line ""
          summary_line "### Code Statistics"
          summary_line "| Metric | Value |"
          summary_line "|--------|------:|"
          summary_line "| Languages | ${code_stats_languages:-n/a} |"
          summary_line "| Files | ${code_stats_files:-n/a} |"
          summary_line "| Code lines | ${code_stats_code:-n/a} |"
          summary_line "| Comment lines | ${code_stats_comment:-n/a} |"
          summary_line "| Blank lines | ${code_stats_blank:-n/a} |"
          summary_line "| Total lines | ${code_stats_total:-n/a} |"
          summary_line ""
          if [ -f coverage-report/code-stats/top-languages.md ]; then
            while IFS= read -r line; do
              summary_line "$line"
            done < coverage-report/code-stats/top-languages.md
            summary_line ""
          fi
          summary_line "### Developer Report Artifact"
          summary_line "Coverage HTML, lcov, CTest data, code stats, review data, and failure logs"
          summary_line "are packaged in the sanitized developer report artifact, including partial failure evidence."
          summary_line ""
          summary_line "### llvm-cov Text Report"
          printf '<pre>\n' >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
          if [ -f coverage-report/coverage-summary.txt ]; then
            while IFS= read -r line; do
              summary_pre_line "$line"
            done < coverage-report/coverage-summary.txt
          else
            summary_pre_line "No coverage data available"
          fi
          printf '</pre>\n' >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: "Package developer coverage report"
        if: always()
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "${TRUSTED_SCRIPTS}/sanitize-sed.sh"

          report_dir="coverage-report/developer-report"
          mkdir -p "$report_dir"

          {
            printf 'iccDEV coverage developer report\n'
            printf '================================\n\n'
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Run: %s\n\n' "${GITHUB_RUN_ID:-local}"
            printf 'Open developer-report/index.html for the presentation view.\n'
            printf 'Broad coverage HTML is under html/ and the full CTest core-library '
            printf 'report is under full-ctest-core/. Authored ICCs are under '
            printf 'authored-profiles/; the built-tool inventory is under '
            printf 'tool-inventory/. Supporting data is in ctest/, ctest-full/, '
            printf 'code-stats/, matched/, profdata/, and timing/.\n'
          } > "${report_dir}/README.txt"

          html="${report_dir}/index.html"
          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en"><head><meta charset="utf-8">'
            printf '%s\n' '<title>iccDEV Coverage Developer Report</title>'
            printf '%s' '<style>body{font-family:system-ui,sans-serif;margin:2rem;'
            printf '%s' 'line-height:1.4}table{border-collapse:collapse;width:100%;'
            printf '%s' 'margin:1rem 0}th,td{border:1px solid #ddd;padding:.45rem;'
            printf '%s' 'text-align:left}th{background:#f4f6f8}code{background:#f4f6f8;'
            printf '%s\n' 'padding:.1rem .25rem}</style>'
            printf '%s\n' '</head><body>'
            printf '<h1>iccDEV Coverage Developer Report</h1>\n'
            printf '<h2>Broad tool and profile coverage</h2>\n'
            printf '<table><tr><th>Component</th><th>Value</th></tr>\n'
            printf '<tr><td>Commit</td><td><code>%s</code></td></tr>\n' "$(escape_html "$(git rev-parse --short HEAD)")"
            printf '<tr><td>Run</td><td><code>%s</code></td></tr>\n' "$(escape_html "${GITHUB_RUN_ID:-local}")"
            printf '<tr><td>Regions</td><td>%s</td></tr>\n' "$(escape_html "${region_pct:-n/a}")"
            printf '<tr><td>Functions</td><td>%s</td></tr>\n' "$(escape_html "${func_pct:-n/a}")"
            printf '<tr><td>Lines</td><td>%s</td></tr>\n' "$(escape_html "${line_pct:-n/a}")"
            printf '<tr><td>Branches</td><td>%s</td></tr>\n' "$(escape_html "${branch_pct:-n/a}")"
            mismatch_html="$(escape_html "${mismatch_count:-n/a}")"
            printf '<tr><td>Mismatched function records</td><td>%s</td></tr>\n' \
              "$mismatch_html"
            printf '</table>\n'

            printf '<h2>Full CTest core-library coverage</h2>\n'
            printf '<table><tr><th>Metric</th><th>Coverage</th></tr>\n'
            printf '<tr><td>Regions</td><td>%s</td></tr>\n' \
              "$(escape_html "${full_ctest_core_region_pct:-n/a}")"
            printf '<tr><td>Functions</td><td>%s</td></tr>\n' \
              "$(escape_html "${full_ctest_core_func_pct:-n/a}")"
            printf '<tr><td>Lines</td><td>%s</td></tr>\n' \
              "$(escape_html "${full_ctest_core_line_pct:-n/a}")"
            printf '<tr><td>Branches</td><td>%s</td></tr>\n' \
              "$(escape_html "${full_ctest_core_branch_pct:-n/a}")"
            printf '</table>\n'

            if [ -f coverage-report/coverage-summary.txt ]; then
              printf '<h2>Clean Per-Signature Coverage</h2><pre>\n'
              while IFS= read -r line; do
                sanitize_print "$line"
                printf '\n'
              done < coverage-report/coverage-summary.txt
              printf '</pre>\n'
            fi

            if [ -f coverage-report/full-ctest-core/coverage-summary.txt ]; then
              printf '<h2>Full CTest Core-Library Per-Signature Coverage</h2><pre>\n'
              while IFS= read -r line; do
                sanitize_print "$line"
                printf '\n'
              done < coverage-report/full-ctest-core/coverage-summary.txt
              printf '</pre>\n'
            fi

            if [ -f coverage-report/code-stats/top-languages.md ]; then
              printf '<h2>Top Languages</h2><pre>\n'
              while IFS= read -r line; do
                sanitize_print "$line"
                printf '\n'
              done < coverage-report/code-stats/top-languages.md
              printf '</pre>\n'
            fi

            printf '<h2>Coverage HTML</h2><ul>\n'
            if [ -d coverage-report/html ]; then
              find coverage-report/html -name index.html -type f | sort | while IFS= read -r file; do
                rel="${file#coverage-report/}"
                printf '<li><a href="../%s">%s</a></li>\n' \
                  "$(escape_html "$rel")" \
                  "$(escape_html "$rel")"
              done
            else
              printf '<li>Coverage HTML was not generated.</li>\n'
            fi
            printf '</ul>\n'

            printf '<h2>Full CTest Core-Library Coverage HTML</h2><ul>\n'
            if [ -d coverage-report/full-ctest-core/html ]; then
              find coverage-report/full-ctest-core/html -name index.html -type f \
                | sort | while IFS= read -r file; do
                rel="${file#coverage-report/}"
                printf '<li><a href="../%s">%s</a></li>\n' \
                  "$(escape_html "$rel")" \
                  "$(escape_html "$rel")"
              done
            else
              printf '<li>Full CTest core-library HTML was not generated.</li>\n'
            fi
            printf '</ul>\n'

            printf '<h2>Included Data</h2><ul>\n'
            find coverage-report \
              -path 'coverage-report/developer-report' -prune -o \
              -type f -print | sort | while IFS= read -r file; do
              rel="${file#coverage-report/}"
              printf '<li><a href="../%s">%s</a></li>\n' \
                "$(escape_html "$rel")" \
                "$(escape_html "$rel")"
            done
            printf '</ul></body></html>\n'
          } > "$html"

      - name: "Upload developer coverage report"
        if: always()
        # preflight: allow-untrusted-artifact reason=sanitized-developer-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: iccdev-code-coverage-developer-report
          path: coverage-report
          if-no-files-found: error
          # llvm-cov includes generated pages under html/.../.github/.
          include-hidden-files: true
          retention-days: 14
