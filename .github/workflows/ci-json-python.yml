name: "ci-json-python"

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "ci-json-python-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Python versions: cover declared min, current, and max supported.
  # ---------------------------------------------------------------
  # ---------------------------------------------------------------
  # Linux: Python package build + light native smoke
  # ---------------------------------------------------------------
  linux:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    uses: ./.github/workflows/_build-test-unix.yml
    with:
      os: ubuntu-latest
      python-version: ${{ matrix.python-version }}
      run-full-tests: false

  # ---------------------------------------------------------------
  # macOS: Build + light tests (CreateAllProfiles only)
  # ---------------------------------------------------------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    uses: ./.github/workflows/_build-test-unix.yml
    with:
      os: macos-latest
      python-version: ${{ matrix.python-version }}
      run-full-tests: false

  # ---------------------------------------------------------------
  # Windows: Build + Python wheel + MCP
  # ---------------------------------------------------------------
  windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    uses: ./.github/workflows/_build-test-windows.yml
    with:
      python-version: ${{ matrix.python-version }}
