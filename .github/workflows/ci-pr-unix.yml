name: "ci-pr-unix"

# Existing workflow-call JSON defaults and shell snippets intentionally exceed
# the default yamllint line length. Keep the disable local to this workflow.
# yamllint disable rule:line-length

permissions:
  contents: read
  pull-requests: read  # Required by reusable PR build callers.

on:
  workflow_call:
    inputs:
      os-list:
        description: "List of operating systems"
        required: false
        default: '["ubuntu-24.04", "macos-latest"]'
        type: string
      build-types:
        description: "Build types"
        required: false
        default: '["Release", "Debug"]'
        type: string
      compilers:
        description: "Compiler list"
        required: false
        default: '["gcc", "clang"]'
        type: string
      enable-lto:
        description: "Enable LTO in CMake"
        required: false
        default: false
        type: boolean
      warning-policy:
        description: "Compiler warning policy: warn or fail"
        required: false
        default: warn
        type: string
      profile-test-mode:
        description: "Profile test mode: full, smoke, or skip"
        required: false
        default: full
        type: string
      compiler-version:
        description: "Compiler version selector: system or gcc-15"
        required: false
        default: system
        type: string
      target-sha:
        description: "Exact commit SHA to check out"
        required: false
        default: ""
        type: string

# Concurrency is set at job level so each matrix cell has its own group.
# Workflow-level concurrency cannot use github.job (empty) or matrix.* values,
# and github.workflow in a reusable workflow returns the caller's name.

env:
  GH_REPO: ${{ github.repository }}
  GH_NO_UPDATE_NOTIFIER: 1
  GH_PROMPT_DISABLED: 1
  RUN_URL: ${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}
  PR: ${{ github.event.number }}

jobs:
  build:
    name: "${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: pr-unix-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-list || '["ubuntu-24.04", "macos-latest"]') }}
        compiler: ${{ fromJson(inputs.compilers || '["gcc-15", "clang-22", "clang"]') }}
        build_type: ${{ fromJson(inputs.build-types || '["Release", "Debug"]') }}
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: macos-latest
            compiler: gcc-15
          - os: macos-latest
            compiler: clang-22
          - os: ubuntu-24.04
            compiler: clang

    steps:
      - name: Check out Repository
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          ref: ${{ inputs.target-sha || github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted sanitizer helper
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: .trusted-workflow
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Validate matrix inputs
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh

          OS="${MATRIX_OS}"
          COMP="${MATRIX_COMPILER}"
          BT="${MATRIX_BUILD_TYPE}"

          case "$OS" in
            ubuntu-24.04|macos-latest) ;;
            *) echo "ERROR: invalid matrix.os: '$OS'. Allowed: ubuntu-24.04, macos-latest"; exit 1 ;;
          esac
          case "$COMP" in
            gcc|gcc-15|clang|clang-22) ;;
            *) echo "ERROR: invalid compiler: '$COMP'. Allowed: gcc, gcc-15, clang, clang-22"; exit 1 ;;
          esac
          case "$BT" in
            Release|Debug) ;;
            *) echo "ERROR: invalid build type: '$BT'. Allowed: Release, Debug"; exit 1 ;;
          esac

      - name: Print the PR Branch Details
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_SHA: ${{ inputs.target-sha || github.event.pull_request.head.sha || github.sha }}
          PR_EVENT_NAME: ${{ github.event_name }}
          PR_BUILD_TYPE: ${{ matrix.build_type }}
          PR_COMPILER: ${{ matrix.compiler }}
          PR_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          safe_event="$(sanitize_line "${PR_EVENT_NAME}")"
          safe_base="$(sanitize_ref "${PR_BASE_REF}")"
          safe_head="$(sanitize_ref "${PR_HEAD_REF}")"
          safe_sha="$(sanitize_line "${TARGET_SHA}")"
          safe_build_type="$(sanitize_line "${PR_BUILD_TYPE}")"
          safe_compiler="$(sanitize_line "${PR_COMPILER}")"
          safe_os="$(sanitize_line "${PR_OS}")"

          echo "Triggered by:  ${safe_event}"
          echo "Base branch:   ${safe_base}"
          echo "Head branch:   ${safe_head}"
          echo "Commit SHA:    ${safe_sha}"
          echo "Build Type:    ${safe_build_type}"
          echo "Compiler:      ${safe_compiler}"
          echo "OS:            ${safe_os}"

          {
            echo "### PR Branch Details"
            echo ""
            echo "**Triggered by:**  ${safe_event}"
            echo "**Base branch:**   ${safe_base}"
            echo "**Head branch:**   ${safe_head}"
            echo "**Commit SHA:**    ${safe_sha}"
            echo "**Build Type:**    ${safe_build_type}"
            echo "**Compiler:**      ${safe_compiler}"
            echo "**OS:**            ${safe_os}"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          COMPILER_VERSION: ${{ inputs.compiler-version || 'system' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          case "$MATRIX_COMPILER" in
            gcc-15)
              sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
              ;;
            clang-22)
              llvm_key="$RUNNER_TEMP/llvm-snapshot.gpg.key"
              llvm_keyring="$RUNNER_TEMP/llvm-snapshot.gpg"
              curl --fail --location --silent --show-error \
                https://apt.llvm.org/llvm-snapshot.gpg.key \
                --output "$llvm_key"
              gpg --show-keys --with-colons "$llvm_key" > "$RUNNER_TEMP/llvm-key-info"
              llvm_fingerprint="$(awk -F: '$1 == "fpr" {print $10; exit}' "$RUNNER_TEMP/llvm-key-info")"
              if [ "$llvm_fingerprint" != "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421" ]; then
                echo "Unexpected LLVM APT key fingerprint: $llvm_fingerprint" >&2
                exit 1
              fi
              gpg --dearmor --output "$llvm_keyring" "$llvm_key"
              sudo install -m 0644 "$llvm_keyring" /usr/share/keyrings/llvm-snapshot.gpg
              printf '%s\n' \
                'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' |
                sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list >/dev/null
              ;;
          esac
          bash .github/scripts/ci-safe-apt-update.sh
          packages=(
            build-essential cmake \
            libpng-dev libxml2-dev libtiff-dev \
            nlohmann-json3-dev libwxgtk3.2-dev wx-common \
            python3 python3-pip curl git
          )
          case "$MATRIX_COMPILER" in
            gcc-15) packages+=(gcc-15 g++-15) ;;
            clang-22) packages+=(clang-22 clang-tools-22 llvm-22) ;;
            gcc) packages+=(gcc g++) ;;
            clang) packages+=(clang clang-tools llvm) ;;
            *) echo "ERROR: invalid compiler: '$MATRIX_COMPILER'"; exit 1 ;;
          esac
          if [ "$COMPILER_VERSION" = "gcc-15" ] && [ "$MATRIX_COMPILER" = "gcc" ]; then
            packages+=(gcc-15 g++-15)
          fi
          sudo apt-get install -y "${packages[@]}"

      - name: Install Build Dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          brew install cmake llvm wxwidgets libpng libtiff libxml2 nlohmann-json jpeg-turbo

      - name: Set Compiler Environment Variables
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_COMPILER: ${{ matrix.compiler }}
          COMPILER_VERSION: ${{ inputs.compiler-version || 'system' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          case "$COMPILER_VERSION" in
            system|gcc-15) ;;
            *) echo "::error title=Invalid compiler version::${COMPILER_VERSION}"; exit 1 ;;
          esac
          if [ "$MATRIX_COMPILER" = "gcc" ] && [ "$COMPILER_VERSION" = "gcc-15" ]; then
            command -v gcc-15 >/dev/null 2>&1
            command -v g++-15 >/dev/null 2>&1
            echo "CC=gcc-15" >> "$GITHUB_ENV"
            echo "CXX=g++-15" >> "$GITHUB_ENV"
          elif [ "$MATRIX_COMPILER" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure with CMake
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
          ENABLE_LTO: ${{ inputs.enable-lto && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          echo "Configuring CMake project..."
          mkdir -p Build
          cd Build
          cmake -DCMAKE_BUILD_TYPE="${MATRIX_BUILD_TYPE}" \
                -DCMAKE_C_COMPILER="$CC" \
                -DCMAKE_CXX_COMPILER="$CXX" \
                -DENABLE_LTO="${ENABLE_LTO}" \
                 Cmake
          echo "::group::CMake Cache"
          cat CMakeCache.txt || true
          echo "::endgroup::"

      - name: Build Project
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          WARNING_POLICY: ${{ inputs.warning-policy || 'warn' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          echo "Start build..."
          cd Build
          echo "Compiler: $CC ($($CC --version | head -n 1))"
          echo "CMake build type: ${MATRIX_BUILD_TYPE}"
          jobs="$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"
          make -j"$jobs" 2>&1 | tee build.log
          grep -E 'warning:' build.log > all-warnings.log || true
          if [ "$MATRIX_COMPILER" = "gcc-15" ]; then
            # GCC 15 emits this false positive from libstdc++ internals.
            gcc15_false_positive='^/usr/include/c\+\+/15/.*warning: potential null pointer dereference \[-Wnull-dereference\]$|^cc1plus: warning: null pointer dereference \[-Wnull-dereference\]$'
            grep -Ev "$gcc15_false_positive" all-warnings.log > actionable-warnings.log || true
            SUPPRESSED_WARNING_COUNT=$(grep -Ec "$gcc15_false_positive" all-warnings.log || true)
          else
            cp all-warnings.log actionable-warnings.log
            SUPPRESSED_WARNING_COUNT=0
          fi
          WARNING_COUNT=$(grep -c . actionable-warnings.log || true)
          if [ "$SUPPRESSED_WARNING_COUNT" -gt 0 ]; then
            echo "[INFO] Suppressed ${SUPPRESSED_WARNING_COUNT} known GCC 15 libstdc++ false-positive warning(s)"
          fi
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::warning title=Compiler Warnings::${WARNING_COUNT} warning(s) detected"
            sort -u actionable-warnings.log | sed -n '1,20p'
            if [ "$WARNING_POLICY" = "fail" ]; then
              echo "::error title=Compiler Warnings::warning-policy=fail rejected ${WARNING_COUNT} warning(s)"
              exit 1
            fi
          else
            echo "[OK] Zero compiler warnings"
          fi

      - name: Verify Static Libraries Contain Native Objects
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          BITCODE_FOUND=0
          STATIC_POSTFIX=""
          if [ "$MATRIX_BUILD_TYPE" = "Debug" ]; then
            STATIC_POSTFIX="d"
          fi
          for lib in Build/IccProfLib/libIccProfLib2-static${STATIC_POSTFIX}.a \
                     Build/IccXML/libIccXML2-static${STATIC_POSTFIX}.a \
                     Build/IccJSON/libIccJSON2-static${STATIC_POSTFIX}.a \
                     Build/IccConnect/libIccConnect2-static${STATIC_POSTFIX}.a; do
            if [ ! -f "$lib" ]; then
              echo "::error title=Missing Static Library::$lib not found"
              exit 1
            fi
            TMP_DIR="$(mktemp -d)"
            (cd "$TMP_DIR" && ar x "$GITHUB_WORKSPACE/$lib")
            for obj in "$TMP_DIR"/*.o; do
              [ -f "$obj" ] || continue
              FILE_OUT="$(file "$obj")"
              if grep -qi 'LLVM IR bitcode\|LLVM bitcode' <<< "$FILE_OUT"; then
                echo "[FAIL] LLVM bitcode in $lib: $(basename "$obj")"
                BITCODE_FOUND=1
              fi
            done
            OBJ_COUNT="$(find "$TMP_DIR" -name '*.o' | wc -l | tr -d ' ')"
            echo "[OK] $lib: $OBJ_COUNT native objects"
            rm -rf "$TMP_DIR"
          done
          if [ "$BITCODE_FOUND" -ne 0 ]; then
            echo "::error title=Static Library Bitcode::One or more static libraries contain LLVM IR bitcode instead of native objects (see issue 814)"
            exit 1
          fi

      - name: Create Profiles
        if: ${{ inputs.profile-test-mode != 'skip' }}
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          PROFILE_TEST_MODE: ${{ inputs.profile-test-mode || 'full' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          echo "Creating profiles..."
          cd Testing
          echo "=== Updating PATH ==="
          for d in ../Build/Tools/*; do
            if [ -d "$d" ]; then
              tool_dir="$(realpath "$d")"
              export PATH="${tool_dir}:$PATH"
            fi
          done
          sh CreateAllProfiles.sh
          if [ "$PROFILE_TEST_MODE" = "smoke" ]; then
            echo "[OK] Smoke profile generation completed"
            find . -iname "*.icc" | sed -n '1,20p'
            exit 0
          fi
          if [ "$PROFILE_TEST_MODE" != "full" ]; then
            echo "::error title=Invalid profile test mode::${PROFILE_TEST_MODE}"
            exit 1
          fi
          sh RunTests.sh
          cd HDR
          sh mkprofiles.sh
          cd ..
          cd hybrid
          sh BuildAndTest.sh
          cd ..
          cd CalcTest
          sh checkInvalidProfiles.sh
          cd ..
          cd mcs
          sh updateprev.sh
          sh updateprevWithBkgd.sh
          cd ..
          find . -iname "*.icc" | wc -l
          echo "Build complete."

      - name: Generate PR Unix Summary Report
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          BASH_ENV: /dev/null
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
          ENABLE_LTO: ${{ inputs.enable-lto && 'ON' || 'OFF' }}
          PROFILE_TEST_MODE: ${{ inputs.profile-test-mode || 'full' }}
          WARNING_POLICY: ${{ inputs.warning-policy || 'warn' }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          if [ ! -r .trusted-workflow/.github/scripts/sanitize-sed.sh ]; then
            echo "ERROR: trusted sanitizer helper not found or not readable" >&2
            exit 1
          fi
          source .trusted-workflow/.github/scripts/sanitize-sed.sh
          SANITIZED_OS=$(sanitize_line "${MATRIX_OS}")
          SANITIZED_COMPILER=$(sanitize_line "${MATRIX_COMPILER}")
          SANITIZED_BUILD_TYPE=$(sanitize_line "${MATRIX_BUILD_TYPE}")
          SANITIZED_LTO=$(sanitize_line "${ENABLE_LTO}")
          SANITIZED_PROFILE_TEST_MODE=$(sanitize_line "${PROFILE_TEST_MODE}")
          SANITIZED_WARNING_POLICY=$(sanitize_line "${WARNING_POLICY}")
          {
            echo "## ci-pr-unix Build Summary"
            echo "- **OS:**         $SANITIZED_OS"
            echo "- **Compiler:**   $SANITIZED_COMPILER"
            echo "- **Build Type:** $SANITIZED_BUILD_TYPE"
            echo "- **LTO:**        $SANITIZED_LTO"
            echo "- **Profile Tests:** $SANITIZED_PROFILE_TEST_MODE"
            echo "- **Warning Policy:** $SANITIZED_WARNING_POLICY"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
