name: "CI Build Test (No Fuzzers)"

permissions:
  contents: read
  pull-requests: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      ctest-mode:
        description: "CTest mode: fast, full, or skip"
        required: false
        default: "fast"
        type: choice
        options: [fast, full, skip]
      ctest-recent-limit:
        description: "Run only the last N selected CTests; 0 runs all"
        required: false
        default: "0"
        type: choice
        options: ["0", "1", "2", "3", "4", "5", "10"]
      tool-build-type:
        description: "Build type for the reusable CTest tool suite"
        required: false
        default: "Debug"
        type: choice
        options: [Debug, Release]
      run-hybrid-timing:
        description: "Run optional iccApplyProfiles hybrid timing"
        required: false
        default: false
        type: boolean

jobs:
  build-matrix:
    uses: ./.github/workflows/_build-matrix.yml
    with:
      report-title: "Build and Test Results (No Fuzzers)"
      include-windows: false
      ctest-mode: ${{ inputs['ctest-mode'] }}
      ctest-recent-limit: ${{ inputs['ctest-recent-limit'] }}
      tool-build-type: ${{ inputs['tool-build-type'] }}
      run-hybrid-timing: ${{ inputs['run-hybrid-timing'] }}
