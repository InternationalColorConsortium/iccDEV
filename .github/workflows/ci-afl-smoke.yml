---
###############################################################
#
# Copyright (c) 2026 International Color Consortium.
#                 All rights reserved.
#                 https://color.org
#
# Intent: Manual AFL++ smoke fuzzing for iccDEV command-line tools.
#
###############################################################

name: "ci-afl-smoke"

# Some commands and image references intentionally exceed the default
# yamllint line length. Keep the disable local to this workflow.
# yamllint disable rule:line-length

permissions:
  contents: read
  packages: read

'on':
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or ref to check out before optional target_sha'
        required: true
        default: master
        type: string
      target_sha:
        description: 'Optional full 40-character commit SHA to check out'
        required: false
        default: ''
        type: string
      afl_targets:
        description: 'Comma-separated AFL targets: dump,toxml,fromxml,tojson,fromjson,roundtrip,fromcube'
        required: true
        default: dump,toxml,fromxml,tojson,fromjson,roundtrip,fromcube
        type: string
      duration_seconds:
        description: 'AFL runtime per target in seconds, 1-3600'
        required: true
        default: '300'
        type: string
      exec_timeout_ms:
        description: 'AFL per-exec timeout in milliseconds, 20-30000'
        required: true
        default: '30000'
        type: string
      cmake_build_type:
        description: 'CMake build type for AFL instrumentation'
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
          - MinSizeRel
      patch_mode:
        description: 'Patch stack mode; all requires patches in the target checkout'
        required: true
        default: none
        type: choice
        options:
          - all
          - none
      regression_image_tag:
        description: 'Trusted unified image tag'
        required: false
        default: latest
        type: string
  workflow_call:
    inputs:
      target_ref:
        description: 'Branch, tag, or ref to check out before optional target_sha'
        required: false
        default: ''
        type: string
      target_sha:
        description: 'Optional full 40-character commit SHA to check out'
        required: false
        default: ''
        type: string
      afl_targets:
        description: 'Comma-separated AFL targets'
        required: false
        default: dump,toxml,fromxml,tojson,fromjson,roundtrip,fromcube
        type: string
      duration_seconds:
        description: 'AFL runtime per target in seconds, 1-3600'
        required: false
        default: '300'
        type: string
      exec_timeout_ms:
        description: 'AFL per-exec timeout in milliseconds, 20-30000'
        required: false
        default: '30000'
        type: string
      cmake_build_type:
        description: 'CMake build type for AFL instrumentation'
        required: false
        default: Debug
        type: string
      patch_mode:
        description: 'Patch stack mode; all requires patches in the target checkout'
        required: false
        default: none
        type: string
      regression_image_tag:
        description: 'Trusted unified image tag'
        required: false
        default: latest
        type: string

concurrency:
  group: "afl-smoke-${{ github.workflow }}-${{ inputs.target_ref || github.ref }}-${{ inputs.target_sha || 'ref' }}-${{ inputs.afl_targets || 'dump' }}"
  cancel-in-progress: false

jobs:
  afl-smoke:
    name: "AFL++ smoke (${{ inputs.afl_targets || 'dump' }}, ${{ inputs.duration_seconds || '300' }}s)"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/internationalcolorconsortium/iccdev:${{ inputs.regression_image_tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      ICCDEV_AFL_TARGETS_INPUT: ${{ inputs.afl_targets || 'dump,toxml,fromxml,tojson,fromjson,roundtrip,fromcube' }}
      ICCDEV_AFL_SECONDS_INPUT: ${{ inputs.duration_seconds || '300' }}
      ICCDEV_AFL_EXEC_TIMEOUT_MS_INPUT: ${{ inputs.exec_timeout_ms || '30000' }}
      ICCDEV_AFL_BUILD_TYPE_INPUT: ${{ inputs.cmake_build_type || 'Debug' }}
      ICCDEV_AFL_PATCH_MODE_INPUT: ${{ inputs.patch_mode || 'all' }}
      TARGET_REF_INPUT: ${{ inputs.target_ref || github.ref }}
      TARGET_SHA_INPUT: ${{ inputs.target_sha || '' }}
      TRUSTED_SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts
      AFLPLUSPLUS_REPO: https://github.com/AFLplusplus/AFLplusplus.git
      AFLPLUSPLUS_REF: dev

    steps:
      - name: Checkout trusted sanitizer helpers
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          path: trusted
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout workflow patch applicator
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-scripts
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout iccDEV
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact target SHA
        if: ${{ inputs.target_sha != '' }}
        working-directory: target
        env:
          BASH_ENV: /dev/null
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          case "$TARGET_SHA" in
            *[!0-9a-fA-F]*)
              echo "ERROR: invalid target SHA: $(sanitize_line "$TARGET_SHA")" >&2
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "ERROR: invalid target SHA length: $(sanitize_line "$TARGET_SHA")" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"

      - name: Install workflow patch applicator
        working-directory: target
        env:
          BASH_ENV: /dev/null
          PATCH_APPLICATOR: ${{ github.workspace }}/workflow-scripts/.github/scripts/iccdev-apply-fuzz-patches.sh
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          install -m 0755 "$PATCH_APPLICATOR" .github/scripts/iccdev-apply-fuzz-patches.sh
          echo "Using workflow patch applicator: $(sanitize_line "$PATCH_APPLICATOR")"

      - name: Harden Bash environment
        working-directory: target
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          git config --global --add safe.directory "$PWD"
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          echo "AFL targets: $(sanitize_line "$ICCDEV_AFL_TARGETS_INPUT")"
          echo "AFL seconds: $(sanitize_line "$ICCDEV_AFL_SECONDS_INPUT")"
          echo "AFL exec timeout ms: $(sanitize_line "$ICCDEV_AFL_EXEC_TIMEOUT_MS_INPUT")"
          echo "AFL CMake build type: $(sanitize_line "$ICCDEV_AFL_BUILD_TYPE_INPUT")"
          echo "AFL target ref: $(sanitize_line "$TARGET_REF_INPUT")"
          echo "AFL target sha override: $(sanitize_line "${TARGET_SHA_INPUT:-none}")"
          case "$ICCDEV_AFL_PATCH_MODE_INPUT" in
            all|none)
              ;;
            *)
              echo "ERROR: AFL patch mode must be all or none: $(sanitize_line "$ICCDEV_AFL_PATCH_MODE_INPUT")" >&2
              exit 2
              ;;
          esac
          echo "AFL patch mode: $(sanitize_line "$ICCDEV_AFL_PATCH_MODE_INPUT")"
          git rev-parse --verify HEAD
          git status --short

      # preflight: allow-package-install reason=aflplusplus-dev-toolchain-bootstrap
      - name: Build AFL++ dev toolchain
        working-directory: target
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"

          disabled_dir="${RUNNER_TEMP:-/tmp}/iccdev-disabled-apt-sources"
          mkdir -p "$disabled_dir"
          for source_file in /etc/apt/sources.list.d/*; do
            [ -e "$source_file" ] || continue
            if grep -qs 'packages\.microsoft\.com' "$source_file"; then
              safe_name="$(basename "$source_file")"
              mv "$source_file" "$disabled_dir/$safe_name.disabled"
            fi
          done
          apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 update -qq
          apt-get install -y -qq --no-install-recommends \
            automake \
            bison \
            flex \
            libglib2.0-dev \
            libpixman-1-dev \
            llvm-22-dev \
            python3-dev \
            python3-setuptools \
            zlib1g-dev

          aflplusplus_src="$RUNNER_TEMP/AFLplusplus"
          git clone --depth 1 --branch "$AFLPLUSPLUS_REF" "$AFLPLUSPLUS_REPO" "$aflplusplus_src"
          python3 - "$aflplusplus_src/src/afl-fuzz-init.c" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^([ \t]*)SAYF\("\\n" cLRD "\[-\] " cRST\n'
              r'([ \t]*)"Your system is configured to send core dump '
              r'notifications to an\\n"'
          )
          if len(pattern.findall(text)) != 1:
              raise SystemExit("AFL++ Linux core_pattern warning block not found")

          def guard_warning(match):
              return (
                  f'{match.group(1)}if (!getenv("AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES")) '
                  f'SAYF("\\n" cLRD "[-] " cRST\n'
                  f'{match.group(2)}"Your system is configured to send core dump '
                  f'notifications to an\\n"'
              )

          path.write_text(pattern.sub(guard_warning, text, count=1))
          PY
          echo "AFL++ core_pattern warning is muted when AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1"
          make -C "$aflplusplus_src" -j"$(nproc)" CC=clang-22 CXX=clang++-22 afl-fuzz afl-showmap
          make -C "$aflplusplus_src" -j"$(nproc)" CC=clang-22 CXX=clang++-22 LLVM_CONFIG=llvm-config-22 -f GNUmakefile.llvm \
            ./afl-cc \
            ./afl-compiler-rt.o \
            ./SanitizerCoveragePCGUARD.so \
            ./cmplog-routines-pass.so
          for afl_tool in afl-fuzz afl-clang-fast afl-clang-fast++; do
            if [ ! -x "$aflplusplus_src/$afl_tool" ]; then
              echo "ERROR: AFL++ dev build did not produce $afl_tool" >&2
              exit 1
            fi
          done
          probe_dir="$(mktemp -d)"
          printf 'int main(void) { return 0; }\n' > "$probe_dir/test.c"
          printf 'int main(void) { return 0; }\n' > "$probe_dir/test.cpp"
          AFL_PATH="$aflplusplus_src" AFL_CC=clang-22 AFL_CXX=clang++-22 \
            "$aflplusplus_src/afl-clang-fast" -c "$probe_dir/test.c" -o "$probe_dir/test.o"
          AFL_PATH="$aflplusplus_src" AFL_CC=clang-22 AFL_CXX=clang++-22 \
            "$aflplusplus_src/afl-clang-fast++" -c "$probe_dir/test.cpp" -o "$probe_dir/testxx.o"
          {
            echo "PATH=$aflplusplus_src:$PATH"
            echo "AFL_PATH=$aflplusplus_src"
            echo "AFL_CC=clang-22"
            echo "AFL_CXX=clang++-22"
            echo "AFLPLUSPLUS_SRC=$aflplusplus_src"
          } >> "$GITHUB_ENV"
          "$aflplusplus_src/afl-fuzz" -V 1 >/dev/null 2>&1 || true
          echo "AFL++ source: $(sanitize_line "$AFLPLUSPLUS_REPO")"
          echo "AFL++ ref: $(sanitize_line "$AFLPLUSPLUS_REF")"

      - name: Run AFL smoke
        working-directory: target
        env:
          BASH_ENV: /dev/null
          ICCDEV_AFL_TARGETS: ${{ inputs.afl_targets || 'dump,toxml,fromxml,tojson,fromjson,roundtrip,fromcube' }}
          ICCDEV_AFL_SECONDS: ${{ inputs.duration_seconds || '300' }}
          ICCDEV_AFL_EXEC_TIMEOUT_MS: ${{ inputs.exec_timeout_ms || '30000' }}
          ICCDEV_AFL_BUILD_TYPE: ${{ inputs.cmake_build_type || 'Debug' }}
          ICCDEV_AFL_APPLY_PATCHES: ${{ (inputs.patch_mode || 'all') == 'all' && '1' || '0' }}
          ICCDEV_FUZZ_PATCH_APPLICATOR: .github/scripts/iccdev-apply-fuzz-patches.sh
          ICCDEV_AFL_BUILD_DIR: ${{ runner.temp }}/iccdev-build-afl-smoke
          ICCDEV_AFL_WORK_DIR: ${{ runner.temp }}/iccdev-afl-smoke
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          .github/scripts/iccdev-afl-smoke.sh \
            --seconds "$ICCDEV_AFL_SECONDS" \
            --targets "$ICCDEV_AFL_TARGETS" \
            --build-type "$ICCDEV_AFL_BUILD_TYPE" \
            --exec-timeout-ms "$ICCDEV_AFL_EXEC_TIMEOUT_MS" \
            --build-dir "$ICCDEV_AFL_BUILD_DIR" \
            --work-dir "$ICCDEV_AFL_WORK_DIR"

      - name: Upload AFL findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: afl-smoke-findings-${{ github.run_id }}
          path: ${{ runner.temp }}/iccdev-afl-smoke/findings
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload AFL smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: afl-smoke-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/iccdev-afl-smoke/summary.tsv
            ${{ runner.temp }}/iccdev-afl-smoke/findings.tsv
            ${{ runner.temp }}/iccdev-afl-smoke/seed-inventory.tsv
            ${{ runner.temp }}/iccdev-afl-smoke/skipped-seeds.tsv
            ${{ runner.temp }}/iccdev-afl-smoke/log-*.txt
            ${{ runner.temp }}/iccdev-afl-smoke/triage
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize AFL smoke
        if: always()
        working-directory: target
        env:
          BASH_ENV: /dev/null
          AFL_WORK_DIR: ${{ runner.temp }}/iccdev-afl-smoke
          AFL_FINDINGS_ARTIFACT: afl-smoke-findings-${{ github.run_id }}
          AFL_LOGS_ARTIFACT: afl-smoke-logs-${{ github.run_id }}
          AFL_TARGET_REF: ${{ inputs.target_ref || github.ref }}
          AFL_TARGET_SHA: ${{ inputs.target_sha || '' }}
          AFL_PATCH_MODE: ${{ inputs.patch_mode || 'all' }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source "$TRUSTED_SCRIPTS/sanitize-sed.sh"
          summary="$AFL_WORK_DIR/summary.tsv"
          findings="$AFL_WORK_DIR/findings.tsv"
          skipped_seeds="$AFL_WORK_DIR/skipped-seeds.tsv"
          triage="$AFL_WORK_DIR/triage/triage-summary.tsv"
          triage_report="$AFL_WORK_DIR/triage/triage-report.md"
          one_liners="$AFL_WORK_DIR/triage/reproducer-one-liners.txt"
          {
            echo "## AFL++ Smoke Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Target ref | \`$(sanitize_line "$AFL_TARGET_REF")\` |"
            echo "| Target SHA override | \`$(sanitize_line "${AFL_TARGET_SHA:-none}")\` |"
            echo "| Patch mode | \`$(sanitize_line "$AFL_PATCH_MODE")\` |"
            echo "| Logs artifact | \`$(sanitize_line "$AFL_LOGS_ARTIFACT")\` |"
            echo ""
            echo "| Target | Status | Seconds | Execs | Crashes | Hangs |"
            echo "|--------|--------|---------|-------|---------|-------|"
            if [ -r "$summary" ]; then
              tail -n +2 "$summary" | while IFS="$(printf '\t')" read -r target status runtime execs crashes hangs out_dir; do
                echo "| $(sanitize_line "$target") | $(sanitize_line "$status") | $(sanitize_line "$runtime") | $(sanitize_line "$execs") | $(sanitize_line "$crashes") | $(sanitize_line "$hangs") |"
                printf 'Output directory: %s\n' "$(sanitize_line "$out_dir")" >/dev/null
              done
            else
              echo "| unavailable | fail | 0 | 0 | 0 | 0 |"
            fi
            echo ""
            echo "### Seed Size Review"
            echo ""
            if [ -r "$skipped_seeds" ] && [ "$(tail -n +2 "$skipped_seeds" | wc -l)" -gt 0 ]; then
              echo "| Kind | Size | Seed | Reason |"
              echo "|------|------|------|--------|"
              tail -n +2 "$skipped_seeds" | while IFS="$(printf '\t')" read -r kind size seed reason; do
                echo "| $(sanitize_line "$kind") | $(sanitize_line "$size") | $(sanitize_line "$(basename "$seed")") | $(sanitize_line "$reason") |"
              done
            else
              echo "No oversized AFL smoke seeds were skipped."
            fi
            echo ""
            echo "### AFL Findings"
            echo ""
            if [ -r "$findings" ] && [ "$(tail -n +2 "$findings" | wc -l)" -gt 0 ]; then
              echo "Artifact: \`$(sanitize_line "$AFL_FINDINGS_ARTIFACT")\`"
              echo ""
              echo "| Target | Kind | File |"
              echo "|--------|------|------|"
              tail -n +2 "$findings" | while IFS="$(printf '\t')" read -r target kind source_file artifact_file; do
                printf 'Source file: %s\n' "$(sanitize_line "$source_file")" >/dev/null
                echo "| $(sanitize_line "$target") | $(sanitize_line "$kind") | $(sanitize_line "$artifact_file") |"
              done
            else
              echo "No crash or hang artifacts were saved."
            fi
            echo ""
            echo "### Triage Replay"
            echo ""
            if [ -r "$triage" ]; then
              echo "| Target | Kind | Classification | Exit | Reproducer |"
              echo "|--------|------|----------------|------|------------|"
              tail -n +2 "$triage" | while IFS="$(printf '\t')" read -r target kind classification exit_code input log_file repro_file; do
                printf 'Input: %s\nLog: %s\n' "$(sanitize_line "$input")" "$(sanitize_line "$log_file")" >/dev/null
                echo "| $(sanitize_line "$target") | $(sanitize_line "$kind") | $(sanitize_line "$classification") | $(sanitize_line "$exit_code") | $(sanitize_line "$repro_file") |"
              done
              echo ""
              echo "The uploaded artifact includes \`triage/reproducer-one-liners.txt\`, \`triage/reproducer-one-liners.md\`, per-finding \`.cmd\` files, and replay logs."
              if [ -r "$one_liners" ]; then
                echo ""
                echo "#### Copy-paste Reproducers"
                echo ""
                echo '```bash'
                while IFS= read -r line; do
                  sanitize_code_line "$line"
                  echo ""
                done < "$one_liners"
                echo '```'
              fi
            elif [ -r "$triage_report" ]; then
              sanitize_print "$(cat "$triage_report")"
            else
              echo "No triage replay was needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
