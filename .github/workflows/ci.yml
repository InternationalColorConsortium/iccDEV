name: vcpkg platform packages

# yamllint disable rule:line-length

on:
  workflow_dispatch:
    inputs:
      include-experimental-unix:
        description: 'Also build Linux and macOS vcpkg bundles (diagnostic only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "vcpkg-platform-packages-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-unix:
    if: ${{ inputs['include-experimental-unix'] }}
    name: "${{ matrix.platform }} vcpkg packages"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            triplet: x64-linux
          - platform: macos-arm64
            os: macos-14
            triplet: arm64-osx
    env:
      BASH_ENV: /dev/null
      VCPKG_BASELINE: eae1680538b86f962455c27abca2aad0dc304a4d
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      PLATFORM_ID: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap pinned vcpkg
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_DIR=$RUNNER_TEMP/vcpkg-installed" >> "$GITHUB_ENV"

      - name: Build complete vcpkg dependency tree
        env:
          VCPKG_ICCDEV_SOURCE: ${{ github.workspace }}
          VCPKG_KEEP_ENV_VARS: VCPKG_ICCDEV_SOURCE
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [ "$RUNNER_OS" = "Linux" ]; then
            export VCPKG_FORCE_SYSTEM_BINARIES=1
          fi
          # preflight: allow-package-install reason=build-pinned-vcpkg-dependency-bundle
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --triplet "$VCPKG_TRIPLET" \
            --x-install-root="$VCPKG_INSTALLED_DIR"
          # preflight: allow-package-install reason=build-pinned-vcpkg-dependency-bundle
          "$VCPKG_ROOT/vcpkg" install "iccdev[tools,xml,json]" \
            --overlay-ports="$GITHUB_WORKSPACE/ports" \
            --triplet "$VCPKG_TRIPLET" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --clean-after-build \
            --classic
          test -d "$VCPKG_INSTALLED_DIR/$VCPKG_TRIPLET/include"
          test -d "$VCPKG_INSTALLED_DIR/$VCPKG_TRIPLET/lib"

      - name: Build and package all CMake configurations
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          bundle_dir="$RUNNER_TEMP/iccdev-vcpkg-package-$PLATFORM_ID"
          mkdir -p "$bundle_dir/packages"
          for build_type in Debug Release RelWithDebInfo MinSizeRel; do
            build_dir="$RUNNER_TEMP/build-$PLATFORM_ID-$build_type"
            package_dir="$bundle_dir/packages/$build_type"
            cmake -S "$GITHUB_WORKSPACE/Build/Cmake" -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE="$build_type" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_MODE=OFF \
              -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
              -DENABLE_WXWIDGETS=OFF \
              -DENABLE_CPACK_PACKAGING=ON
            cmake --build "$build_dir" --parallel "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"
            (
              cd "$build_dir"
              cpack --config CPackConfig.cmake --verbose
            )
            mkdir -p "$package_dir"
            find "$build_dir" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} "$package_dir/" \;
            test -n "$(find "$package_dir" -maxdepth 1 -type f -print -quit)"
          done
          mkdir -p "$bundle_dir/vcpkg/installed"
          cp -a "$VCPKG_ROOT/scripts" "$bundle_dir/vcpkg/scripts"
          cp -a "$VCPKG_INSTALLED_DIR/$VCPKG_TRIPLET" \
            "$bundle_dir/vcpkg/installed/$VCPKG_TRIPLET"
          {
            echo "iccDEV vcpkg package bundle"
            echo "platform=$PLATFORM_ID"
            echo "triplet=$VCPKG_TRIPLET"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_types=Debug Release RelWithDebInfo MinSizeRel"
          } > "$bundle_dir/MANIFEST.txt"

      - name: Report package bundle
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          {
            echo "## vcpkg platform package bundle"
            echo ""
            echo "- Platform: $(sanitize_line "$PLATFORM_ID")"
            echo "- Triplet: $(sanitize_line "$VCPKG_TRIPLET")"
            echo "- Build types: Debug, Release, RelWithDebInfo, MinSizeRel"
            echo "- Status: [OK] complete vcpkg dependency tree and CPack packages bundled"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: Upload platform package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-vcpkg-package-${{ matrix.platform }}
          path: ${{ runner.temp }}/iccdev-vcpkg-package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: "windows-x64 vcpkg packages"
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
      POWERSHELL_UPDATECHECK: Off
      VCPKG_BASELINE: eae1680538b86f962455c27abca2aad0dc304a4d
      VCPKG_TRIPLET: x64-windows
      PLATFORM_ID: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap pinned vcpkg
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . .github\scripts\sanitize.ps1

          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout "$env:VCPKG_BASELINE"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED_DIR=$env:RUNNER_TEMP\vcpkg-installed"

      - name: Build complete vcpkg dependency tree
        env:
          VCPKG_ICCDEV_SOURCE: ${{ github.workspace }}
          VCPKG_KEEP_ENV_VARS: VCPKG_ICCDEV_SOURCE
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . .github\scripts\sanitize.ps1

          # preflight: allow-package-install reason=build-pinned-vcpkg-dependency-bundle
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --triplet "$env:VCPKG_TRIPLET" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg manifest install failed with exit code $LASTEXITCODE"
          }
          # preflight: allow-package-install reason=build-pinned-vcpkg-dependency-bundle
          & "$env:VCPKG_ROOT\vcpkg.exe" install 'iccdev[tools,xml,json]' `
            --overlay-ports="$env:GITHUB_WORKSPACE\ports" `
            --triplet "$env:VCPKG_TRIPLET" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --clean-after-build `
            --classic
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_TRIPLET\include")) {
            throw 'vcpkg include tree was not generated'
          }
          if (-not (Test-Path "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_TRIPLET\lib")) {
            throw 'vcpkg library tree was not generated'
          }

      - name: Build and package all CMake configurations
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . .github\scripts\sanitize.ps1

          $bundleDir = "$env:RUNNER_TEMP\iccdev-vcpkg-package-$env:PLATFORM_ID"
          $packageRoot = Join-Path $bundleDir 'packages'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          foreach ($buildType in @('Debug', 'Release', 'RelWithDebInfo', 'MinSizeRel')) {
            $buildDir = "$env:RUNNER_TEMP\build-$env:PLATFORM_ID-$buildType"
            $packageDir = Join-Path $packageRoot $buildType
            cmake --preset vs2022-x64 -B $buildDir -S Build\Cmake `
              -DVCPKG_MANIFEST_MODE=OFF `
              -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
              -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
              -DENABLE_WXWIDGETS=OFF `
              -DENABLE_CPACK_PACKAGING=ON
            if ($LASTEXITCODE -ne 0) {
              throw "CMake configure failed for $buildType"
            }
            cmake --build $buildDir --config $buildType --parallel
            if ($LASTEXITCODE -ne 0) {
              throw "CMake build failed for $buildType"
            }
            Push-Location $buildDir
            try {
              cpack --config CPackConfig.cmake -C $buildType --verbose
              if ($LASTEXITCODE -ne 0) {
                throw "CPack failed for $buildType"
              }
            } finally {
              Pop-Location
            }
            New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
            $packages = Get-ChildItem -Path $buildDir -File |
              Where-Object { $_.Extension -in @('.zip', '.msi', '.exe') }
            if (-not $packages) {
              throw "CPack did not produce a package for $buildType"
            }
            $packages | Copy-Item -Destination $packageDir -Force
          }
          $vcpkgBundleDir = Join-Path $bundleDir 'vcpkg'
          New-Item -ItemType Directory -Force -Path (Join-Path $vcpkgBundleDir 'installed') | Out-Null
          Copy-Item -Path "$env:VCPKG_ROOT\scripts" `
            -Destination (Join-Path $vcpkgBundleDir 'scripts') -Recurse -Force
          Copy-Item -Path "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_TRIPLET" `
            -Destination (Join-Path $vcpkgBundleDir "installed\$env:VCPKG_TRIPLET") -Recurse -Force
          @(
            'iccDEV vcpkg package bundle',
            "platform=$env:PLATFORM_ID",
            "triplet=$env:VCPKG_TRIPLET",
            "commit=$(git rev-parse HEAD)",
            'build_types=Debug Release RelWithDebInfo MinSizeRel'
          ) | Set-Content -Path (Join-Path $bundleDir 'MANIFEST.txt') -Encoding ascii

      - name: Report package bundle
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . .github\scripts\sanitize.ps1

          @(
            '## vcpkg platform package bundle',
            '',
            "- Platform: $(Sanitize-Line $env:PLATFORM_ID)",
            "- Triplet: $(Sanitize-Line $env:VCPKG_TRIPLET)",
            '- Build types: Debug, Release, RelWithDebInfo, MinSizeRel',
            '- Status: [OK] complete vcpkg dependency tree and CPack packages bundled'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload platform package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-vcpkg-package-windows-x64
          path: ${{ runner.temp }}/iccdev-vcpkg-package-windows-x64
          if-no-files-found: error
          retention-days: 14

  package-summary:
    name: "Report vcpkg package success"
    needs: [package-unix, package-windows]
    if: >-
      ${{ always() && needs.package-windows.result == 'success' &&
      (needs.package-unix.result == 'success' || needs.package-unix.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: Check out sanitizer helper
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report successful platform bundles
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          {
            echo "## vcpkg platform packages complete"
            echo ""
            echo "- Platforms: $(sanitize_line "windows-x64; Linux and macOS are optional diagnostics")"
            echo "- Build types: $(sanitize_line "Debug, Release, RelWithDebInfo, MinSizeRel")"
            echo "- Artifacts: $(sanitize_line "iccdev-vcpkg-package-<platform>")"
            echo "- Status: [OK] requested dependency and CPack bundles uploaded"
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized
