#                 https://color.org
#
# Intent: Reusable iccDEV ASAN+UBSAN tool regression gate.
#         Builds the CMake/CTest test surface and runs the
#         script-backed suites through standard CTest entry points.
#
###############################################################

name: ci-regression-checks

# Existing pinned image digests, CMake commands, and reproduction strings
# intentionally exceed the default yamllint line length. Keep the disable local
# to this workflow.
# yamllint disable rule:line-length

permissions:
  contents: read
  packages: read

on:
  workflow_call:
    inputs:
      run_hybrid_timing:
        description: 'Run the hybrid iccApplyProfiles timing matrix'
        required: false
        default: false
        type: boolean
      hybrid_timing_threads:
        description: 'Comma-separated iccApplyProfiles thread variants'
        required: false
        default: 'baseline,2,4,8'
        type: string
      hybrid_timing_timeout:
        description: 'Timeout in seconds for each timing variant'
        required: false
        default: '60'
        type: string
      hybrid_timing_cases:
        description: 'Comma-separated hybrid timing cases'
        required: false
        default: 'cmykw,kw-mcs'
        type: string
      hybrid_timing_band_rows:
        description: 'Optional row band height for hybrid timing'
        required: false
        default: ''
        type: string
      hybrid_timing_instrument:
        description: 'Emit iccApplyProfiles and CMM timing instrumentation'
        required: false
        default: false
        type: boolean
      tool_build_type:
        description: 'Build type for the reusable CTest tool suite'
        required: false
        default: Debug
        type: string
      regression_image_tag:
        description: 'Trusted regression container tag'
        required: false
        default: master
        type: string
  workflow_dispatch:
    inputs:
      regression_image_tag:
        description: 'Trusted regression container tag'
        required: false
        default: master
        type: choice
        options:
          - master
          - ci-docker-canary
      run_hybrid_timing:
        description: 'Run the hybrid iccApplyProfiles timing matrix'
        required: false
        default: true
        type: boolean
      hybrid_timing_threads:
        description: 'Comma-separated iccApplyProfiles thread variants'
        required: false
        default: 'baseline,2,4,8'
        type: string
      hybrid_timing_timeout:
        description: 'Timeout in seconds for each timing variant'
        required: false
        default: '60'
        type: string
      hybrid_timing_cases:
        description: 'Comma-separated hybrid timing cases'
        required: false
        default: 'cmykw,kw-mcs'
        type: string
      hybrid_timing_band_rows:
        description: 'Optional row band height for hybrid timing'
        required: false
        default: ''
        type: string
      hybrid_timing_instrument:
        description: 'Emit iccApplyProfiles and CMM timing instrumentation'
        required: false
        default: false
        type: boolean
      tool_build_type:
        description: 'Build type for the CTest tool suite'
        required: true
        default: Debug
        type: choice
        options:
          - Release
          - Debug
      thread_linkage_build_type:
        description: 'Build type for the manual RefIccMAX thread linkage check'
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
      thread_linkage_ipo:
        description: 'Enable CMAKE_INTERPROCEDURAL_OPTIMIZATION for the manual check'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tool_build_type || 'Debug' }}
  cancel-in-progress: true

jobs:
  tool-tests:
    name: "iccDEV Tools - GCC Strict ASAN+UBSAN (${{ inputs.tool_build_type || 'Debug' }})"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/internationalcolorconsortium/iccdev-ci-regression:${{ inputs.regression_image_tag || 'master' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    env:
      BASH_ENV: /dev/null
      REGRESSION_IMAGE_TAG: ${{ inputs.regression_image_tag || 'master' }}
      TOOL_BUILD_TYPE: ${{ inputs.tool_build_type || 'Debug' }}
      BUILD_DIR: build
      SPECTRAL_PREVIEW_VENV: /tmp/iccdev-spectral-preview-venv

    steps:
      - name: Checkout iccDEV
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Harden Bash environment
        env:
          BASH_ENV: /dev/null
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          echo "Ref:    ${WORKFLOW_REF}"
          echo "Commit: ${WORKFLOW_SHA}"

      - name: Verify regression container dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          gcc --version | sed -n '1p'
          g++ --version | sed -n '1p'
          if command -v clang >/dev/null 2>&1; then
            clang --version | sed -n '1p'
          else
            echo "[WARN] clang not present in pinned regression image; using GCC strict canary"
          fi
          cmake --version | sed -n '1p'
          /usr/bin/time --version | sed -n '1p'

      # preflight: allow-package-install reason=spectral-preview-codec-bootstrap
      - name: Install spectral preview Python dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          python3 -m venv "$SPECTRAL_PREVIEW_VENV"
          "$SPECTRAL_PREVIEW_VENV/bin/python" -m pip install --upgrade pip --quiet
          "$SPECTRAL_PREVIEW_VENV/bin/python" -m pip install \
            --only-binary=:all: \
            'numpy==2.4.2' \
            'tifffile==2026.2.24' \
            'pillow==12.1.1' \
            'imagecodecs==2026.6.6' \
            --quiet
          "$SPECTRAL_PREVIEW_VENV/bin/python" - <<'PY'
          import imagecodecs
          import numpy
          import PIL
          import tifffile

          print(f"imagecodecs {imagecodecs.__version__}")
          print(f"numpy {numpy.__version__}")
          print(f"pillow {PIL.__version__}")
          print(f"tifffile {tifffile.__version__}")
          PY

      - name: Configure iccDEV CTest build
        env:
          BASH_ENV: /dev/null
          CC: gcc
          CXX: g++
          WARN_FLAGS: -Wall -Wextra -Wpedantic -Werror
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          case "$TOOL_BUILD_TYPE" in
            Release|Debug)
              ;;
            *)
              echo "::error title=Invalid build type::${TOOL_BUILD_TYPE}"
              exit 1
              ;;
          esac

          c_flags="${WARN_FLAGS}"
          cxx_flags="${WARN_FLAGS} -std=c++17"
          if [ "$TOOL_BUILD_TYPE" = "Debug" ]; then
            c_flags="${c_flags} -fno-omit-frame-pointer -g -O0"
            cxx_flags="${cxx_flags} -fno-omit-frame-pointer -g -O0"
          fi

          cmake -S Build/Cmake -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE="${TOOL_BUILD_TYPE}" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="${c_flags}" \
            -DCMAKE_CXX_FLAGS="${cxx_flags}" \
            -DENABLE_SANITIZERS=ON \
            -DSANITIZER_RECOVER=ON \
            -DENABLE_TOOLS=ON \
            -DENABLE_TESTS=ON \
            -DENABLE_WXWIDGETS=OFF \
            -DENABLE_SHARED_LIBS=ON \
            -DENABLE_STATIC_LIBS=ON \
            -DICC_USE_ZLIB=ON \
            -Wno-dev

      - name: Build iccDEV tools
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cmake --build "${BUILD_DIR}" --parallel "$(nproc)" 2>&1 | tee "${BUILD_DIR}/build.log"
          WARNING_COUNT=$(grep -cE 'warning:' "${BUILD_DIR}/build.log" || true)
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::warning title=Compiler Warnings::${WARNING_COUNT} warning(s) detected"
            grep -E 'warning:' "${BUILD_DIR}/build.log" | sort -u | sed -n '1,20p'
          else
            echo "[OK] Zero compiler warnings"
          fi

      - name: List CTest suites
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          CTEST_LIST="${BUILD_DIR}/ctest-list.txt"
          ctest --test-dir "${BUILD_DIR}" -N --no-tests=error | tee "${CTEST_LIST}"

      - name: Build CTest helper binaries
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cmake --build "${BUILD_DIR}" --target build-test-binaries --parallel "$(nproc)"

      - name: Run CTest tool suites
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: "halt_on_error=0,detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=0,print_stacktrace=1"
          LLVM_PROFILE_FILE: "/dev/null"
          ICCDEV_SPECTRAL_PREVIEW_PYTHON: /tmp/iccdev-spectral-preview-venv/bin/python
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          ctest --test-dir "${BUILD_DIR}" \
            --output-on-failure \
            --label-exclude "slow" \
            --no-tests=error \
            --output-junit "${BUILD_DIR}/ctest-results.xml"

      - name: Run hybrid iccApplyProfiles timing matrix
        if: ${{ inputs.run_hybrid_timing }}
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: "halt_on_error=0,detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=0,print_stacktrace=1"
          LLVM_PROFILE_FILE: "/dev/null"
          HYBRID_TIMING_THREADS_INPUT: ${{ inputs.hybrid_timing_threads || 'baseline,2,4,8' }}
          HYBRID_TIMING_TIMEOUT_INPUT: ${{ inputs.hybrid_timing_timeout || '60' }}
          HYBRID_TIMING_CASES_INPUT: ${{ inputs.hybrid_timing_cases || 'cmykw,kw-mcs' }}
          HYBRID_TIMING_BAND_ROWS_INPUT: ${{ inputs.hybrid_timing_band_rows || '' }}
          HYBRID_TIMING_INSTRUMENT_INPUT: ${{ inputs.hybrid_timing_instrument && '1' || '0' }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          ICCDEV_TOOLS_DIR="$GITHUB_WORKSPACE/${BUILD_DIR}/Tools" \
          ICCDEV_TESTING_DIR="$GITHUB_WORKSPACE/Testing" \
          ICCDEV_TEST_OUTDIR="$GITHUB_WORKSPACE/${BUILD_DIR}/Testing/ctest-output/hybrid-applyprofiles-timing" \
          HYBRID_TIMING_THREADS="$HYBRID_TIMING_THREADS_INPUT" \
          HYBRID_TIMING_TIMEOUT="$HYBRID_TIMING_TIMEOUT_INPUT" \
          HYBRID_TIMING_CASES="$HYBRID_TIMING_CASES_INPUT" \
          HYBRID_TIMING_BAND_ROWS="$HYBRID_TIMING_BAND_ROWS_INPUT" \
          HYBRID_TIMING_INSTRUMENT="$HYBRID_TIMING_INSTRUMENT_INPUT" \
            .github/scripts/iccdev-hybrid-applyprofiles-timing.sh

      - name: Generate summary
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [ -f "$SANITIZER" ]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
            sanitize_code_line() {
              local s="$1"
              s="${s//$'\r'/}"
              s="${s//$'\n'/ }"
              s="$(printf '%s' "$s" | tr -d '\000-\011\013\014\016-\037\177')"
              s="${s//\`\`\`/\` \` \`}"
              printf '%s' "$s"
            }
          fi

          test_cmd="ctest --test-dir build --output-on-failure --label-exclude slow --no-tests=error"
          timing_report="${BUILD_DIR}/Testing/ctest-output/hybrid-applyprofiles-timing/hybrid-applyprofiles-timing.tsv"
          container_ref="ghcr.io/internationalcolorconsortium/iccdev-ci-regression:${REGRESSION_IMAGE_TAG}"

          {
            echo "### iccDEV CTest Tool Suites"
            echo ""
            echo "| Component | Value |"
            echo "|-----------|-------|"
            echo "| Runner | ubuntu-24.04 |"
            echo "| Container | \`$(sanitize_line "$container_ref")\` |"
            echo "| Compiler | $(sanitize_line "$(g++ --version 2>/dev/null | sed -n '1,1p')") |"
            echo "| GCC | $(sanitize_line "$(gcc --version 2>/dev/null | sed -n '1,1p')") |"
            echo "| CMake | $(sanitize_line "$(cmake --version 2>/dev/null | sed -n '1,1p')") |"
            echo "| Commit | $(sanitize_line "$(git log --oneline -1 | tr -cd '[:print:]')") |"
            echo "| Test command | \`${test_cmd}\` |"
            echo ""
            echo "### Manual Reproduction"
            echo ""
            echo '```bash'
            echo "TOOL_BUILD_TYPE='${TOOL_BUILD_TYPE}'"
            echo "WARN_FLAGS='-Wall -Wextra -Wpedantic -Werror'"
            echo "if [ \"\${TOOL_BUILD_TYPE}\" = Debug ]; then WARN_FLAGS=\"\${WARN_FLAGS} -fno-omit-frame-pointer -g -O0\"; fi"
            echo "cmake -S Build/Cmake -B build -DCMAKE_BUILD_TYPE=\"\${TOOL_BUILD_TYPE}\" \\"
            echo "  -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \\"
            echo "  -DCMAKE_C_FLAGS=\"\${WARN_FLAGS}\" \\"
            echo "  -DCMAKE_CXX_FLAGS=\"\${WARN_FLAGS} -std=c++17\" \\"
            echo "  -DENABLE_SANITIZERS=ON \\"
            echo "  -DSANITIZER_RECOVER=ON -DENABLE_TOOLS=ON -DENABLE_TESTS=ON \\"
            echo "  -DENABLE_WXWIDGETS=OFF -DENABLE_SHARED_LIBS=ON -DENABLE_STATIC_LIBS=ON \\"
            echo "  -DICC_USE_ZLIB=ON"
            echo "cmake --build build --parallel \"\$(nproc)\""
            echo "ctest --test-dir build --output-on-failure --label-exclude slow --no-tests=error"
            echo "ctest --test-dir build -R '^iccdev\\.hybrid-pipeline$' --output-on-failure --no-tests=error"
            echo '```'
            if [ -f "$timing_report" ]; then
              echo ""
              echo "## Hybrid \`iccApplyProfiles\` Timing"
              echo ""
              date -u '+%Y-%m-%d %H:%M:%S UTC'
              echo ""
              printf '| %-10s | %-8s | %-7s | %-6s | %-9s | %-6s | %-8s | %-6s | %-13s | %-7s | %-9s |\n' \
                "Case" "Threads" "Command" "Status" "Elapsed s" "User s" \
                "System s" "RSS KB" "Minor faults" "Vol ctx" "Invol ctx"
              printf '%s%s\n' \
                '|------------|----------|---------|--------|-----------|--------|' \
                '-----------|--------|---------------|----------|------------|'
              tail -n +2 "$timing_report" | while IFS=$'\t' read -r \
                case_name threads command_name status elapsed_s user_s system_s \
                rss faults vol_ctx invol_ctx _log_path; do
                printf '| %-10s | %-8s | %-7s | %-6s | %-9s | %-6s | %-8s | %-6s | %-13s | %-7s | %-9s |\n' \
                  "$(sanitize_line "$case_name")" \
                  "$(sanitize_line "$threads")" \
                  "$(sanitize_line "$command_name")" \
                  "$(sanitize_line "$status")" \
                  "$(sanitize_line "$elapsed_s")" \
                  "$(sanitize_line "$user_s")" \
                  "$(sanitize_line "$system_s")" \
                  "$(sanitize_line "$rss")" \
                  "$(sanitize_line "$faults")" \
                  "$(sanitize_line "$vol_ctx")" \
                  "$(sanitize_line "$invol_ctx")"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"  # elements-sanitized

      - name: Package developer report
        if: ${{ success() }}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [ -f "$SANITIZER" ]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi

          report_dir="${BUILD_DIR}/Testing/ctest-output/developer-report"
          data_dir="${report_dir}/data"
          rm -rf "$report_dir"
          mkdir -p "$data_dir"

          copy_file_if_present() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              cp -f "$src" "$dst"
            fi
          }

          copy_dir_if_present() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              rm -rf "$dst"
              mkdir -p "$(dirname "$dst")"
              cp -a "$src" "$dst"
            fi
          }

          copy_file_if_present "${BUILD_DIR}/build.log" "${data_dir}/build.log"
          copy_file_if_present "${BUILD_DIR}/ctest-list.txt" "${data_dir}/ctest-list.txt"
          copy_file_if_present "${BUILD_DIR}/ctest-results.xml" "${data_dir}/ctest-results.xml"
          copy_dir_if_present \
            "${BUILD_DIR}/Testing/Temporary" \
            "${data_dir}/ctest-temporary"
          copy_dir_if_present \
            "${BUILD_DIR}/Testing/ctest-output/hybrid-applyprofiles-timing" \
            "${data_dir}/hybrid-applyprofiles-timing"
          {
            printf 'iccDEV developer report\n'
            printf '=======================\n\n'
            printf 'Build type: %s\n' "$TOOL_BUILD_TYPE"
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Run: %s\n\n' "${GITHUB_RUN_ID:-local}"
            printf 'Open index.html for the presentation view.\n'
            printf 'Data files are under data/.\n'
          } > "${report_dir}/README.txt"

          html="${report_dir}/index.html"
          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en"><head><meta charset="utf-8">'
            printf '%s\n' '<title>iccDEV Developer Report</title>'
            printf '%s' '<style>body{font-family:system-ui,sans-serif;margin:2rem;'
            printf '%s' 'line-height:1.4}table{border-collapse:collapse;width:100%%;'
            printf '%s' 'margin:1rem 0}th,td{border:1px solid #ddd;padding:.45rem;'
            printf '%s' 'text-align:left}th{background:#f4f6f8}code{background:#f4f6f8;'
            printf '%s' 'padding:.1rem .25rem}.pass{color:#116329}.warn{color:#9a6700}'
            printf '%s\n' '.fail{color:#b42318}</style>'
            printf '%s\n' '</head><body>'
            printf '<h1>iccDEV Developer Report</h1>\n'
            printf '<table><tr><th>Component</th><th>Value</th></tr>\n'
            printf '<tr><td>Build type</td><td>%s</td></tr>\n' "$(escape_html "$TOOL_BUILD_TYPE")"
            printf '<tr><td>Commit</td><td><code>%s</code></td></tr>\n' "$(escape_html "$(git rev-parse --short HEAD)")"
            printf '<tr><td>Run</td><td><code>%s</code></td></tr>\n' "$(escape_html "${GITHUB_RUN_ID:-local}")"
            printf '</table>\n'

            printf '<h2>Included Data</h2><ul>\n'
            find "$data_dir" -type f | sort | while IFS= read -r file; do
              rel="${file#"$report_dir"/}"
              printf '<li><a href="%s">%s</a></li>\n' \
                "$(escape_html "$rel")" \
                "$(escape_html "$rel")"
            done
            printf '</ul></body></html>\n'
          } > "$html"

      - name: Upload developer report
        if: ${{ success() }}
        # preflight: allow-untrusted-artifact reason=sanitized-developer-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iccdev-developer-report-${{ inputs.tool_build_type || 'Debug' }}
          path: ${{ env.BUILD_DIR }}/Testing/ctest-output/developer-report
          if-no-files-found: error
          retention-days: 14

  thread-linkage:
    name: "RefIccMAX thread linkage - manual"
    if: ${{ inputs.thread_linkage_build_type != '' && inputs.thread_linkage_ipo != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    env:
      BASH_ENV: /dev/null
      BUILD_DIR: build-thread-linkage
      THREAD_LINKAGE_BUILD_TYPE: ${{ inputs.thread_linkage_build_type }}
      THREAD_LINKAGE_IPO: ${{ inputs.thread_linkage_ipo }}

    steps:
      - name: Checkout iccDEV
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5  # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          bash .github/scripts/ci-safe-apt-update.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            clang-18 clang++-18 llvm-18 \
            libxml2-dev libtiff-dev libjpeg-dev libpng-dev \
            zlib1g-dev liblzma-dev nlohmann-json3-dev

      - name: Check RefIccMAX thread linkage
        env:
          BASH_ENV: /dev/null
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          run_case() {
            local label="$1"
            shift
            echo "[START] ${label}"
            timeout 60s "$@"
            echo "[PASS] ${label}"
          }

          case "${THREAD_LINKAGE_BUILD_TYPE}" in
            Release|RelWithDebInfo)
              ;;
            *)
              echo "::error title=Invalid build type::${THREAD_LINKAGE_BUILD_TYPE}"
              exit 1
              ;;
          esac

          case "${THREAD_LINKAGE_IPO}" in
            true|True|TRUE|ON|on|1)
              ipo_value=ON
              ;;
            false|False|FALSE|OFF|off|0)
              ipo_value=OFF
              ;;
            *)
              echo "::error title=Invalid IPO value::${THREAD_LINKAGE_IPO}"
              exit 1
              ;;
          esac

          run_case "configure ${THREAD_LINKAGE_BUILD_TYPE} ipo=${ipo_value}" \
            cmake -S Build/Cmake -B "${BUILD_DIR}" \
              -DCMAKE_BUILD_TYPE="${THREAD_LINKAGE_BUILD_TYPE}" \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION="${ipo_value}" \
              -DENABLE_LTO="${ipo_value}" \
              -DENABLE_SANITIZERS=OFF \
              -DENABLE_ASAN=OFF \
              -DENABLE_UBSAN=OFF \
              -DENABLE_INTEGER_SANITIZER=OFF \
              -DENABLE_FLOAT_SANITIZER=OFF \
              -DENABLE_TSAN=OFF \
              -DENABLE_MSAN=OFF \
              -DENABLE_LSAN=OFF \
              -DENABLE_TOOLS=ON \
              -DENABLE_TESTS=OFF \
              -DENABLE_WXWIDGETS=OFF \
              -DENABLE_SHARED_LIBS=ON \
              -DENABLE_STATIC_LIBS=ON \
              -Wno-dev

          run_case "build shared/static IccProfLib2 and iccApplyProfiles" \
            cmake --build "${BUILD_DIR}" \
              --target IccProfLib2 IccProfLib2-static iccApplyProfiles \
              --parallel "$(nproc)"

          run_case "inspect generated thread link interface" \
            grep -q 'INTERFACE_LINK_LIBRARIES "Threads::Threads"' \
              "${BUILD_DIR}/RefIccMAXTargets.cmake"

          run_case "inspect shared library link command" \
            grep -q 'IccCmmThread.cpp.o' \
              "${BUILD_DIR}/IccProfLib/CMakeFiles/IccProfLib2.dir/link.txt"

          run_case "inspect tool link command" \
            grep -q 'libIccProfLib2' \
              "${BUILD_DIR}/Tools/IccApplyProfiles/CMakeFiles/iccApplyProfiles.dir/link.txt"

          if grep -q -- '-pthread' \
              "${BUILD_DIR}/IccProfLib/CMakeFiles/IccProfLib2.dir/link.txt" \
              "${BUILD_DIR}/Tools/IccApplyProfiles/CMakeFiles/iccApplyProfiles.dir/link.txt"; then
            echo "[PASS] pthread flag expanded into generated link.txt"
          elif grep -q '^CMAKE_HAVE_LIBC_PTHREAD:INTERNAL=1$' "${BUILD_DIR}/CMakeCache.txt"; then
            echo "[PASS] pthread symbols resolved by libc; Threads::Threads remains exported"
          else
            echo "::error title=Thread linkage::No -pthread flag or libc pthread resolution found"
            exit 1
          fi

          echo "[PASS] RefIccMAX thread linkage check complete"
