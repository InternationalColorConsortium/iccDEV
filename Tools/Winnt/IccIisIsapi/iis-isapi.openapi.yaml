openapi: 3.1.0
info:
  title: iccDEV IIS ISAPI Sample API
  version: 0.1.0
  description: |
    Starter OpenAPI document for the Windows IIS sample implemented by
    iccIisIsapi.dll. This captures the current HTTP surface, including the
    capability-style, non-enumerated _tool-work artifact model.
servers:
  - url: http://localhost:18081
paths:
  /iccIisIsapi.dll:
    get:
      summary: Query the health, summary, XML, or JSON response
      description: |
        Without query parameters this returns the plain-text summary response.
        With mode=health it returns plain-text `ok`.
        With format=xml it returns a minimal ICC XML document.
        With format=json it returns structured endpoint metadata.
        With format=fromjson it exercises the optional JSON round trip.
      parameters:
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [health]
          description: Use `health` for the liveness response.
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [xml, json, fromjson]
          description: Select a documented structured response.
      responses:
        '200':
          description: Successful summary, health, or XML response.
          content:
            text/plain:
              schema:
                type: string
              examples:
                health:
                  summary: Health mode
                  value: "ok\r\n"
                summary:
                  summary: Default summary
                  value: |
                    iccDEV IIS service
                    Profile spec ver: 4.00
                    XML payload bytes: 786
                    Hello from iccDEV IIS ISAPI!
            application/xml:
              schema:
                type: string
              examples:
                xml:
                  summary: Minimal XML payload
                  value: |
                    <?xml version="1.0" encoding="UTF-8"?>
                    <IccProfile />
    post:
      summary: Upload ICC or XML input and run the IIS tool pipeline
      description: |
        Runs iccToXml, iccFromXml, iccDumpProfile, iccPawgReport, and
        iccRoundTrip. The request also runs iccToJson and iccFromJson when
        those optional binaries are installed. The PAWG output is persisted as
        a downloadable text report. The request succeeds at the HTTP level when
        the upload is accepted and processed, even if one or more wrapped tools
        report findings or fail.
      parameters:
        - in: header
          name: X-ICCDEV-Request
          required: true
          schema:
            type: string
            const: '1'
          description: Required cross-site request defense for tool execution.
        - in: query
          name: mode
          required: true
          schema:
            type: string
            enum: [tools]
        - in: query
          name: input
          required: true
          schema:
            type: string
            enum: [icc, xml]
        - in: query
          name: filename
          required: false
          schema:
            type: string
          description: Optional client-supplied base name. The server forces `.icc` or `.xml`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '200':
          description: Tool suite completed and returned per-tool results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolSuiteResponse'
        '400':
          description: Request rejected before tool execution completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing request marker or cross-site request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request media type does not match the selected input kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Four analysis requests are already active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unhandled extension failure.
          content:
            text/plain:
              schema:
                type: string
  /_tool-work/:
    get:
      summary: Denied tool workspace root
      description: Directory browsing and root metadata disclosure are disabled.
      responses:
        '403':
          description: Directory browsing is forbidden.
  /_tool-work/{jobId}/:
    get:
      summary: Per-request workspace manifest page
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
          description: 128-bit identifier from the Windows system cryptographic RNG.
      responses:
        '200':
          description: HTML page for a persisted tool run workspace.
          content:
            text/html:
              schema:
                type: string
  /_tool-work/{jobId}/{artifactName}:
    get:
      summary: Download a persisted upload, generated artifact, or log
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - in: path
          name: artifactName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Persisted artifact content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            text/xml:
              schema:
                type: string
components:
  schemas:
    ToolSuiteResponse:
      type: object
      required:
        - mode
        - input
        - workspace_url
        - tools
      properties:
        mode:
          type: string
          enum: [tools]
        input:
          $ref: '#/components/schemas/ToolInput'
        workspace_url:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolResult'
    ToolInput:
      type: object
      required:
        - kind
        - filename
        - bytes
        - url
      properties:
        kind:
          type: string
          enum: [icc, xml]
        filename:
          type: string
        bytes:
          type: integer
          minimum: 0
        url:
          type: string
    ToolResult:
      type: object
      required:
        - name
        - exit_code
        - ok
        - skipped
        - note
        - output
        - log_name
        - log_bytes
        - log_url
        - artifact_name
        - artifact_bytes
        - artifact_url
        - artifact_preview
      properties:
        name:
          type: string
        exit_code:
          type: integer
        ok:
          type: boolean
        skipped:
          type: boolean
        note:
          type: string
        output:
          type: string
        log_name:
          type: string
        log_bytes:
          type: integer
          minimum: 0
        log_url:
          type: string
        artifact_name:
          type: string
        artifact_bytes:
          type: integer
          minimum: 0
        artifact_url:
          type: string
        artifact_preview:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
